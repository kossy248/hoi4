l_english:
 sr_balkan_federation:0 "Lito’s Balkan Policy"
 sr_balkan_federation_desc:0 "After completing each country’s influence focus, we can support socialist movements. At 60% communist support, a socialist government can be established. Once Yugoslavia, Albania, Bulgaria, Greece and Romania are communist, peaceful, and independent or our subjects, they can unite into one federation under our patronage. Human players and foreign subjects are excluded."
 sr_balkan_form_federation:0 "Establish the Socialist Balkan Federation"
 sr_balkan_form_federation_desc:0 "For 100 political power, the five countries unite into one Soviet puppet state. Yugoslavia serves as its legal host and receives the territory and troops of the other four countries. The Federal People’s Council leads the federation; Lito remains in Moscow. Only owned states bearing a core of one of the five founders gain an additional Yugoslav core. Members of foreign factions leave peacefully before unification; faction leaders cannot participate. No territory of third countries is transferred."
 sr_balkan_integrate_federation:0 "Integrate the Balkan Federation into the Union"
 sr_balkan_integrate_federation_desc:0 "The federation initially remains our separate puppet state. Once we directly own and control all core states of Poland and Turkey, we may integrate it into the Soviet Union for 150 political power. Its territory and troops transfer to us. Proclaiming the Socialist Federal Slavic Union remains a separate decision with its own requirements."
 sr_balkan_designated_subject_ready_tt:0 "The designated Balkan Federation exists, is AI-controlled, is our subject, and is at peace without leading a faction."
 YUG_sr_balkan_federal_council:0 "Federal People’s Council"
 YUG_sr_balkan_federal_council_desc:0 "A joint council represents the five founding republics of the Socialist Balkan Federation. Its government follows Titoism under Lito’s Soviet patronage."
 YUG_LITO_BALKAN:0 "Socialist Balkan Federation"
 YUG_LITO_BALKAN_DEF:0 "the Socialist Balkan Federation"
 YUG_LITO_BALKAN_ADJ:0 "Balkan"
 YUG_LITO_BALKAN_communism:0 "Socialist Balkan Federation"
 YUG_LITO_BALKAN_communism_DEF:0 "the Socialist Balkan Federation"
 YUG_LITO_BALKAN_communism_ADJ:0 "Balkan"
 sr_balkan_yugoslavia_member_ready_tt:0 "Yugoslavia exists, is communist, AI-controlled and at peace; it is independent or our subject and leads no faction. Members of foreign factions leave peacefully before unification."
 sr_balkan_propaganda_yugoslavia:0 "Support the Socialist Movement in Yugoslavia"
 sr_balkan_propaganda_yugoslavia_desc:0 "Spend 50 political power to support the socialist movement in Yugoslavia. Communist support rises by 8 percentage points, and an influence network lasts 365 days. Repeatable every 180 days; requires an AI government, peace with us, and no foreign overlord."
 sr_balkan_socialist_government_yugoslavia:0 "Support a Socialist Government in Yugoslavia"
 sr_balkan_socialist_government_yugoslavia_desc:0 "At 60% communist support, spend 75 political power to help establish a communist government in Yugoslavia. The country initially remains separate. This decision starts no war and becomes available again after at least 365 days."
