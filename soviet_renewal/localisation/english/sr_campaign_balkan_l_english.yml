l_english:
 sr_cb_1_t:0 "A Comrade Does Not Write an Order"
 sr_cb_1_home_d:0 "Kardelj arrives in Moscow with a slim briefcase. He thanks Lito for the help given to his homeland, then places a draft treaty on the table. Its final page remains unsigned.\n\n'A gift places an obligation on its recipient,' he says. 'A treaty places obligations on both sides.' Yugoslavia wants machinery and dependable deliveries, but no instruction on how to run every factory. Lito recognizes the language of his own federal speeches. This time, someone across the border is addressing it to him."
 sr_cb_1_equal_d:0 "Kardelj has brought the earlier exchange agreements. Between the signatures lie handwritten notes from Yugoslav factory councils: spare parts arrive late, technical specifications do not match, and every misunderstanding needs another letter to Moscow.\n\n'Equal conditions are a beginning,' Kardelj says. 'Now we need equal rights in interpreting them.' He proposes a joint treaty. Lito can turn their carefully maintained partnership into a lasting institution, or end the uncertainty through Soviet delivery instructions."
 sr_cb_1_other_d:0 "The Soviet delegation expects a discussion about delivery quantities. Kardelj begins with a question: who may change the common plan when it does not work in a Yugoslav factory?\n\nNobody opposes the exchange. The dispute concerns the political meaning of a signature. Kardelj wants a treaty between socialist partners; several Soviet officials consider the distinction unnecessary. Lito asks that both drafts remain on the table. He must decide which one the negotiators will continue."
 sr_cb_1_a:0 "Negotiate a reciprocal treaty. (60 political power)"
 sr_cb_1_b:0 "Reliable deliveries need clear Soviet instructions."
 sr_cb_contract_followup_tt:0 "The joint commission reports in 90 days. Reciprocity grants +2% construction speed for 180 days at a cost of 0.05 daily political power, and +4 trust. Instructions grant 35 political power immediately, +4% factory output and −3 percentage points stability for 180 days, but cost 5 trust."
 sr_cb_2_t:0 "The Common Plan Stops at Customs"
 sr_cb_2_joint_d:0 "The first freight train has reached the border. Its cargo is complete, but three authorities interpret the same treaty clause differently. In Belgrade, a spare part belongs to the machinery delivered; the Soviet freight document treats it as a new order. The wagons wait.\n\nKardelj proposes a joint customs and standards commission with equal votes. Soviet specialists can also settle the dispute faster: by making their interpretation binding. Lito finds no great political question recorded in the report. The stationary train asks it anyway."
 sr_cb_2_orders_d:0 "Soviet delivery instructions have simplified the figures and multiplied the complaints. Yugoslav factories receive the quantities ordered, but must await permission for every change. Wagons carrying disputed spare parts now collect at the border.\n\nKardelj demands a joint commission. 'We can learn from your experience,' he says, 'without needing every one of your signatures.' Lito can withdraw the instructions and reopen equal negotiations, or treat the dispute as proof that still clearer orders are needed."
 sr_cb_2_a:0 "Both sides receive an equal voice. (35 political power)"
 sr_cb_2_b:0 "Our interpretation remains binding."
 sr_cb_standards_followup_tt:0 "A treaty review follows after another 90 days. The joint commission costs 35 political power, adds 3 trust and removes Soviet delivery instructions if present. Binding instructions grant 20 political power but cost 4 trust. The final consequences depend on this choice."
 sr_cb_3_t:0 "The Second Signature"
 sr_cb_3_joint_d:0 "The commission returns a treaty longer than its first draft. Each additional page answers a question previously settled in a personal letter to Lito or Kardelj. Border officials now read freight documents by the same rules.\n\nKardelj signs first and passes the pen. He promises no permanent agreement on everything. He promises a procedure for the next dispute. For Lito, this is a small achievement with a large meaning: socialist cooperation need not depend every time on his personal authority."
 sr_cb_3_orders_d:0 "Delivery targets have been met. The foreign commissariat calls the treaty a success; the word is absent from Kardelj’s covering letter. Instead, he lists changes requested by Yugoslav factories and refused.\n\n'We have understood your instructions,' he writes. 'Our objections have not thereby been answered.' Goods continue to move. The political partnership carries a new burden that cannot be measured in tonnes or wagons. Lito files the successful statistics together with the letter."
 sr_cb_3_a:0 "A treaty lasts when both sides can change it."
 sr_cb_3_b:0 "The figures are right. Distrust remains."
 sr_cb_4_t:0 "The People’s Council Demands the Books"
 sr_cb_4_grievance_d:0 "This time, the Balkan Federation’s complaint is not a general resolution. The Federal People’s Council sends account statements, minutes and three unanswered requests to inspect adviser budgets. The old allegations of exclusion now have file numbers.\n\nA delegate writes to Lito: 'If we govern together, we must also be allowed to examine the accounts together.' An independent audit would cost money and political work. New binding production targets would be simpler to announce. Lito knows why that simpler answer might be demanded again."
 sr_cb_4_cooperation_d:0 "The Federal People’s Council wants to coordinate the next budget with its Soviet partners. Its papers contain an unusual number of questions: which expenses may republics change themselves? Who examines jointly financed factories? Where may a minority in the council challenge a decision?\n\nCooperation has created enough trust to ask these questions openly. Lito can finance an independent audit and make the rules precise, or use the existing cohesion to enforce new targets without further procedures."
 sr_cb_4_a:0 "The council receives an independent audit. (50 political power)"
 sr_cb_4_b:0 "First we need binding common targets."
 sr_cb_federal_followup_tt:0 "A review of federal rights follows in 90 days. The audit costs 50 political power and grants the Union +2 percentage points stability at a cost of 0.05 daily political power for 180 days. Binding targets grant 30 political power immediately but cost 4 trust."
 sr_cb_5_t:0 "An Audit File Is Not Yet a Right"
 sr_cb_5_audit_d:0 "The auditors have finished. They find no single grand embezzlement, but a procedure in which almost every local decision needs another approval. The council bears responsibility for results without controlling all the means.\n\nDelegates now demand enforceable budget and amendment rights. Soviet advisers warn that decisions will become slower. Lito can turn the audit into a binding reform. Otherwise, a neatly maintained archive will remain, describing conditions everyone knows and nobody may change."
 sr_cb_5_targets_d:0 "The new targets have been announced, and advisers can complete their tables faster. Several council seats remain empty during the final vote. The absent delegates leave a common statement: responsibility without amendment rights is not federal participation.\n\nLito can now guarantee the council’s budget rights. Alternatively, he can confirm the advisers’ rules and demand delivery. The second letter is already drafted. The first would require additional resources and a political confrontation with his own staff."
 sr_cb_5_a:0 "Give the council binding budget rights. (60 political power)"
 sr_cb_5_b:0 "Confirm the advisers’ rules."
 sr_cb_federal_budget_tt:0 "The common budget is reviewed after 120 days. Guarantees cost 60 political power, add 5 trust and grant the Balkan Federation +3 percentage points stability at a cost of 2% factory output for 365 days. Confirmation grants 20 political power, costs 5 trust and gives the federation +4% factory output at a cost of 0.10 daily political power for 365 days."
 sr_cb_6_t:0 "What Found a Voice in the Budget"
 sr_cb_6_guarantees_d:0 "The budget debate lasts one day longer than expected. The last amendment concerns a small rail connection barely visible in Soviet summaries. For one republic, it determines whether its factory can deliver throughout winter. The motion passes after an open vote.\n\nThe Federal People’s Council sends Lito the minutes. Delegates argued, amended and finally gave their own approval. The common budget has not become cheaper. It has gained something no outside order can supply: officials prepared to defend it as their own decision."
 sr_cb_6_orders_d:0 "The budget has been confirmed. On paper, production targets fit together, but two republics challenge their allocations. Advisers point to decisions already made. The council can collect petitions without deciding on them.\n\nThe result is paralysis produced by scrupulously respected jurisdictions. Everyone awaits the next office’s signature. Lito had intended to secure effective government. Now he reads reports naming this very arrangement as the cause of delay."
 sr_cb_6_a:0 "A jointly amended plan can be jointly supported."
 sr_cb_6_b:0 "A confirmed table cannot replace consent."
 sr_cb_7_t:0 "Many Names Beneath One Flag"
 sr_cb_7_d:0 "The new flag hangs above the Socialist Federal Slavic Union’s assembly hall. Beneath it, administrations with different languages, legal terms and experiences of Moscow must learn to work together. The founding celebration has ended; the first petition needs an understandable reply.\n\nThe constitutional committee presents two drafts. One funds translations and shared amendment procedures. The other adopts the central order and leaves additional languages to local implementation. Either can be adopted today. Only later will it become clear who can read the new charter as their own."
 sr_cb_7_a:0 "The charter must be understood in all its languages. (60 political power)"
 sr_cb_7_b:0 "A common centre supplies the binding text."
 sr_cb_charter_followup_tt:0 "Delegates review language and petition rights in 120 days. Multilingual drafting costs 60 political power, consumes 0.10 daily political power for 240 days and adds 4 trust. The central text grants 40 political power immediately but costs 4 trust."
 sr_cb_8_t:0 "The Word Missing from the Charter"
 sr_cb_8_broken_d:0 "The Georgian delegation places the old promise of cultural rights beside the new constitutional draft. Lito’s name appears on both papers. Only one describes a procedure that has actually been honoured.\n\n'This time we are asked to trust the text,' a delegate says. 'Last time we were asked to trust the chairman’s word.' She demands clear language rights and a route to challenge a refusal. Lito can amend the draft and acknowledge the old political debt, or have officials explain that the general text already contains everything necessary."
 sr_cb_8_other_d:0 "A translator asks whether a petition has the same standing when written in a language other than that of the central administration. Lawyers find several possible answers. To someone waiting for a decision, those answers are not equivalent.\n\nDelegates demand a more precise statement of language and appeal rights. Lito can order further drafting or stand by the present text. The dispute concerns a few lines, but many future decisions will rely on them."
 sr_cb_8_a:0 "Make language and petition rights binding. (40 political power)"
 sr_cb_8_b:0 "Keep the existing text."
 sr_cb_charter_report_tt:0 "A constitutional review follows after another 120 days. Revision costs 40 political power, adds 5 trust and reduces represented Georgia’s resistance by 10. Keeping the text grants 20 political power; a central text also costs 5 trust. A multilingual or revised order produces different final consequences from an unchanged central order."
 sr_cb_9_t:0 "The Charter Becomes Everyday Life"
 sr_cb_9_plural_d:0 "The first complaint under the new rules does not end with a visit to Lito. A local committee receives it, a translation is attached and the responsible office explains its decision. The petitioner does not win every point. They receive an answer that can be challenged through a known procedure.\n\nThe new Union has not achieved unanimity. It has created something more durable: even people who disagree with a decision can remain participants in their common institutions. Lito reads the case report to the last page and files it without issuing a personal instruction."
 sr_cb_9_central_d:0 "The central text has unified administration. Decisions move through departments faster, and the government less often mediates between conflicting local rules.\n\nComplaint reports have not grown shorter. They simply return more often with the same answer: the binding interpretation already exists. A strong centre is growing beneath the new flag. For many people, their common order remains something speaking to them from the capital without granting them an equal voice."
 sr_cb_9_a:0 "This charter does not need my signature for every answer."
 sr_cb_9_b:0 "The centre can decide. It must continue to persuade."
 sr_cb_reciprocal_trade:0 "Reciprocal Economic Treaty"
 sr_cb_reciprocal_trade_desc:0 "Common delivery rules grant +2% construction speed for 180 days at a cost of 0.05 daily political power."
 sr_cb_directed_deliveries:0 "Soviet Delivery Instructions"
 sr_cb_directed_deliveries_desc:0 "Binding instructions grant +4% factory output for 180 days but reduce stability by 3 percentage points."
 sr_cb_joint_standards:0 "Jointly Adopted Standards"
 sr_cb_joint_standards_desc:0 "Coordinated technical procedures grant +3% production efficiency growth for 365 days."
 sr_cb_partner_resentment:0 "A Partner Passed Over"
 sr_cb_partner_resentment_desc:0 "Unanswered objections burden cooperation for 270 days: −0.10 daily political power and −2 percentage points stability."
 sr_cb_federal_audit:0 "Opening the Budget Books"
 sr_cb_federal_audit_desc:0 "An independent audit costs 0.05 daily political power and grants +2 percentage points stability for 180 days."
 sr_cb_federal_guarantees:0 "Binding Rights of the People’s Council"
 sr_cb_federal_guarantees_desc:0 "Guaranteed amendment rights grant the Balkan Federation +3 percentage points stability for 365 days; the transition costs 2% factory output."
 sr_cb_federal_compliance:0 "Confirmed Adviser Administration"
 sr_cb_federal_compliance_desc:0 "Stricter coordination grants the Balkan Federation +4% factory output at a cost of 0.10 daily political power for 365 days."
 sr_cb_federal_deadlock:0 "Responsible but Unable to Decide"
 sr_cb_federal_deadlock_desc:0 "A blocked federal budget reduces stability by 4 percentage points and construction speed by 3% for 270 days."
 sr_cb_charter_translation:0 "A Charter in Many Languages"
 sr_cb_charter_translation_desc:0 "Translations and binding common procedures consume 0.10 daily political power for 240 days."
 sr_cb_plural_institutions:0 "A Charter with Voices of Its Own"
 sr_cb_plural_institutions_desc:0 "Multilingual, accountable institutions grant +3 percentage points stability for 540 days; additional coordination costs 1% construction speed."
 sr_cb_central_institutions:0 "One Binding Centre"
 sr_cb_central_institutions_desc:0 "The central order grants +0.10 daily political power for 540 days but reduces stability by 3 percentage points."
