l_german:
 sr_agitprop:0 "Litos Agitprop: Worte, die morgen werden"
 sr_agitprop_campaign_lock_tt:0 "Während der angegebenen Laufzeit ist keine weitere Agitprop-Kampagne möglich. Ihre Boni enden mit der Kampagne; sie stapeln sich nicht dauerhaft."
 sr_agitprop_councils:0 "Die Räte vergessen nicht"
 sr_agitprop_councils_desc:0 "Eine Hand hält ein Protokoll, eine andere eine verschlissene Arbeitsmütze. Das Plakat erinnert die Führung daran, dass Mitsprache mehr bedeutet als eine freundliche Rede. Die Kampagne öffnet Versammlungssäle und veröffentlicht die Antworten der Verwaltung.\n\n180 Tage: Fabrikausstoß +3 %; Stabilität +3 Prozentpunkte. Zusätzlich +6 Vertrauen; aktive Republiken verlieren je 5 Widerstand.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_councils_spirit:0 "Die Räte vergessen nicht"
 sr_agitprop_councils_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Fabrikausstoß +3 %; Stabilität +3 Prozentpunkte. Zusätzlich +6 Vertrauen; aktive Republiken verlieren je 5 Widerstand."
 sr_agitprop_desc:0 "Ein Plakat kann kein gebrochenes Versprechen erfüllen. Es kann aber Menschen für einen gemeinsamen nächsten Schritt gewinnen. Hier läuft höchstens eine Kampagne gleichzeitig. Jede Kampagne hat eine feste Laufzeit und frühestens nach 180 Tagen kann derselbe Titel erneut gewählt werden. Das aktive Motiv steht links; die endgültigen Poster folgen später aus deiner Bildvorlage.\n\nVertrauen in Litos Regierung: [?sr_story_trust|0]/100."
 sr_agitprop_earth:0 "Die Erde gehört den Arbeitenden"
 sr_agitprop_earth_desc:0 "Über einem Globus reichen sich Belegschaften die Hände. Die Kampagne wirbt für Austauschprogramme und sozialistische Zusammenarbeit, ohne den Partnern ihre Stimme zu nehmen. Eine größere Welt beginnt mit einer glaubwürdigen Einladung.\n\n180 Tage: Unterhaltskosten verbesserter Beziehungen −20 %; tägliche politische Macht +0,10. Nur im Frieden verfügbar.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_earth_spirit:0 "Die Erde gehört den Arbeitenden"
 sr_agitprop_earth_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Unterhaltskosten verbesserter Beziehungen −20 %; tägliche politische Macht +0,10. Nur im Frieden verfügbar."
 sr_agitprop_horizon:0 "Unser Morgen kennt keine Grenzen"
 sr_agitprop_horizon_desc:0 "Ein offenes Lehrbuch wird von Händen aus mehreren Republiken gehalten. Lito lässt Übersetzungen, öffentliche Vorträge und technische Wanderausstellungen finanzieren. Wissen soll reisen können, ohne an einem Amtszimmer zu enden.\n\n180 Tage: Forschungsgeschwindigkeit +4 %.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_horizon_spirit:0 "Unser Morgen kennt keine Grenzen"
 sr_agitprop_horizon_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Forschungsgeschwindigkeit +4 %."
 sr_agitprop_light:0 "Für die Union bis zum letzten Licht"
 sr_agitprop_light_desc:0 "Am Bahnhof brennt noch Licht, während der letzte Lazarettzug einfährt. Das Plakat spricht von denen, die die Union verteidigen und von denen, die sie versorgen. Sein Versprechen lautet, dass niemand allein zurückbleibt.\n\n90 Tage: Erholungsrate des Heeres +6 %; Kriegsunterstützung +5 Prozentpunkte; Nachschubverbrauch −3 %. Nur im Krieg verfügbar.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_light_spirit:0 "Für die Union bis zum letzten Licht"
 sr_agitprop_light_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 90 Tage. Erholungsrate des Heeres +6 %; Kriegsunterstützung +5 Prozentpunkte; Nachschubverbrauch −3 %. Nur im Krieg verfügbar."
 sr_agitprop_no_active_campaign_tt:0 "Keine andere Agitprop-Kampagne läuft."
 sr_agitprop_peoples:0 "Elf Völker – ein gemeinsamer Morgen"
 sr_agitprop_peoples_desc:0 "Nicht dieselbe Sprache, nicht dieselbe Landschaft, aber ein gemeinsames Recht auf morgen. Die Kampagne zeigt die elf frühen Republiken unserer Zeitlinie als Partner. Später aufgenommene Republiken werden durch denselben Gleichheitsanspruch vertreten.\n\n180 Tage: Stabilität +4 Prozentpunkte; tägliche politische Macht +0,05. Zusätzlich +5 Vertrauen und +0,02 Unionsbalance.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_peoples_spirit:0 "Elf Völker – ein gemeinsamer Morgen"
 sr_agitprop_peoples_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Stabilität +4 Prozentpunkte; tägliche politische Macht +0,05. Zusätzlich +5 Vertrauen und +0,02 Unionsbalance."
 sr_agitprop_sky:0 "Kein Himmel gehört den Tyrannen"
 sr_agitprop_sky_desc:0 "Ein Pilot und eine Mechanikerin blicken zum gleichen Flugzeug auf. Der Sieg in der Luft beginnt mit einer unversehrten Maschine und einer Besatzung, die ihrem Können vertraut. Rekorde sind willkommen; ein sicher zurückgekehrter Flug zählt mehr.\n\n180 Tage: Luftmissionseffizienz +4 %; Luftunfälle −5 %.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_sky_spirit:0 "Kein Himmel gehört den Tyrannen"
 sr_agitprop_sky_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Luftmissionseffizienz +4 %; Luftunfälle −5 %."
 sr_agitprop_star:0 "Solange ein Stern über uns brennt"
 sr_agitprop_star_desc:0 "Litos Gesicht soll nicht über den Versprechen stehen, die er gegeben hat. Der rote Stern auf diesem Plakat gehört den Menschen, die die Union im Alltag zusammenhalten: auf dem Bahnhof, im Hospital und am Verhandlungstisch.\n\n180 Tage: Stabilität +4 Prozentpunkte; Kriegsunterstützung +3 Prozentpunkte.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_star_spirit:0 "Solange ein Stern über uns brennt"
 sr_agitprop_star_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Stabilität +4 Prozentpunkte; Kriegsunterstützung +3 Prozentpunkte."
 sr_agitprop_steel:0 "Aus Stahl wird Zukunft"
 sr_agitprop_steel_desc:0 "Ein Hochofen leuchtet gegen die Nacht. Darunter stehen keine unerfüllbaren Rekordzahlen, sondern die Namen der Belegschaften, die ihre Verfahren an andere Werke weitergeben. Der nächste Produktionsschub soll eine Zukunft bauen, die den Arbeitenden gehört.\n\n180 Tage: Fabrikausstoß +6 %; Baugeschwindigkeit +3 %.\n\nEs kann nur eine Agitprop-Kampagne gleichzeitig laufen."
 sr_agitprop_steel_spirit:0 "Aus Stahl wird Zukunft"
 sr_agitprop_steel_spirit_desc:0 "Eine laufende Agitprop-Kampagne unterstützt dieses Regierungsziel für 180 Tage. Fabrikausstoß +6 %; Baugeschwindigkeit +3 %."
 sr_union_amnesty_guarantees:0 "Garantien für die Rückkehr"
 sr_union_amnesty_guarantees_desc:0 "Die zugesicherten Amnestieregeln binden für 120 Tage Personal. Heeresorganisation: −2 %."
 sr_union_budget_reserve_tt:0 "Die Reserve läuft nach 365 Tagen aus. Unter −0,20 Balance kann sie einmalig für 85 politische Macht, +0,06 Balance und +3 Vertrauen freigegeben werden."
 sr_union_central_emergency_powers:0 "Die Zentrale verlangt Vollmacht"
 sr_union_central_emergency_powers_desc:0 "Einmalig während eines Krieges und bei Balance unter −0,20: +100 politische Macht und +5 Prozentpunkte Kriegsunterstützung. Der Preis sind −0,12 Balance und −10 Vertrauen. Für 180 Tage: +0,10 tägliche politische Macht, aber −4 Prozentpunkte Stabilität. Diese Vollmacht ist kein Weg zur föderalen Versöhnung."
 sr_union_compromise_budget:0 "Der Preis eines Kompromisses"
 sr_union_compromise_budget_desc:0 "Für 90 Tage werden Aufträge neu verteilt. Fabrikausstoß: −3 %."
 sr_union_delegate_congress:0 "Die Republiken an einen Tisch"
 sr_union_delegate_congress_desc:0 "Stühle und Übersetzer reichen nicht. Die Delegierten erhalten feste Verhandlungsrechte und Zeit für Beschlüsse. Für 75 politische Macht: +0,08 Unionsbalance und +6 Vertrauen. Die ständigen Sitzungen kosten für 120 Tage täglich 0,10 politische Macht. Alle 240 Tage verfügbar."
 sr_union_delegate_sessions:0 "Delegierte bleiben am Tisch"
 sr_union_delegate_sessions_desc:0 "Die Unionsverwaltung finanziert für 120 Tage dauerhafte Delegationen. Tägliche politische Macht: −0,10."
 sr_union_emergency_compromise:0 "Ein Handschlag vor dem Abgrund"
 sr_union_emergency_compromise_desc:0 "Wenn die Balance unter −0,20 fällt, kann Lito bei mindestens 20 Vertrauen einen dringenden Kompromiss finanzieren. Für 90 politische Macht: +0,15 Balance und +8 Vertrauen; −2 Prozentpunkte Stabilität. Neu verteilte Aufträge kosten 90 Tage lang 3 % Fabrikausstoß. Abklingzeit: 365 Tage."
 sr_union_joint_war_council:0 "Kein Krieg ohne die Republiken"
 sr_union_joint_war_council_desc:0 "Während eines Krieges erhält jede Republik eine Stimme bei der gemeinsamen Planung. Für 60 politische Macht: +0,07 Balance, +3 Vertrauen und +3 Prozentpunkte Kriegsunterstützung. Für 180 Tage: +5 % Planungsgeschwindigkeit, aber −2,5 % Fabrikausstoß durch neu abgestimmte Lieferpläne. Abklingzeit: 180 Tage."
 sr_union_joint_war_planning:0 "Ein Kriegsrat aller Republiken"
 sr_union_joint_war_planning_desc:0 "Gemeinsame Planung erhöht für 180 Tage die Planungsgeschwindigkeit um 5 %, unterbricht aber Lieferpläne: Fabrikausstoß −2,5 %."
 sr_union_plan_audit:0 "Der Plan wird öffentlich geprüft"
 sr_union_plan_audit_desc:0 "Betriebe unterbrechen einen Teil ihrer Arbeit für eine öffentliche Überprüfung. Fabrikausstoß: −3 % für 90 Tage."
 sr_union_prepare_budget_reserve:0 "Für den Tag der Krise vorsorgen"
 sr_union_prepare_budget_reserve_desc:0 "Im Frieden und bei mindestens 55 Vertrauen legt der Unionsrat für 60 politische Macht eine Haushaltsreserve an. Sie bleibt 365 Tage verfügbar und kann nur bei Balance unter −0,20 freigegeben werden. Das bindet heute Mittel, statt einen sofortigen Bonus zu geben. Neue Vorsorge nach 365 Tagen."
 sr_union_public_plan_audit:0 "Den Plan vor den Menschen öffnen"
 sr_union_public_plan_audit_desc:0 "Im Frieden werden die Zahlen des föderalen Plans öffentlich überprüft. Kosten: 55 politische Macht. +0,04 Balance, +4 Vertrauen und −5 Widerstand in jeder vertretenen Republik. Die Überprüfung unterbricht Lieferpläne: 90 Tage −3 % Fabrikausstoß. Abklingzeit: 180 Tage."
 sr_union_release_budget_reserve:0 "Die Reserve hält das Versprechen"
 sr_union_release_budget_reserve_desc:0 "Die vorbereitete Reserve wird in der Krise genau einmal aufgelöst: +85 politische Macht, +0,06 Balance und +3 Vertrauen. Danach ist diese Reserve verbraucht. Die Entscheidung erfordert eine noch bestehende Reserve und Balance unter −0,20."
 sr_union_republic_amnesty:0 "Die Türen für eine Rückkehr öffnen"
 sr_union_republic_amnesty_desc:0 "Bei Massenstreiks bietet Lito eine kontrollierte Amnestie an. Kosten: 100 politische Macht. Jede vertretene Republik verliert 15 Widerstand; +8 Vertrauen und +0,06 Balance. Die Garantien kosten 3 Prozentpunkte Kriegsunterstützung und für 120 Tage 2 % Heeresorganisation. Abklingzeit: 365 Tage."
 sr_union_wartime_secretariat:0 "Außerordentliche Vollmachten"
 sr_union_wartime_secretariat_desc:0 "Die Kriegszentrale beschleunigt Entscheidungen für 180 Tage und schränkt Mitsprache ein. Tägliche politische Macht: +0,10; Stabilität: −4 Prozentpunkte."
