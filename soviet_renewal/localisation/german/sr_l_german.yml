l_german:
 SOV_cosif_kozs_lito:0 "Cosif Kozs Lito"
 SOV_cosif_kozs_lito_desc:0 "Ein Revolutionär mit jugoslawischen Wurzeln, der in Russland blieb und die Führung der Sowjetunion übernahm. Lito will eine starke, föderale Union schaffen. Seine Bewährungsprobe ist der Widerspruch zwischen Selbstverwaltung und der Macht der Partei."
 sr_agricultural_cooperatives:0 "Landwirtschaftliche Genossenschaften"
 sr_agricultural_cooperatives_desc:0 "Verlässliche Lieferungen senken den Konsumgüterfaktor um 2 Prozentpunkte."
 sr_balkan_exchange:0 "Wissenschaftlicher Austausch"
 sr_balkan_exchange_desc:0 "Kontakte zur jugoslawischen Heimat und ihrer Diaspora erhöhen die Forschungsgeschwindigkeit um 5 Prozent."
 sr_central_coordination:0 "Zentrale Koordination"
 sr_central_coordination_desc:0 "Fabrikausstoß: +2,5 %. Tägliche politische Macht: −0,05."
 sr_civil_electronics_bonus:0 "Föderale Elektronikforschung"
 sr_civil_industry_bonus:0 "Föderale Industrieforschung"
 sr_exp_charter_army:0 "Armee im Dienst des Unionsvertrags"
 sr_exp_charter_army_desc:0 "Heeresorganisation: +2 % für 730 Tage."
 sr_exp_civil_service:0 "Eine verständliche Verwaltung"
 sr_exp_civil_service_desc:0 "Täglich +0,05 politische Macht für 730 Tage."
 sr_exp_development_school_bonus:0 "Erfahrungen des föderalen Aufbaus"
 sr_exp_federal_legal_service:0 "Föderaler Rechtsdienst"
 sr_exp_federal_legal_service_desc:0 "Stabilität: +3 Prozentpunkte; täglich −0,03 politische Macht für 730 Tage."
 sr_exp_field_medical_network:0 "Sanitätsnetz der Republiken"
 sr_exp_field_medical_network_desc:0 "Personalrückführung: +3 %; Erholung der Heeresorganisation: +3 % für 730 Tage."
 sr_exp_local_defence:0 "Örtliche Verteidigungsregister"
 sr_exp_local_defence_desc:0 "Verteidigung auf Kerngebiet: +3 %; Eingrabungsgeschwindigkeit: +3 % für 730 Tage."
 sr_exp_maintenance_union:0 "Gemeinsame Wartungsbücher"
 sr_exp_maintenance_union_desc:0 "Wachstum der Produktionseffizienz: +3 %; Fabrikausstoß: −1 % für 730 Tage."
 sr_exp_officer_compact_bonus:0 "Lehren der gemeinsamen Front"
 sr_exp_petition_service:0 "Ein offener Eingabedienst"
 sr_exp_petition_service_desc:0 "Die Bearbeitung direkter Eingaben kostet für 365 Tage täglich 0,03 politische Macht."
 sr_exp_repair_columns:0 "Mobile Reparaturkolonnen"
 sr_exp_repair_columns_desc:0 "Nachschubverbrauch: −3 %; Fabrikausstoß: −1 % für 730 Tage."
 sr_exp_signals_bonus:0 "Gemeinsame Signaltechnik"
 sr_exp_translation_chambers:0 "Dolmetscherkammern der Republiken"
 sr_exp_translation_chambers_desc:0 "Stabilität: +2 Prozentpunkte; täglich −0,03 politische Macht für 365 Tage."
 sr_exp_workplace_charter:0 "Föderales Betriebsstatut"
 sr_exp_workplace_charter_desc:0 "Stabilität: +2 Prozentpunkte; Fabrikausstoß: +2 %; täglich −0,03 politische Macht für 730 Tage."
 sr_exp_workshop_standard_bonus:0 "Gemeinsame Werkstattstandards"
 sr_federal_charter:0 "Föderaler Unionsvertrag"
 sr_federal_charter_desc:0 "Verbindliche Verfahren erleichtern die Zusammenarbeit. Tägliche politische Macht: +0,10."
 sr_federal_planning:0 "Föderale Investitionsplanung"
 sr_federal_planning_desc:0 "Gemeinsame Investitionen erhöhen die Baugeschwindigkeit um 5 %."
 sr_industrial_research:0 "Föderale Industrieforschung"
 sr_lito_academy_network:0 "Die Akademien vernetzen"
 sr_lito_academy_network_desc:0 "Ein gemeinsames Forschungsprogramm gewährt einen 50-Prozent-Bonus für Industrietechnologien. Nach „Agitprop der Völker“ wird ein weiterer originaler Agitprop-Posterplatz freigeschaltet."
 sr_lito_academy_network_research_bonus:0 "Die Akademien vernetzen: Forschungsförderung"
 sr_lito_agricultural_cooperatives:0 "Landwirtschaftliche Genossenschaften"
 sr_lito_agricultural_cooperatives_desc:0 "Die Genossenschaften stehen bereit, doch die Gemeinden wollen wissen, wer über das Getreide verfügt. Wir wählen zwischen bezahlten Lieferverträgen und einer zentralen Abnahmequote. Beide Wege schaffen das Versorgungsnetz, aber Vertrauen und kurzfristige Erträge unterscheiden sich."
 sr_lito_air_close_support:0 "Über den Bodentruppen"
 sr_lito_air_close_support_desc:0 "Lito priorisiert die Unterstützung an der Front: Bodenangriff +5 %. Dieser Schwerpunkt schließt die Spezialisierung auf Abfangen aus."
 sr_lito_air_command:0 "Eine Luftwaffe für die Union"
 sr_lito_air_command_desc:0 "Zwischen zwei Rekordmeldungen liegt ein Unfallbericht. Die Luftwaffenprüfung gewährt weiterhin Erfahrung; anschließend verteilen wir knappe Mittel zwischen Ersatzteilen und zusätzlichen Ausbildungsflügen. Beides gleichzeitig ist nicht finanziert."
 sr_lito_air_ground_crews:0 "Wartung vor Rekorden"
 sr_lito_air_ground_crews_desc:0 "Gute Wartung senkt Luftunfälle dauerhaft um 5 % und erhöht die Luftmissionseffizienz um 2 %."
 sr_lito_air_ground_support:0 "Fliegende Unterstützung"
 sr_lito_air_ground_support_desc:0 "Die Luftwaffe konzentriert sich auf die Unterstützung der Bodentruppen: Bodenangriff +5 %."
 sr_lito_air_interception:0 "Den Unionshimmel schützen"
 sr_lito_air_interception_desc:0 "Lito priorisiert den Schutz des Luftraums: Abfangeffizienz +5 %. Dieser Schwerpunkt schließt die Spezialisierung auf Bodenunterstützung aus."
 sr_lito_air_interceptors:0 "Schutz des Unionshimmels"
 sr_lito_air_interceptors_desc:0 "Die Luftwaffe konzentriert sich auf Abfangen: Abfangeffizienz +5 %."
 sr_lito_air_joint_command:0 "Gemeinsame Luftplanung"
 sr_lito_air_joint_command_desc:0 "Ein befristetes Planungsprogramm senkt die Luftdoktrinkosten um 5 %."
 sr_lito_air_joint_planning:0 "Gemeinsame Einsatzplanung"
 sr_lito_air_joint_planning_desc:0 "Für 730 Tage sinken die Luftdoktrinkosten um 5 %. Die neue Planung gewährt außerdem 10 Luftwaffenerfahrung."
 sr_lito_air_maintenance:0 "Verlässliche Bodenmannschaften"
 sr_lito_air_maintenance_desc:0 "Gute Wartung senkt Luftunfälle um 5 % und erhöht die Luftmissionseffizienz um 2 %."
 sr_lito_air_observation:0 "Luftbeobachtung vernetzen"
 sr_lito_air_observation_desc:0 "Nach der gewählten Spezialisierung verbessert ein gemeinsames Meldesystem die Lufterkennung 730 Tage lang um 5 % und gewährt 15 Luftwaffenerfahrung."
 sr_lito_air_observation_network:0 "Vernetzte Luftbeobachtung"
 sr_lito_air_observation_network_desc:0 "Der Austausch von Beobachtungsmeldungen erhöht die Lufterkennung um 5 %."
 sr_lito_air_operational_readiness:0 "Vom Flugplatz zum Einsatz"
 sr_lito_air_operational_readiness_desc:0 "Für 1095 Tage sinkt der Treibstoffverbrauch der Luftwaffe um 5 % und ihre Missionseffizienz steigt um 2 %. Wir erhalten 20 Luftwaffenerfahrung."
 sr_lito_air_pilots:0 "Gemeinsame Pilotenschulen"
 sr_lito_air_pilots_desc:0 "Für 730 Tage senken gemeinsame Ausbildungsstandards die Luftunfälle um 10 %."
 sr_lito_air_readiness:0 "Einsatzbereite Luftverbände"
 sr_lito_air_readiness_desc:0 "Vorbereitete Verbände verbrauchen 5 % weniger Treibstoff und erhalten 2 % Luftmissionseffizienz."
 sr_lito_air_training:0 "Gemeinsame Pilotenschulen"
 sr_lito_air_training_desc:0 "Ein befristetes Schulungsprogramm senkt Luftunfälle um 10 %."
 sr_lito_army_artillery:0 "Feuerpläne statt Einzelbefehle"
 sr_lito_army_artillery_desc:0 "Abgestimmtes Artilleriefeuer gewährt 20 Armeeerfahrung und 730 Tage lang 5 % Artillerieangriff."
 sr_lito_army_citizens_charter:0 "Der Soldat bleibt ein Bürger"
 sr_lito_army_citizens_charter_desc:0 "Der neue Soldateneid beruft sich auf die Union ihrer Völker. Der Generalstab fragt, ob deshalb auch Beschwerden gegen militärische Vorgesetzte zivil geprüft werden. Ein Ereignis bestimmt das Verhältnis zwischen Disziplin und Bürgerrechten."
 sr_lito_army_combined_arms:0 "Infanterie und Panzer gemeinsam"
 sr_lito_army_combined_arms_desc:0 "Gemeinsame Einsatzverfahren erhöhen die Heeresorganisation um 3 % und die Divisionsgeschwindigkeit um 2 %."
 sr_lito_army_homeland_defence:0 "Jede Republik verteidigen"
 sr_lito_army_homeland_defence_desc:0 "Für 1095 Tage steigen die Verteidigung auf Kerngebieten und die Eingrabungsgeschwindigkeit jeweils um 5 %."
 sr_lito_army_in_union_service:0 "Die Waffen dienen dem Vertrag"
 sr_lito_army_in_union_service_desc:0 "Am Ende der Reform steht kein neuer militärischer Rang für Lito. Die Streitkräfte bestätigen ihre Pflichten gegenüber allen Republiken. Erhalte 3 Punkte zur Erhaltung, 3 Vertrauen und für 730 Tage +2 % Heeresorganisation."
 sr_lito_army_officers:0 "Offiziere für die Föderation"
 sr_lito_army_officers_desc:0 "Ein Manöverbericht widerspricht der Erfolgsmeldung des Generalstabs. Die Offiziersschulen werden eingerichtet; Lito entscheidet, ob Initiative an der Front oder die Verlässlichkeit zentraler Einsatzpläne den Unterricht prägt."
 sr_lito_army_readiness:0 "Manöver aller Republiken"
 sr_lito_army_readiness_desc:0 "Unionsweite Manöver gewähren 25 Armeeerfahrung und 5 Prozentpunkte Kriegsunterstützung."
 sr_lito_army_review:0 "Die Rote Armee überprüfen"
 sr_lito_army_review_desc:0 "Lito lässt Ausbildung und Führung auswerten. Die Bestandsaufnahme gewährt 25 Armeeerfahrung."
 sr_lito_army_staff:0 "Föderaler Generalstab"
 sr_lito_army_staff_desc:0 "Abgestimmte Stabsarbeit senkt die Landdoktrinkosten um 5 % und erhöht die Planungsgeschwindigkeit um 5 %."
 sr_lito_army_staff_work:0 "Ein föderaler Generalstab"
 sr_lito_army_staff_work_desc:0 "Der neue Generalstab senkt Landdoktrinkosten um 5 % und erhöht die Planungsgeschwindigkeit um 5 %."
 sr_lito_army_supply:0 "Versorgung bis zur Front"
 sr_lito_army_supply_desc:0 "Zuständigkeiten und Transportpläne werden vereinheitlicht. Der Nachschubverbrauch sinkt dauerhaft um 5 %."
 sr_lito_artillery_coordination:0 "Eingespielte Artillerie"
 sr_lito_artillery_coordination_desc:0 "Gemeinsame Feuerplanung erhöht den Artillerieangriff vorübergehend um 5 %."
 sr_lito_balkan_cooperation:0 "Die Balkanbewegungen koordinieren"
 sr_lito_balkan_cooperation_desc:0 "Die politischen Verbindungen bilden ein gemeinsames Forum für wissenschaftlichen und organisatorischen Austausch. Erhalte 5 Punkte zur Erhaltung und einen Forschungsbonus von 50 Prozent für eine Industrietechnologie. Die beteiligten Länder behalten ihre eigenen Regierungen und Bündnisse."
 sr_lito_balkan_diplomacy:0 "Diplomatie auf Augenhöhe"
 sr_lito_balkan_diplomacy_desc:0 "Die Pflege verbesserter Beziehungen kostet 10 Prozent weniger politische Macht."
 sr_lito_balkan_forum:0 "Ein Forum für den Balkan"
 sr_lito_balkan_forum_desc:0 "Auch Albanien und Rumänien werden zur Zusammenarbeit eingeladen. Bei bestehenden Staaten steigt die gegenseitige Meinung um 25. Die Union erhält 2,5 Prozentpunkte Stabilität und 3 Punkte zur Erhaltung. Die Einladung erzwingt weder einen Beitritt noch einen Gebietswechsel."
 sr_lito_balkan_influence_network:0 "Sozialistische Kontaktnetzwerke"
 sr_lito_balkan_influence_network_desc:0 "Politische Kontakte und organisatorische Unterstützung stärken für 365 Tage den kommunistischen Einfluss. Tägliche kommunistische Unterstützung: +0,02. Keine automatische Regierungsänderung."
 sr_lito_balkan_partnership:0 "Partnerschaft auf Augenhöhe"
 sr_lito_balkan_partnership_desc:0 "Wir werben bei Jugoslawien, Bulgarien und Griechenland um Zusammenarbeit. Bestehende Staaten erhalten gegenseitig 25 Meinungspunkte. Diplomatische Kontakte kosten 10 Prozent weniger Unterhalt. Der Kurs schließt regionalen Zwang aus; er annektiert oder unterwirft niemanden. Ein anschließender Briefwechsel prüft, wie ernst wir es mit der Gleichberechtigung meinen."
 sr_lito_balkan_research:0 "Gemeinsame industrielle Forschung"
 sr_lito_balkan_solidarity:0 "Föderale Gesprächsbereitschaft"
 sr_lito_belgrade:0 "Brücken nach Belgrad"
 sr_lito_belgrade_desc:0 "Wissenschaftliche und kulturelle Kontakte zur Heimat und ihrer Diaspora bereichern unsere Institute. Der wissenschaftliche Austausch gewährt 5 Prozent Forschungsgeschwindigkeit."
 sr_lito_cadre_schools:0 "Kader für die Föderation"
 sr_lito_cadre_schools_desc:0 "Verwaltungsnachwuchs erleichtert die Koordination: täglich +0,05 politische Macht."
 sr_lito_central_coordination:0 "Zentrale Koordination"
 sr_lito_central_coordination_desc:0 "Gemeinsame Produktionsvorgaben erhöhen den Fabrikausstoß um 2,5 %, binden aber täglich 0,05 politische Macht. Zusätzlich 3 Punkte zur Erhaltung. Dieser Kurs schließt eigenständige Republikhaushalte aus."
 sr_lito_central_mandate:0 "Mandat der Parteizentrale"
 sr_lito_central_mandate_desc:0 "Tägliche politische Macht: +0,10. Stabilität: −2,5 Prozentpunkte."
 sr_lito_citizen_letters:0 "Briefe ohne Dienstsiegel"
 sr_lito_citizen_letters_desc:0 "Die Poststelle erhält einen zweiten Eingang: Beschwerden dürfen die Regierung erreichen, ohne vorher vom örtlichen Parteibüro bestätigt zu werden. Gewinne 3 Vertrauen und 2 Punkte zur Erhaltung; der neue Eingabedienst kostet für 365 Tage täglich 0,03 politische Macht."
 sr_lito_civil_compact:0 "Wissen und Wohlstand verbinden"
 sr_lito_civil_compact_bonus:0 "Föderales Aufbauprogramm"
 sr_lito_civil_compact_desc:0 "Wirtschaft und Forschung bündeln ihre Erfahrungen. Zwei zusätzliche 50-Prozent-Boni für Industrietechnologien unterstützen den weiteren Aufbau."
 sr_lito_combined_arms:0 "Verbundene Waffen"
 sr_lito_combined_arms_desc:0 "Gemeinsame Verfahren erhöhen die Heeresorganisation um 3 % und die Divisionsgeschwindigkeit um 2 %."
 sr_lito_common_assembly_halls:0 "Eine gemeinsame Montagehalle"
 sr_lito_common_assembly_halls_desc:0 "Mehrere Republiken teilen einen Auftrag, statt parallele Kleinserien gegeneinander auszuspielen. Eine Zivilfabrik entsteht in geeignetem eigenem, kontrolliertem Kerngebiet. Gibt es keinen Bauplatz, erhalten wir 50 politische Macht."
 sr_lito_congress:0 "Eine Union, viele Völker"
 sr_lito_congress_desc:0 "Ein gemeinsamer Kongress eröffnet Litos föderales Regierungsprogramm: Partei, Republiken, Wirtschaft und Verteidigung müssen einen gemeinsamen Weg finden."
 sr_lito_constitutional_guarantees:0 "Verfassungsrechte absichern"
 sr_lito_constitutional_guarantees_desc:0 "Verlässliche Verfahren entschärfen regionale Konflikte. Widerstand jeder vertretenen Republik: −5; Stabilität: +3 Prozentpunkte."
 sr_lito_council_mandate:0 "Mandat der Räte"
 sr_lito_council_mandate_desc:0 "Die Einbindung der Räte stärkt die Stabilität um 2,5 Prozentpunkte."
 sr_lito_course:0 "Litos neuer Kurs"
 sr_lito_course_desc:0 "Cosif Kozs Lito ruft zum Aufbau einer sozialistischen Union gleichberechtigter Völker auf."
 sr_lito_danube_workshops:0 "Werkstätten für die große Verbindung"
 sr_lito_danube_workshops_desc:0 "Von der Donau bis zum Dnjepr arbeiten Maschinen mit inkompatiblen Ersatzteilen. Ein gemeinsames Werkstattprogramm verbindet die Produktionsräume. Erhalte einen 50-Prozent-Bonus für Industrietechnologien und 15 politische Macht."
 sr_lito_defence_council:0 "Ein gemeinsamer Verteidigungsrat"
 sr_lito_defence_council_desc:0 "Heer, Luftwaffe und Marine stimmen ihre Einsatzplanung ab. Jede Teilstreitkraft erhält 25 Erfahrung."
 sr_lito_defence_industrial_compact:0 "Rüstung im föderalen Auftrag"
 sr_lito_defence_industrial_compact_desc:0 "Das Heer bestellt künftig nach gemeinsamen Standards; die Betriebe behalten ihre zivilen Vertretungen. Eine Militärfabrik entsteht in geeignetem eigenem, kontrolliertem Kerngebiet. Fehlt geeigneter Platz, gibt es 50 politische Macht."
 sr_lito_defence_preparation:0 "Vorbereitete Heimatverteidigung"
 sr_lito_defence_preparation_desc:0 "Vorbereitete Verteidigungspläne erhöhen die Verteidigung auf Kerngebieten und die Eingrabungsgeschwindigkeit jeweils um 5 %."
 sr_lito_development_school:0 "Der Bauplan wandert weiter"
 sr_lito_development_school_desc:0 "Ingenieure reisen nicht mehr nur mit einem Auftrag, sondern mit den Fehlerberichten des letzten Werks. Zwei 50-Prozent-Forschungsboni für Industrietechnologien helfen der nächsten Republik, diese Fehler nicht zu wiederholen."
 sr_lito_electronics_laboratories:0 "Labore für Elektronik"
 sr_lito_electronics_laboratories_desc:0 "Die neuen Labore bringen zivile Forscher und den Nachrichtendienst an einen Tisch. Der Elektronikbonus bleibt erhalten; entscheiden müssen wir, ob veröffentlichte Forschung oder militärische Geheimhaltung Vorrang erhält. Vier Monate später meldet sich die Laborleitung erneut."
 sr_lito_electronics_laboratories_research_bonus:0 "Labore für Elektronik: Forschungsförderung"
 sr_lito_federal_civil_service:0 "Der Staat muss sich erklären"
 sr_lito_federal_civil_service_desc:0 "Ein kasachischer Dorfsekretär und eine georgische Lehrerin sollen dieselbe Verordnung erklären können. Eine föderale Verwaltungsschule ersetzt widersprüchliche Rundschreiben durch verständliche Verfahren. Für 730 Tage: täglich +0,05 politische Macht."
 sr_lito_federal_officer_compact:0 "Die Schule der gemeinsamen Front"
 sr_lito_federal_officer_compact_desc:0 "Das Offizierskolleg veröffentlicht die widersprüchlichen Berichte seiner Manöver. Aus ihnen entsteht eine gemeinsame Lehre, die Kritik nicht mit Illoyalität verwechselt. Erhalte zwei 50-Prozent-Boni auf die Kosten einer Landdoktrin und 10 Armeeerfahrung."
 sr_lito_federal_plan:0 "Gemeinsam planen, vor Ort entscheiden"
 sr_lito_federal_plan_desc:0 "Ein gemeinsamer Investitionsrahmen beschleunigt den Bau um 5 % und gewährt zwei 50-Prozent-Forschungsboni für Industrietechnologien."
 sr_lito_federal_plan_research_bonus:0 "Gemeinsam planen, vor Ort entscheiden: Forschungsförderung"
 sr_lito_federal_resolution:0 "Der Vertrag hält"
 sr_lito_federal_resolution_desc:0 "Partei und Republiken bestätigen ihre gemeinsame Ordnung. Widerstand jeder vertretenen Republik: −5; zusätzlich 5 Punkte zur Erhaltung."
 sr_lito_federal_unity:0 "Einheit durch Mitbestimmung"
 sr_lito_federal_unity_desc:0 "Der Unionsvertrag bewährt sich in der Praxis. Widerstand jeder vertretenen Republik: −5; dazu 5 Punkte zur Erhaltung der Union."
 sr_lito_federal_universities:0 "Föderale Forschungsuniversitäten"
 sr_lito_federal_universities_desc:0 "Das ausgebaute Hochschulnetz schafft einen zusätzlichen Forschungsplatz."
 sr_lito_field_hospitals_compact:0 "Niemand bleibt namenlos zurück"
 sr_lito_field_hospitals_compact_desc:0 "Sanitätsstellen gleichen Verwundetenlisten zwischen den Republiken ab und teilen ihre Erfahrungen. Für 730 Tage steigen die Personalrückführung aus Verlusten und die Erholung der Heeresorganisation jeweils um 3 %. Die Hilfe erreicht Verwundete, statt an den Verwaltungsgrenzen der Republiken zu enden."
 sr_lito_field_logistics:0 "Versorgung bis zur Front"
 sr_lito_field_logistics_desc:0 "Einheitliche Versorgungsverfahren senken den Nachschubverbrauch um 5 %."
 sr_lito_front_and_home:0 "Zwischen Front und Küchentisch"
 sr_lito_front_and_home_desc:0 "Ein Frontbrief und die Eingabe einer Arbeiterfamilie beschreiben dieselbe Lieferung aus verschiedenen Richtungen. Lito muss im Ereignis Mittel zwischen militärischer Bereitschaft und der Belastung der Familien verteilen. Beide Entscheidungen verändern zeitweise die Armee."
 sr_lito_homeland:0 "Die Heimat nicht vergessen"
 sr_lito_homeland_desc:0 "Litos jugoslawische Herkunft prägt seine Außenpolitik. Besteht Jugoslawien noch, verbessert sich die gegenseitige Meinung um 40. Erhalte außerdem 50 politische Macht."
 sr_lito_independent_socialism:0 "Ein eigenständiger Sozialismus"
 sr_lito_independent_socialism_desc:0 "Die Union bestimmt ihren außenpolitischen Kurs selbst. Ein gemeinsamer Stab bewertet unsere Sicherheitslage. Erhalte 15 Armeeerfahrung und 3 Prozentpunkte Kriegsunterstützung."
 sr_lito_industrial_towns:0 "Ein Werk ist noch keine Stadt"
 sr_lito_industrial_towns_desc:0 "Die neue Fabrik steht im Plan; Wohnungen, Schule und ein Gemeindesaal fehlen. Ein Ereignis entscheidet, ob die Siedlung sofort als Gemeinschaft gebaut wird oder zunächst allein der Produktionsauftrag zählt. Für Lito wird Entwicklung dadurch zu einer sozialen Entscheidung."
 sr_lito_industrial_union:0 "Eine Industrie für die Union"
 sr_lito_industrial_union_desc:0 "Eine Militärfabrik ergänzt unsere föderale Industrie, sofern ein eigenes, kontrolliertes Kerngebiet freien Platz hat. Andernfalls erhalten wir 50 politische Macht."
 sr_lito_influence_albania:0 "Politische Kontakte in Albanien"
 sr_lito_influence_albania_desc:0 "Politische Verbindungen zu Albanien stärken die dortige kommunistische Partei um bis zu 10 Prozentpunkte. Für 365 Tage unterstützen Netzwerke ihre tägliche ideologische Entwicklung. Die gegenseitige Meinung steigt um 25. Dieser Schwerpunkt wechselt keine Regierung und erzwingt weder Putsch noch Bündnisbeitritt."
 sr_lito_influence_bulgaria:0 "Die bulgarische Linke stärken"
 sr_lito_influence_bulgaria_desc:0 "Politische Verbindungen zu Bulgarien stärken die dortige kommunistische Partei um bis zu 10 Prozentpunkte. Für 365 Tage unterstützen Netzwerke ihre tägliche ideologische Entwicklung. Die gegenseitige Meinung steigt um 25. Dieser Schwerpunkt wechselt keine Regierung und erzwingt weder Putsch noch Bündnisbeitritt."
 sr_lito_influence_greece:0 "Die griechische Arbeiterbewegung fördern"
 sr_lito_influence_greece_desc:0 "Politische Verbindungen zu Griechenland stärken die dortige kommunistische Partei um bis zu 10 Prozentpunkte. Für 365 Tage unterstützen Netzwerke ihre tägliche ideologische Entwicklung. Die gegenseitige Meinung steigt um 25. Dieser Schwerpunkt wechselt keine Regierung und erzwingt weder Putsch noch Bündnisbeitritt."
 sr_lito_influence_romania:0 "Sozialistische Netzwerke in Rumänien"
 sr_lito_influence_romania_desc:0 "Politische Verbindungen zu Rumänien stärken die dortige kommunistische Partei um bis zu 10 Prozentpunkte. Für 365 Tage unterstützen Netzwerke ihre tägliche ideologische Entwicklung. Die gegenseitige Meinung steigt um 25. Dieser Schwerpunkt wechselt keine Regierung und erzwingt weder Putsch noch Bündnisbeitritt."
 sr_lito_influence_yugoslavia:0 "Verbindungen zur jugoslawischen Arbeiterbewegung"
 sr_lito_influence_yugoslavia_desc:0 "Politische Verbindungen zu Jugoslawien stärken die dortige kommunistische Partei um bis zu 10 Prozentpunkte. Für 365 Tage unterstützen Netzwerke ihre tägliche ideologische Entwicklung. Die gegenseitige Meinung steigt um 25. Dieser Schwerpunkt wechselt keine Regierung und erzwingt weder Putsch noch Bündnisbeitritt."
 sr_lito_joint_coordination:0 "Gemeinsamer Koordinationsstab"
 sr_lito_joint_coordination_desc:0 "Ein zeitlich begrenztes Koordinationsprogramm erhöht die Forschungsgeschwindigkeit um 2 %."
 sr_lito_knowledge_for_all:0 "Wissen für die Zukunft"
 sr_lito_knowledge_for_all_desc:0 "Das gemeinsame Wissen beschleunigt die nächste Technikgeneration: zwei 50-Prozent-Forschungsboni für Elektronik."
 sr_lito_knowledge_for_all_research_bonus:0 "Wissen für die Zukunft: Forschungsförderung"
 sr_lito_living_constitution:0 "Der Vertrag gehört niemandem allein"
 sr_lito_living_constitution_desc:0 "Die Verfassung liegt nun auch in Schulhäusern, Kasernen und Gemeindebüros. Ihre Bedeutung muss dort ausgehandelt werden, wo Menschen auf sie angewiesen sind. Der föderale Rechtsdienst gibt für 730 Tage +3 Prozentpunkte Stabilität, kostet jedoch täglich 0,03 politische Macht."
 sr_lito_local_budgets:0 "Eigenständige Republikhaushalte"
 sr_lito_local_budgets_desc:0 "Regionale Haushaltsrechte stärken die Stabilität um 2,5 Prozentpunkte, verlangsamen unionsweite Bauvorhaben jedoch um 2 %. Dieser Kurs schließt zentrale Koordination aus."
 sr_lito_local_defence_registers:0 "Jedes Dorf kennt den Sammelplatz"
 sr_lito_local_defence_registers_desc:0 "Die Verteidigungskarte zeigt erstmals auch Schulen, Brücken und Gemeindelager. Örtliche Stellen planen gemeinsam mit dem Heer, statt erst auf den Ernstfall zu warten. Für 730 Tage: +3 % Verteidigung auf Kerngebiet und +3 % Eingrabungsgeschwindigkeit."
 sr_lito_local_investment:0 "Regionale Investitionsfonds"
 sr_lito_local_investment_desc:0 "Eine Zivilfabrik entsteht in einem eigenen, kontrollierten Kerngebiet mit freiem Platz. Fehlt geeigneter Bauplatz, erhalten wir stattdessen 50 politische Macht."
 sr_lito_maintenance_union:0 "Die Maschine soll morgen noch laufen"
 sr_lito_maintenance_union_desc:0 "Wartungsbücher werden gemeinsam geführt, statt bei der nächsten Erfolgsmeldung zu verschwinden. Ersatzteile und Schulungen kosten heute Leistung, verhindern aber künftigen Stillstand. Für 730 Tage: +3 % Wachstum der Produktionseffizienz, −1 % Fabrikausstoß."
 sr_lito_mobile_repair_columns:0 "Werkstätten hinter der Front"
 sr_lito_mobile_repair_columns_desc:0 "Mechaniker aus den zivilen Betrieben begleiten nun die Nachschubkolonnen. Die Armee spart für 730 Tage 3 % Nachschubverbrauch, die abgeordneten Facharbeiter kosten jedoch 1 % Fabrikausstoß."
 sr_lito_native_agitprop_academy_slot_tt:0 "Nach „Agitprop der Völker“: ein weiterer originaler Agitprop-Posterplatz und die Wissens- und Jugendkampagnen."
 sr_lito_native_agitprop_councils_slot_tt:0 "Nach „Agitprop der Völker“: ein weiterer originaler Agitprop-Posterplatz und die kollektivistische Kampagne."
 sr_lito_native_agitprop_ready_tt:0 "Die originalen Agitprop-Dateien wurden durch den Lito-Installer erfolgreich vorbereitet."
 sr_lito_naval_crew_training:0 "Ausgebildete Schiffsbesatzungen"
 sr_lito_naval_crew_training_desc:0 "Ein befristetes Ausbildungsprogramm erhöht die Marineorganisation um 5 %."
 sr_lito_naval_escorts:0 "Geschützte Seewege"
 sr_lito_naval_escorts_desc:0 "Eingespielte Sicherungsverbände erhöhen die Konvoischutzeffizienz um 5 %."
 sr_lito_naval_fuel:0 "Sparsame Flottenführung"
 sr_lito_naval_fuel_desc:0 "Abgestimmte Fahrt- und Versorgungspläne senken den Treibstoffverbrauch der Marine um 5 %."
 sr_lito_naval_interdiction:0 "Geübte Handelsstörer"
 sr_lito_naval_interdiction_desc:0 "Verbesserte Einsatzverfahren erhöhen die Konvoiüberfalleffizienz um 5 %."
 sr_lito_naval_observation:0 "Gemeinsames Seelagebild"
 sr_lito_naval_observation_desc:0 "Geteilte Beobachtungen erhöhen die Marinekoordination um 3 %."
 sr_lito_naval_production:0 "Koordinierte Werftarbeit"
 sr_lito_naval_production_desc:0 "Gemeinsame Produktionsstandards erhöhen den Werftausstoß um 5 %."
 sr_lito_naval_readiness:0 "Zusammenwirkende Flotten"
 sr_lito_naval_readiness_desc:0 "Gemeinsame Manöver erhöhen die Marineorganisation um 3 %."
 sr_lito_navy_crews:0 "Seeleute gemeinsam ausbilden"
 sr_lito_navy_crews_desc:0 "Für 730 Tage verbessert das gemeinsame Ausbildungsprogramm die Marineorganisation um 5 %."
 sr_lito_navy_dockyards:0 "Werften der Union koordinieren"
 sr_lito_navy_dockyards_desc:0 "Gemeinsame Standards erhöhen den Werftausstoß dauerhaft um 5 %."
 sr_lito_navy_escorts:0 "Die Konvois schützen"
 sr_lito_navy_escorts_desc:0 "Gemeinsame Sicherungsübungen erhöhen die Konvoischutzeffizienz dauerhaft um 5 %."
 sr_lito_navy_fuel:0 "Treibstoff für die Flotten"
 sr_lito_navy_fuel_desc:0 "Abgestimmte Fahrtpläne senken den Treibstoffverbrauch der Marine dauerhaft um 5 %."
 sr_lito_navy_interdiction:0 "Gegnerische Versorgung unterbrechen"
 sr_lito_navy_interdiction_desc:0 "Für 730 Tage steigt die Konvoiüberfalleffizienz um 5 %. Die Erprobung gewährt 15 Marineerfahrung."
 sr_lito_navy_joint_exercises:0 "Gemeinsame Flottenmanöver"
 sr_lito_navy_joint_exercises_desc:0 "Großmanöver gewähren 35 Marineerfahrung und erhöhen die Marineorganisation 1095 Tage lang um 3 %."
 sr_lito_navy_observation:0 "Ein gemeinsames Seelagebild"
 sr_lito_navy_observation_desc:0 "Für 730 Tage verbessert der Austausch von Beobachtungen die Marinekoordination um 3 %."
 sr_lito_navy_review:0 "Die Flotten überprüfen"
 sr_lito_navy_review_desc:0 "Die Admiräle legen Lito zwei unterschiedliche Karten vor: eine für den Auftritt der Union auf See und eine für bedrohte Handelsschiffe. Die Flottenprüfung gewährt Erfahrung; ihre politische Priorität entscheidet sich im anschließenden Gespräch."
 sr_lito_notebook:0 "Die Seiten, die Lito behielt"
 sr_lito_notebook_desc:0 "In einem abgegriffenen Notizbuch stehen keine Staatspläne, sondern Namen von Werkstätten, Grenzbahnhöfen und Genossen. Die Redaktion möchte daraus die Geschichte der neuen Union machen. Ein Ereignis entscheidet, ob auch Zweifel und Irrtümer veröffentlicht werden."
 sr_lito_oath_to_peoples:0 "Ein Eid auf die Völker"
 sr_lito_oath_to_peoples_desc:0 "Die neuen Beamten schwören weder einem Porträt noch einer einzelnen Republik Treue. Ihr Eid gilt dem gemeinsamen Vertrag. Erhalte 3 Prozentpunkte Kriegsunterstützung und 3 Punkte zur Erhaltung."
 sr_lito_officer_schools:0 "Praktische Offiziersausbildung"
 sr_lito_officer_schools_desc:0 "Ein befristetes Ausbildungsprogramm senkt die Ausbildungszeit des Heeres um 5 %."
 sr_lito_polish_frontier:0 "Die polnische Grenzfrage"
 sr_lito_polish_frontier_desc:0 "Wir bereiten eine gewaltsame Neuordnung im Westen vor. Gegen ein weiterhin bestehendes Polen, das kein eigener Untertan ist, erhalten wir ein 730 Tage gültiges Annexionskriegsziel. Der Schwerpunkt erklärt keinen Krieg und ist nicht während eines bereits laufenden Krieges gegen Polen verfügbar."
 sr_lito_political_contacts:0 "Sozialistische politische Kontakte"
 sr_lito_politics_accountability:0 "Rechenschaft vor der Union"
 sr_lito_politics_accountability_desc:0 "Die Führung legt öffentlich Rechenschaft über ihre Zusagen ab. Die Aussprache erhöht die Stabilität um 3 Prozentpunkte, senkt aber die Kriegsunterstützung um 2 Prozentpunkte."
 sr_lito_politics_anti_corruption:0 "Die Privilegien überprüfen"
 sr_lito_politics_anti_corruption_desc:0 "Ein versiegeltes Dossier nennt ausgerechnet Genossen, die Litos Aufstieg ermöglicht haben. Eine unabhängige Untersuchung kostet politische Macht und bindet die Verwaltung. Ein begrenztes Verfahren schützt die Parteiführung, beschädigt aber das Vertrauen in die versprochene Gleichheit."
 sr_lito_politics_cadre_schools:0 "Agitprop der Völker"
 sr_lito_politics_cadre_schools_desc:0 "Lito bündelt politische Bildung und Plakatkampagnen in einem gemeinsamen Agitprop-Büro. Die Sprachen und Erfahrungen der Republiken sollen die öffentliche Arbeit prägen. Öffnet die sowjetischen Agitprop-Kampagnen und gewährt täglich 0,05 politische Macht."
 sr_lito_politics_central_mandate:0 "Ein Mandat der Parteizentrale"
 sr_lito_politics_central_mandate_desc:0 "Eine straffe Zentrale beschleunigt politische Entscheidungen. Erhalte 50 politische Macht und täglich weitere 0,10. Der Preis sind 5 Punkte zur Seite des Einbruchs und ein Stabilitätsmalus von 2,5 Prozentpunkten. Dieser Kurs schließt das Rätemandat aus."
 sr_lito_politics_constitution:0 "Die föderale Verfassung"
 sr_lito_politics_constitution_desc:0 "Ein verbindlicher Verfassungsrahmen ordnet die Rechte von Partei, Räten und Republiken. Gewinne 5 Punkte zur Erhaltung und senke den Widerstand jeder vertretenen Republik um 5."
 sr_lito_politics_council_mandate:0 "Ein Mandat der Räte"
 sr_lito_politics_council_mandate_desc:0 "Lito bindet seine Führung an die Zustimmung der Räte. Das kostet 50 politische Macht, stärkt die Unionsbalance um 5 Punkte und senkt den Widerstand aller vertretenen Republiken um 5. Der nationale Geist erhöht die Stabilität um 2,5 Prozentpunkte. Dieser Kurs schließt das zentrale Parteimandat aus."
 sr_lito_politics_mandate:0 "Litos politisches Vermächtnis"
 sr_lito_politics_mandate_desc:0 "Litos Regierung hat eine eigene institutionelle Grundlage geschaffen. Erhalte je 2,5 Prozentpunkte Stabilität und Kriegsunterstützung."
 sr_lito_politics_party_congress:0 "Ein Mandat für Lito"
 sr_lito_politics_party_congress_desc:0 "Ein Parteikongress bestätigt Cosif Kozs Litos Führungsanspruch. Seine Autorität soll auf einem erklärten Programm beruhen. Erhalte 75 politische Macht."
 sr_lito_polytechnic_institutes:0 "Polytechnische Institute"
 sr_lito_polytechnic_institutes_desc:0 "Die Verbindung von Lehre und angewandter Forschung erhöht unsere Forschungsgeschwindigkeit um 2,5 %."
 sr_lito_pressure_doctrine:0 "Regionaler Druck"
 sr_lito_pressure_doctrine_desc:0 "Kriegsrechtfertigungen dauern 5 Prozent kürzer."
 sr_lito_public_memory:0 "Das Gedächtnis der Union"
 sr_lito_public_memory_desc:0 "Archive sammeln neben Regierungserklärungen auch Arbeiterbriefe und die Protokolle gescheiterter Verhandlungen. Diese Union soll ihre Geschichte nicht bei jedem Führungswechsel neu erfinden müssen. Gewinne 5 Vertrauen und 2 Prozentpunkte Stabilität."
 sr_lito_ratify_compromise:0 "Den föderalen Kompromiss ratifizieren"
 sr_lito_ratify_compromise_desc:0 "Nach der Entscheidung über den Wirtschaftskurs bestätigen die Republiken ihre gemeinsame Ordnung. Widerstand jeder vertretenen Republik: −5; dazu 5 Punkte zur Erhaltung."
 sr_lito_regional_pressure:0 "Regionalen Druck aufbauen"
 sr_lito_regional_pressure_desc:0 "Lito bereitet einen offensiveren Kurs vor. Erhalte 50 politische Macht und 5 Prozentpunkte Kriegsunterstützung, verliere aber 3 Prozentpunkte Stabilität. Kriegsrechtfertigungen dauern 5 Prozent kürzer. Der Kurs schließt die Partnerschaft auf Augenhöhe aus und erklärt keinen Krieg."
 sr_lito_regional_workshops:0 "Werkstätten der Republiken"
 sr_lito_regional_workshops_desc:0 "Eine weitere Zivilfabrik entsteht in einem eigenen, kontrollierten Kerngebiet mit freiem Platz. Andernfalls erhalten wir 50 politische Macht."
 sr_lito_republic_congress:0 "Die Republiken anhören"
 sr_lito_republic_congress_desc:0 "Ein gemeinsamer Kongress eröffnet die Verhandlungen: +50 politische Macht und 3 Punkte zur Erhaltung der Union. Die Delegationen aus Ukraine, Georgien und Kasachstan legen anschließend konkrete Forderungen vor."
 sr_lito_research_exchange:0 "Forscher zwischen den Republiken"
 sr_lito_research_exchange_desc:0 "Austauschprogramme erhöhen die Forschungsgeschwindigkeit um weitere 2,5 %."
 sr_lito_scientific_standards:0 "Gemeinsame technische Standards"
 sr_lito_scientific_standards_desc:0 "Einheitliche Verfahren erleichtern den Technologietransfer. Ein 50-Prozent-Forschungsbonus für Industrietechnologien."
 sr_lito_scientific_standards_research_bonus:0 "Gemeinsame technische Standards: Forschungsförderung"
 sr_lito_shared_defence:0 "Gemeinsame Verteidigungspflichten"
 sr_lito_shared_defence_desc:0 "Die Republiken koordinieren ihre Verteidigung: +15 Armeeerfahrung und +3 Prozentpunkte Kriegsunterstützung."
 sr_lito_shared_prosperity:0 "Gemeinsamer Wohlstand"
 sr_lito_shared_prosperity_desc:0 "Sichtbare Ergebnisse festigen das Vertrauen in den neuen Wirtschaftskurs: +3 Prozentpunkte Stabilität und zwei 25-Prozent-Boni für Industrieforschung."
 sr_lito_shared_prosperity_research_bonus:0 "Gemeinsamer Wohlstand: Forschungsförderung"
 sr_lito_signals_of_republics:0 "Viele Sprachen, ein Funkspruch"
 sr_lito_signals_of_republics_desc:0 "Ein Befehl darf nicht am Akzent des Funkers scheitern. Gemeinsame Signaltafeln und technische Lehrgänge verbinden Einheiten aus allen Republiken. Erhalte einen 50-Prozent-Forschungsbonus für Elektronik."
 sr_lito_slavic_consolidation:0 "Die große Föderation festigen"
 sr_lito_slavic_consolidation_desc:0 "Nach der Ausrufung der Sozialistischen Föderalen Slawischen Union müssen ihre Institutionen zusammenfinden. Erhalte 5 Prozentpunkte Stabilität und 10 Punkte zur Erhaltung; der Widerstand jeder vertretenen Republik sinkt um 5."
 sr_lito_socialist_partnership:0 "Die Union handelt eigenständig"
 sr_lito_socialist_partnership_desc:0 "Der eingeschlagene außenpolitische Kurs wird durch einen gemeinsamen Wissenschafts- und Koordinationsstab unterstützt. Für 730 Tage: +2 % Forschungsgeschwindigkeit."
 sr_lito_straits_question:0 "Die Meerengenfrage"
 sr_lito_straits_question_desc:0 "Der offensive Kurs richtet sich nun auf die Türkei. Gegen eine weiterhin bestehende Türkei, die kein eigener Untertan ist, entsteht ein 730 Tage gültiges Annexionskriegsziel. Es umfasst die Türkei, nicht nur die Meerengen, und erklärt keinen Krieg."
 sr_lito_succession_charter:0 "Eine Verfassung nach Lito"
 sr_lito_succession_charter_desc:0 "Im Verfassungsentwurf fehlt ein Name: der Nachfolger. Lito muss entscheiden, ob künftige Führung aus einer kontrollierten Parteizentrale oder einem gebundenen föderalen Verfahren hervorgeht. Das Ereignis begründet Institutionen und verändert Vertrauen und politische Handlungsfähigkeit."
 sr_lito_supply_corridors:0 "Versorgungswege der Union"
 sr_lito_supply_corridors_desc:0 "Wir bauen eine Infrastrukturstufe in einem eigenen, kontrollierten Kerngebiet aus, sofern dort eine weitere Stufe möglich ist. Andernfalls erhalten wir 50 politische Macht."
 sr_lito_technical_education:0 "Technische Bildung verbreiten"
 sr_lito_technical_education_desc:0 "Breitere Bildung stützt den föderalen Gesellschaftsvertrag: +3 Prozentpunkte Stabilität und +50 politische Macht."
 sr_lito_translation_chambers:0 "Ein Rednerpult für jeden Akzent"
 sr_lito_translation_chambers_desc:0 "Eine Rede ist noch keine Mitsprache, wenn nur die Hauptstadt ihre Sprache versteht. Dolmetscherkammern machen Anträge der Republiken unmittelbar lesbar. Für 365 Tage: +2 Prozentpunkte Stabilität, aber −0,03 tägliche politische Macht; zusätzlich +3 Vertrauen."
 sr_lito_union_charter:0 "Ein neuer Unionsvertrag"
 sr_lito_union_charter_desc:0 "Verbindliche Verfahren geben den Republiken eine Stimme. Tägliche politische Macht: +0,10; zusätzlich 5 Punkte zur Erhaltung."
 sr_lito_union_future:0 "Die Union erhalten"
 sr_lito_union_future_desc:0 "Litos Regierungsprogramm verbindet föderalen Zusammenhalt, Wirtschaft und gemeinsame Verteidigung. Erhalte 5 Prozentpunkte Stabilität und 10 Punkte zur Erhaltung. Ein abschließender Bericht erinnert an die Entscheidungen, auf denen diese Union beruht."
 sr_lito_union_reserve:0 "Ein Winter in der Staatsreserve"
 sr_lito_union_reserve_desc:0 "Der Aufbauplan verspricht neue Werke, die Vorratsverwaltung warnt vor einem einzigen schlechten Winter. Ein Ereignis verteilt knappe Mittel zwischen einer gemeinsamen Notreserve und sofortigem Ausbau. Beide Wege tragen einen wirtschaftlichen Preis."
 sr_lito_workers_councils:0 "Räte in den Betrieben"
 sr_lito_workers_councils_desc:0 "Eine Werkversammlung gerät zum Streit über Litos Versprechen: Entscheiden die Beschäftigten selbst, oder behält der Direktor das letzte Wort? Die Arbeiterselbstverwaltung bleibt bestehen; ihre praktische Ausgestaltung bestimmen wir im Ereignis. Nach drei Monaten folgt die erste Bilanz. Nach „Agitprop der Völker“ wird ein weiterer originaler Agitprop-Posterplatz freigeschaltet."
 sr_lito_workplace_charter:0 "Die Schicht endet mit einem Recht"
 sr_lito_workplace_charter_desc:0 "Ein Vertrag über Produktion braucht auch Regeln über Unfälle, Schichtzeiten und Beschwerden. Ein gemeinsames Betriebsstatut gibt für 730 Tage +2 Prozentpunkte Stabilität und +2 % Fabrikausstoß. Sein Verwaltungsaufwand kostet täglich 0,03 politische Macht."
 sr_local_budgets:0 "Eigenständige Republikhaushalte"
 sr_local_budgets_desc:0 "Stabilität: +2,5 Prozentpunkte. Baugeschwindigkeit: −2 %."
 sr_polytechnic_network:0 "Polytechnisches Netzwerk"
 sr_polytechnic_network_desc:0 "Forschungsgeschwindigkeit: +2,5 %."
 sr_scientific_exchange:0 "Föderaler Forscheraustausch"
 sr_scientific_exchange_desc:0 "Forschungsgeschwindigkeit: +2,5 %."
 sr_soviet_tree:0 "Litos Union"
 sr_workers_councils:0 "Arbeiterselbstverwaltung"
 sr_workers_councils_desc:0 "Die Arbeiterräte koordinieren den Betrieb. Fabrikausstoß: +5 %."
 sr_yugoslav_friendship:0 "Litos jugoslawische Verbundenheit"
 titoism:0 "Titoismus"
 titoism_desc:0 "Der Titoismus verbindet sozialistisches Eigentum mit betrieblicher Arbeiterselbstverwaltung, föderaler Mitbestimmung und außenpolitischer Eigenständigkeit. Die Union soll durch gemeinsame Interessen zusammenhalten. Doch Selbstverwaltung und die Macht der kommunistischen Partei stehen in einem dauernden Spannungsverhältnis."
