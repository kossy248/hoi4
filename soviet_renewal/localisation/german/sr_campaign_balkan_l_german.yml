l_german:
 sr_cb_1_t:0 "Ein Genosse schreibt keinen Befehl"
 sr_cb_1_home_d:0 "Kardelj kommt mit einem schmalen Aktenkoffer nach Moskau. Er bedankt sich für die Hilfe, die Lito seiner Heimat gewährt hat, und legt dann einen Vertragsentwurf auf den Tisch. Die letzte Seite ist noch nicht unterschrieben.\n\n'Ein Geschenk verpflichtet den Empfänger', sagt er. 'Ein Vertrag verpflichtet beide.' Jugoslawien will Maschinen und verlässliche Lieferungen, aber keine Anweisung, wie jede Fabrik zu führen sei. Lito erkennt die Sprache seiner eigenen föderalen Reden wieder. Jetzt wird sie ihm von jenseits der Grenze vorgetragen."
 sr_cb_1_equal_d:0 "Kardelj hat die früheren Austauschvereinbarungen mitgebracht. Zwischen den Unterschriften liegen handschriftliche Notizen jugoslawischer Betriebsräte: Ersatzteile kommen zu spät, technische Angaben passen nicht zusammen, und jedes Missverständnis braucht einen neuen Brief nach Moskau.\n\n'Gleiche Bedingungen sind ein Anfang', sagt Kardelj. 'Nun brauchen wir gleiche Rechte bei ihrer Auslegung.' Er schlägt einen gemeinsamen Vertrag vor. Lito kann die mühsam gepflegte Partnerschaft zu einer belastbaren Einrichtung machen. Oder die Unklarheiten durch sowjetische Lieferanweisungen beenden."
 sr_cb_1_other_d:0 "Die sowjetische Delegation erwartet ein Gespräch über Liefermengen. Kardelj beginnt mit einer Frage: Wer darf den gemeinsamen Plan ändern, wenn er in einem jugoslawischen Werk nicht funktioniert?\n\nNiemand widerspricht dem Austausch. Umstritten ist die politische Bedeutung einer Unterschrift. Kardelj will einen Vertrag zwischen sozialistischen Partnern; einige sowjetische Referenten halten diese Unterscheidung für unnötig. Lito bittet darum, beide Entwürfe liegenzulassen. Er muss entscheiden, welchen davon die Unterhändler weiterbearbeiten."
 sr_cb_1_a:0 "Verhandeln wir einen gegenseitigen Vertrag. (60 politische Macht)"
 sr_cb_1_b:0 "Verlässliche Lieferungen brauchen klare sowjetische Vorgaben."
 sr_cb_contract_followup_tt:0 "In 90 Tagen legt die gemeinsame Kommission ihren ersten Bericht vor. Gegenseitigkeit gibt für 180 Tage +2 % Baugeschwindigkeit bei −0,05 täglicher politischer Macht und +4 Vertrauen. Vorgaben geben sofort 35 politische Macht, für 180 Tage +4 % Fabrikausstoß und −3 Prozentpunkte Stabilität, kosten aber 5 Vertrauen."
 sr_cb_2_t:0 "An der Zollschranke endet der gemeinsame Plan"
 sr_cb_2_joint_d:0 "Der erste Güterzug hat die Grenze erreicht. Seine Ladung ist vollständig, doch drei Behörden legen dieselbe Vertragsklausel unterschiedlich aus. In Belgrad gilt ein Ersatzteil als Bestandteil einer gelieferten Maschine; der sowjetische Frachtbrief behandelt es als neue Bestellung. Die Wagen stehen.\n\nKardelj schlägt eine gemeinsame Zoll- und Normenkommission mit gleichen Stimmen vor. Die sowjetischen Fachleute können den Streit auch schneller lösen: indem sie ihre Auslegung verbindlich machen. Lito sieht auf dem Bericht keine große politische Frage vermerkt. Der stillstehende Zug stellt sie trotzdem."
 sr_cb_2_orders_d:0 "Die sowjetischen Liefervorgaben haben die Zahlen vereinfacht und die Beschwerden vermehrt. Jugoslawische Werke erhalten die bestellten Mengen, müssen aber für jede Änderung eine Genehmigung abwarten. An der Grenze sammeln sich nun Wagen mit falsch eingeordneten Ersatzteilen.\n\nKardelj verlangt eine gemeinsame Kommission. 'Wir können von euren Erfahrungen lernen', sagt er, 'ohne jede eurer Unterschriften zu benötigen.' Lito kann die Vorgaben zurücknehmen und gleichberechtigt nachverhandeln. Oder den entstandenen Streit als Beweis dafür ansehen, dass noch eindeutigere Anweisungen fehlen."
 sr_cb_2_a:0 "Beide Seiten erhalten ein gleiches Wort. (35 politische Macht)"
 sr_cb_2_b:0 "Unsere Auslegung bleibt verbindlich."
 sr_cb_standards_followup_tt:0 "Nach weiteren 90 Tagen folgt die Vertragsbilanz. Die gemeinsame Kommission kostet 35 politische Macht, stärkt das Vertrauen um 3 und beendet gegebenenfalls die sowjetischen Liefervorgaben. Verbindliche Vorgaben geben 20 politische Macht, kosten aber 4 Vertrauen. Die Abschlussfolgen hängen von dieser Entscheidung ab."
 sr_cb_3_t:0 "Die zweite Unterschrift"
 sr_cb_3_joint_d:0 "Die Kommission schickt einen Vertrag zurück, der länger ist als der erste Entwurf. Jede zusätzliche Seite beantwortet eine Frage, die bisher in einem persönlichen Brief an Lito oder Kardelj gelandet wäre. An der Grenze werden die Frachtbriefe nun nach denselben Regeln gelesen.\n\nKardelj unterschreibt zuerst und schiebt den Stift weiter. Er verspricht keine ständige Einigkeit. Er verspricht, dass der nächste Streit ein Verfahren hat. Für Lito ist das ein kleiner Erfolg mit großer Bedeutung: Sozialistische Zusammenarbeit muss nicht jedes Mal von seiner persönlichen Autorität abhängen."
 sr_cb_3_orders_d:0 "Die Liefermengen sind erreicht. Das Außenkommissariat nennt den Vertrag erfolgreich; in Kardeljs Begleitschreiben steht das Wort nicht. Er zählt stattdessen die Änderungen auf, die jugoslawische Betriebe beantragt und nicht erhalten haben.\n\n'Wir haben eure Anweisungen verstanden', schreibt er. 'Unsere Einwände sind damit nicht beantwortet.' Der Warenverkehr besteht fort. Die politische Partnerschaft trägt aber eine neue Belastung, die sich nicht in Tonnen oder Wagen ausdrücken lässt. Lito legt die Erfolgsstatistik und den Brief in dieselbe Mappe."
 sr_cb_3_a:0 "Ein Vertrag hält, wenn beide ihn verändern können."
 sr_cb_3_b:0 "Die Zahlen stimmen. Das Misstrauen bleibt."
 sr_cb_4_t:0 "Der Volksrat verlangt die Bücher"
 sr_cb_4_grievance_d:0 "Die Beschwerde der Balkanföderation ist diesmal keine allgemeine Resolution. Der Föderale Volksrat schickt Kontoauszüge, Beschlussprotokolle und drei unbeantwortete Anträge auf Einsicht in die Beraterhaushalte. Die alten Vorwürfe fehlender Mitsprache haben Aktenzeichen bekommen.\n\nEine Delegierte schreibt an Lito: 'Wenn wir gemeinsam regieren, müssen wir auch gemeinsam nachsehen dürfen.' Eine unabhängige Haushaltsprüfung würde Geld und politische Arbeit kosten. Neue verbindliche Produktionsziele wären einfacher zu verkünden. Lito weiß, warum gerade diese einfachere Antwort erneut verlangt werden könnte."
 sr_cb_4_cooperation_d:0 "Der Föderale Volksrat will den nächsten Haushalt mit den sowjetischen Partnern abstimmen. Seine Unterlagen enthalten ungewöhnlich viele Fragen: Welche Ausgaben können die Republiken selbst ändern? Wer prüft gemeinsam finanzierte Betriebe? An wen richtet sich eine Minderheit im Rat, wenn sie eine Entscheidung beanstandet?\n\nDie Zusammenarbeit hat genug Vertrauen geschaffen, um diese Fragen offen zu stellen. Lito kann eine unabhängige Haushaltsprüfung finanzieren und die Regeln präzisieren. Oder den erreichten Zusammenhalt nutzen, um neue verbindliche Ziele ohne zusätzliche Verfahren durchzusetzen."
 sr_cb_4_a:0 "Der Volksrat bekommt eine unabhängige Prüfung. (50 politische Macht)"
 sr_cb_4_b:0 "Zuerst brauchen wir verbindliche gemeinsame Ziele."
 sr_cb_federal_followup_tt:0 "In 90 Tagen folgt die Prüfung der föderalen Rechte. Die Haushaltsprüfung kostet 50 politische Macht und gibt der Union für 180 Tage +2 Prozentpunkte Stabilität bei −0,05 täglicher politischer Macht. Verbindliche Ziele geben sofort 30 politische Macht, kosten aber 4 Vertrauen."
 sr_cb_5_t:0 "Eine Prüfakte ist noch kein Recht"
 sr_cb_5_audit_d:0 "Die Prüfer haben ihre Arbeit beendet. Sie finden keine einzelne große Unterschlagung, sondern ein Verfahren, in dem fast jede örtliche Entscheidung von einer weiteren Genehmigung abhängt. Der Volksrat hat Verantwortung für Ergebnisse, aber nicht für alle Mittel.\n\nDie Delegierten verlangen nun einklagbare Haushalts- und Änderungsrechte. Der sowjetische Beraterstab warnt vor langsameren Beschlüssen. Lito kann die Prüfung in eine verbindliche Reform übersetzen. Andernfalls bleibt ein gut geführtes Archiv über Zustände zurück, die jeder kennt und niemand ändern darf."
 sr_cb_5_targets_d:0 "Die neuen Ziele sind verkündet, und die Berater können ihre Tabellen schneller abschließen. Im Volksrat bleiben mehrere Sitze während der Schlussabstimmung leer. Die abwesenden Delegierten haben eine gemeinsame Erklärung hinterlassen: Verantwortung ohne Änderungsrecht sei keine föderale Mitregierung.\n\nLito kann dem Rat jetzt garantierte Haushaltsrechte geben. Oder er bestätigt die Beraterordnung und verlangt die Umsetzung der Ziele. Das zweite Schreiben ist bereits aufgesetzt. Für das erste müsste die Regierung zusätzliche Mittel und einen politischen Konflikt mit dem eigenen Stab einplanen."
 sr_cb_5_a:0 "Der Rat erhält verbindliche Haushaltsrechte. (60 politische Macht)"
 sr_cb_5_b:0 "Die Beraterordnung wird bestätigt."
 sr_cb_federal_budget_tt:0 "Nach 120 Tagen folgt die gemeinsame Haushaltsbilanz. Garantien kosten 60 politische Macht, geben +5 Vertrauen und der Balkanföderation für 365 Tage +3 Prozentpunkte Stabilität bei −2 % Fabrikausstoß. Bestätigung gibt 20 politische Macht, kostet 5 Vertrauen und gibt der Föderation für 365 Tage +4 % Fabrikausstoß bei −0,10 täglicher politischer Macht."
 sr_cb_6_t:0 "Was im Haushalt eine Stimme bekam"
 sr_cb_6_guarantees_d:0 "Die Haushaltsdebatte dauert einen Tag länger als angekündigt. Die letzte Änderung betrifft eine kleine Bahnverbindung, die in keiner sowjetischen Übersicht besonders auffällt. Für eine der Republiken entscheidet sie darüber, ob ihr Werk den ganzen Winter liefern kann. Der Antrag wird nach einer offenen Abstimmung aufgenommen.\n\nDer Föderale Volksrat schickt Lito das Protokoll. Die Delegierten haben gestritten, geändert und schließlich selbst zugestimmt. Der gemeinsame Haushalt wird dadurch nicht billiger. Er erhält aber etwas, das sich nicht von außen anordnen lässt: Verantwortliche, die ihn als ihre eigene Entscheidung vertreten."
 sr_cb_6_orders_d:0 "Der Haushalt ist bestätigt. Auf dem Papier passen die Produktionsziele zusammen, doch zwei Republiken legen gegen ihre Zuteilung Einspruch ein. Die Berater verweisen auf die bereits ergangenen Beschlüsse. Der Volksrat kann die Eingaben sammeln, ohne verbindlich über sie zu entscheiden.\n\nDie Folge ist ein Stillstand aus genau eingehaltenen Zuständigkeiten. Jeder wartet auf die Unterschrift der nächsten Stelle. Lito hatte Handlungsfähigkeit sichern wollen. Nun muss er Berichte lesen, in denen gerade diese Ordnung als Ursache der Verzögerung genannt wird."
 sr_cb_6_a:0 "Ein gemeinsam geänderter Plan kann gemeinsam getragen werden."
 sr_cb_6_b:0 "Eine bestätigte Tabelle ersetzt keine Zustimmung."
 sr_cb_7_t:0 "Unter einer Flagge stehen viele Namen"
 sr_cb_7_d:0 "Die neue Flagge hängt über dem Sitzungssaal der Sozialistischen Föderalen Slawischen Union. Unter ihr müssen nun Menschen zusammenarbeiten, deren Verwaltungen unterschiedliche Sprachen, Rechtsbegriffe und Erfahrungen mit Moskau mitbringen. Die Gründungsfeier ist vorbei; die erste Eingabe verlangt eine verständliche Antwort.\n\nDer Verfassungsausschuss legt Lito zwei Entwürfe vor. Der eine finanziert Übersetzungen und gemeinsame Änderungsverfahren. Der andere übernimmt die zentrale Ordnung und behandelt weitere Sprachen als Sache der örtlichen Durchführung. Beides lässt sich heute beschließen. Erst später wird sichtbar, wer den neuen Vertrag als den eigenen lesen kann."
 sr_cb_7_a:0 "Der Vertrag muss in allen seinen Sprachen verstanden werden. (60 politische Macht)"
 sr_cb_7_b:0 "Eine gemeinsame Zentrale gibt die verbindliche Fassung vor."
 sr_cb_charter_followup_tt:0 "In 120 Tagen prüfen die Delegierten die Sprach- und Eingaberechte. Die mehrsprachige Ausarbeitung kostet 60 politische Macht, bindet für 240 Tage täglich 0,10 politische Macht und gibt +4 Vertrauen. Die zentrale Fassung gibt sofort 40 politische Macht, kostet aber 4 Vertrauen."
 sr_cb_8_t:0 "Das Wort, das im Vertrag fehlte"
 sr_cb_8_broken_d:0 "Die georgische Delegation hat die alte Zusage kultureller Rechte neben den neuen Verfassungsentwurf gelegt. Auf beiden Papieren steht Litos Name. Nur eines beschreibt ein eingehaltenes Verfahren.\n\n'Wir sollen diesmal auf den Text vertrauen', sagt eine Delegierte. 'Beim letzten Mal sollten wir auf das Wort des Vorsitzenden vertrauen.' Sie verlangt klare Sprachrechte und einen Weg, eine Ablehnung anzufechten. Lito kann den Entwurf ändern und die frühere Schuld politisch anerkennen. Oder erklären lassen, dass die allgemeine Fassung bereits alles Nötige enthalte."
 sr_cb_8_other_d:0 "Ein Übersetzer fragt im Ausschuss, ob eine Eingabe denselben Rang habe, wenn sie nicht in der Verwaltungssprache der Zentrale eingereicht werde. Die Juristen finden mehrere mögliche Antworten. Für den Menschen, der eine Antwort auf seinen Antrag braucht, sind sie nicht gleichwertig.\n\nDie Delegierten verlangen eine präzisere Fassung der Sprach- und Beschwerderechte. Lito kann die Regeln nacharbeiten lassen. Oder auf dem vorliegenden Text bestehen. Der Streit betrifft wenige Zeilen, aber viele künftige Entscheidungen werden sich auf sie berufen."
 sr_cb_8_a:0 "Ändert die Sprach- und Eingaberechte verbindlich. (40 politische Macht)"
 sr_cb_8_b:0 "Die bestehende Fassung bleibt."
 sr_cb_charter_report_tt:0 "Nach weiteren 120 Tagen folgt die Verfassungsbilanz. Eine Überarbeitung kostet 40 politische Macht, gibt +5 Vertrauen und senkt den Widerstand des vertretenen Georgiens um 10. Das Beibehalten gibt 20 politische Macht; bei einer zentralen Fassung kostet es zusätzlich 5 Vertrauen. Eine mehrsprachige oder überarbeitete Ordnung führt zu anderen Abschlussfolgen als eine unverändert zentrale."
 sr_cb_9_t:0 "Der Vertrag wird zum Alltag"
 sr_cb_9_plural_d:0 "Die erste Beschwerde nach dem neuen Verfahren endet nicht mit einem Besuch bei Lito. Ein örtlicher Ausschuss nimmt sie auf, die Übersetzung wird beigefügt, und die zuständige Stelle begründet ihre Entscheidung. Der Antragsteller bekommt nicht in allem recht. Er bekommt eine Antwort, gegen die er auf einem bekannten Weg vorgehen kann.\n\nDie neue Union hat damit keine Einigkeit erreicht. Sie hat etwas Belastbareres geschaffen: Auch Menschen, die einer Entscheidung widersprechen, können weiter an ihrer gemeinsamen Ordnung teilnehmen. Lito liest den Fallbericht bis zur letzten Seite und lässt ihn ohne persönliche Anweisung ablegen."
 sr_cb_9_central_d:0 "Die zentrale Fassung hat die Verwaltung vereinheitlicht. Entscheidungen lassen sich rascher durch die Instanzen geben, und die Regierung muss seltener zwischen widersprechenden örtlichen Regeln vermitteln.\n\nDie Beschwerdeberichte werden dadurch nicht kürzer. Sie kommen nur häufiger mit derselben Antwort zurück: Die verbindliche Auslegung liege bereits vor. Unter der neuen Flagge wächst eine starke Zentrale. Die gemeinsame Ordnung bleibt für viele Menschen etwas, das aus der Hauptstadt zu ihnen spricht, ohne ihnen ein gleichwertiges Wort zu geben."
 sr_cb_9_a:0 "Dieser Vertrag braucht nicht für jede Antwort meine Unterschrift."
 sr_cb_9_b:0 "Die Zentrale kann entscheiden. Sie muss weiter überzeugen."
 sr_cb_reciprocal_trade:0 "Gegenseitiger Wirtschaftsvertrag"
 sr_cb_reciprocal_trade_desc:0 "Gemeinsame Lieferregeln geben für 180 Tage +2 % Baugeschwindigkeit, binden aber täglich 0,05 politische Macht."
 sr_cb_directed_deliveries:0 "Sowjetische Liefervorgaben"
 sr_cb_directed_deliveries_desc:0 "Verbindliche Vorgaben erhöhen den Fabrikausstoß für 180 Tage um 4 %, senken aber die Stabilität um 3 Prozentpunkte."
 sr_cb_joint_standards:0 "Gemeinsam beschlossene Standards"
 sr_cb_joint_standards_desc:0 "Abgestimmte technische Verfahren erhöhen das Wachstum der Produktionseffizienz für 365 Tage um 3 %."
 sr_cb_partner_resentment:0 "Ein Partner, der sich übergangen fühlt"
 sr_cb_partner_resentment_desc:0 "Nicht beantwortete Einwände belasten die Zusammenarbeit für 270 Tage: −0,10 tägliche politische Macht und −2 Prozentpunkte Stabilität."
 sr_cb_federal_audit:0 "Die Haushaltsbücher werden geöffnet"
 sr_cb_federal_audit_desc:0 "Eine unabhängige Prüfung kostet für 180 Tage täglich 0,05 politische Macht und gibt +2 Prozentpunkte Stabilität."
 sr_cb_federal_guarantees:0 "Verbindliche Rechte des Volksrats"
 sr_cb_federal_guarantees_desc:0 "Gesicherte Änderungsrechte geben der Balkanföderation für 365 Tage +3 Prozentpunkte Stabilität; die Umstellung kostet 2 % Fabrikausstoß."
 sr_cb_federal_compliance:0 "Bestätigte Beraterordnung"
 sr_cb_federal_compliance_desc:0 "Die straffere Koordination gibt der Balkanföderation für 365 Tage +4 % Fabrikausstoß und kostet täglich 0,10 politische Macht."
 sr_cb_federal_deadlock:0 "Zuständig, aber nicht entscheidungsfähig"
 sr_cb_federal_deadlock_desc:0 "Ein blockierter föderaler Haushalt senkt für 270 Tage die Stabilität um 4 Prozentpunkte und die Baugeschwindigkeit um 3 %."
 sr_cb_charter_translation:0 "Ein Vertrag in vielen Sprachen"
 sr_cb_charter_translation_desc:0 "Übersetzungen und verbindliche gemeinsame Verfahren binden für 240 Tage täglich 0,10 politische Macht."
 sr_cb_plural_institutions:0 "Ein Vertrag mit eigenen Stimmen"
 sr_cb_plural_institutions_desc:0 "Mehrsprachige, überprüfbare Institutionen geben für 540 Tage +3 Prozentpunkte Stabilität; zusätzliche Abstimmung kostet 1 % Baugeschwindigkeit."
 sr_cb_central_institutions:0 "Eine verbindliche Zentrale"
 sr_cb_central_institutions_desc:0 "Die zentrale Ordnung gibt für 540 Tage täglich +0,10 politische Macht, senkt aber die Stabilität um 3 Prozentpunkte."
