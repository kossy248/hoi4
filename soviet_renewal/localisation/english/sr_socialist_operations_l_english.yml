l_english:
 sr_operation_red_dawn_name:0 "Operation Red Dawn"
 sr_operation_red_dawn_desc:0 "A revolution begins with the question of who has the final word in the government chamber. Lito’s foreign bureau brings together the socialist movement in [From.GetNameDef] and prepares a decisive political transition.\n\nIn this game operation, our operatives reach the government building and enable the proclamation of a communist government. Normal completion immediately changes the target’s government to communism. Its borders, factions and subject status remain intact.\n\nRequires La Résistance, an agency, two operatives and 50% network strength. Costs: 75 political power at launch, 1,000 infantry equipment and five civilian factories for 30 days. Execution: 90 days. Any surviving non-communist nation other than the Soviet Union is a potential target, including major powers and subjects."
 sr_socialist_operation_result_tt:0 "On completion: the surviving eligible target immediately receives a communist government and +60 percentage points of communist support. It is neither annexed nor puppeted; the operation does not change existing wars or factions. Another Operation Red Dawn cannot begin there for 365 days. If the political situation has already changed during the mission, no further change of government is forced."
 sr_socialist_phase_contacts_name:0 "The Spark Beneath the Ashes"
 sr_socialist_phase_contacts_desc:0 "The foreign bureau contacts the target’s socialist movement. Different groups agree on a common demand for a new government."
 sr_socialist_phase_contacts_outcome:0 "The political movement presents a common program."
 sr_socialist_phase_government_name:0 "The Doors of the Old Order"
 sr_socialist_phase_government_desc:0 "The government building is the focus of this game phase. The operatives support a political transition while representatives of the socialist movement put forward a new claim to government."
 sr_socialist_phase_government_outcome:0 "The previous government loses political control of its own seat of power."
 sr_socialist_phase_proclamation_name:0 "When the Morning Turns Red"
 sr_socialist_phase_proclamation_desc:0 "The prepared proclamation declares the old government replaced. A communist cabinet takes office. The operation changes the country’s government rather than its borders."
 sr_socialist_phase_proclamation_outcome:0 "A communist government takes over the affairs of state."
 sr_socialist_operation_1_t:0 "A Red Dawn Beyond Our Borders"
 sr_socialist_operation_1_d:0 "The report from [event_target:sr_socialist_revolution_target.GetNameDef] lies among familiar production figures on Lito’s desk. The government building has become the setting of a political upheaval. The proclamation has been read; the communist government has begun its work.\n\nAn aide asks whether this can now be called a Soviet victory. Lito sets down the report. 'A change of government is a beginning,' he answers. 'Whether people follow that government will only become clear afterwards.'\n\nThe operation is complete. The new communist country retains its borders and foreign commitments."
 sr_socialist_operation_1_a:0 "The morning belongs to those who shape it."
 sr_socialist_operation_2_t:0 "The Proclamation in the Government Chamber"
 sr_socialist_operation_2_d:0 "Delegates, civil servants and curious onlookers gather outside the government chamber. A member of the new cabinet reads the proclamation: a communist government will henceforth direct the affairs of state.\n\nSupport from Lito’s Union has enabled the transition. Work within our own country begins only now. A declaration must become supplies, administration and a political program.\n\nThe change of government alters neither our existing borders nor our factions or any subject relationship."
 sr_socialist_operation_2_a:0 "The proclamation must become a government."
