l_english:
 sr_focus_story_1_title:0 "Who Owns the Workbench?"
 sr_focus_story_1_desc:0 "The director has finished reading his production figures when a fitter stands up. If the council can only advise, she asks, how does it differ from the old factory meeting? Hands drum on the tables behind her. The director points to delivery deadlines: they cannot debate a turbine until the power station stops.\n\nLito must decide which promise carries weight today. Workers’ self-management will be established. But who can say no when the two sides disagree?"
 sr_focus_story_1_councils:0 "Give the council the final word—and the resources to learn."
 sr_focus_story_1_director:0 "The council advises; the director answers for the plan."
 sr_focus_story_2_title:0 "Grain Does Not Move on Paper"
 sr_focus_story_2_desc:0 "Deliveries appear as straight arrows on the agriculture commissariat’s map. The rural delegation brings different documents: seed requirements, broken wagons and families who need grain until the next harvest. Their cooperatives will deliver, but demand reliable prices.\n\nThe planners warn that additional contracts cost money. A compulsory procurement quota promises faster deliveries. Lito knows the risk: a full granary can look like success in a report and a broken promise in the villages."
 sr_focus_story_2_contracts:0 "Pay for reliable contracts instead of dictating new quotas."
 sr_focus_story_2_quota:0 "The cities need grain. Establish a fixed procurement quota."
 sr_focus_story_3_title:0 "A Laboratory with Two Keys"
 sr_focus_story_3_desc:0 "The first experiment has succeeded. Now the laboratory directors argue over who may see the results. The civilian academy wants drawings and measurements sent to every republic. Intelligence officers demand locked cabinets and security passes: what improves a radio today could help the enemy tomorrow.\n\nBoth sides offer progress. One requests funding for exchange; the other promises immediate applications in arms factories. Beneath Lito’s signature must stand an answer: who is this knowledge for?"
 sr_focus_story_3_open:0 "The institutes must share their results."
 sr_focus_story_3_secret:0 "Military applications take priority for now."
 sr_focus_story_4_title:0 "The Captain Disagrees"
 sr_focus_story_4_desc:0 "The general staff describes the exercise as proof of seamless leadership. A captain places his march timetable beside the report: his company waited for written orders while the neighboring unit was already retreating. Permission to act independently might have changed the outcome.\n\nA staff officer replies that a thousand independently acting captains do not form a common front. Both men will teach at the new officer schools. Lito must decide which lesson goes on the blackboard."
 sr_focus_story_4_initiative:0 "Train officers to take responsibility."
 sr_focus_story_4_plans:0 "Initiative requires a common operational plan."
 sr_focus_story_5_title:0 "The Flight Nobody Reports"
 sr_focus_story_5_desc:0 "The new altitude record is already on the newspaper’s front page. The same envelope contains a report on an aircraft that failed to return from an exercise. Mechanics cite missing spare parts; the training director cites insufficient flying hours.\n\nFunding initially covers one additional effort. New workshops require political support and money. Extra training flights can begin immediately but consume fuel. Lito puts the record-breaking bulletin aside and picks up the accident report."
 sr_focus_story_5_workshops:0 "Spare parts first. Nobody flies for a headline."
 sr_focus_story_5_training:0 "More flying hours: experience cannot be learned on the ground."
 sr_focus_story_6_title:0 "Two Maps for One Fleet"
 sr_focus_story_6_desc:0 "The admiral unfolds a chart of ports and possible fleet visits. A liaison officer places merchant marine reports beside it: long routes, poorly protected convoys and captains who would be alone in a crisis.\n\nA visible fleet gives the Union prestige and strengthens its crews. A dedicated escort program protects unremarkable freighters but commits resources. Lito asks which ships the Union would miss if they failed to arrive tomorrow."
 sr_focus_story_6_escorts:0 "A strong Union brings its merchant ships home."
 sr_focus_story_6_prestige:0 "Let the world see our flag at sea."
 sr_focus_story_7_title:0 "The Names in the Sealed Dossier"
 sr_focus_story_7_desc:0 "The dossier describes no grand conspiracy. It lists official apartments, missing materials and contracts awarded to relatives. Several pages name comrades who know Lito personally. One has already requested a confidential conversation.\n\nThe inquiry commission demands a free hand. The party secretary recommends investigating lower offices first: leadership must not weaken itself at such a moment. Lito promised accountability. Now the word concerns his own allies."
 sr_focus_story_7_independent:0 "My friends must answer for their actions too."
 sr_focus_story_7_limited:0 "Limit the inquiry. Party leadership must remain effective."
 sr_focus_story_8_title:0 "A Union Made of Decisions"
 sr_focus_story_8_desc:0 "The final report lies on Lito’s desk. It records factory assemblies, harvests, arguments about orders and letters from the republics. The Union still stands. Why it stands cannot be reduced to a single number.\n\nSome institutions rest on consent, others on patience, others on the center’s power. Lito turns to the last page. It contains no new slogan, only the next task: people must be able to trust these institutions even when he is not personally at the negotiating table.\n\nCurrent trust in Lito’s government: [?sr_story_trust|0]/100."
 sr_focus_story_8_trusted:0 "That trust belongs to the people who sustain the Union."
 sr_focus_story_8_contested:0 "The charter stands. The work of persuasion continues."
 sr_focus_story_9_title:0 "Three Months Later: the Factory Assembly"
 sr_focus_story_9_desc:0 "The new report arrives without a gold border. It records missed shifts, completed orders and decisions absent from the original draft. The rules from Lito’s visit have become everyday practice.\n\nWhere councils could decide, disputes initially consumed time; now workers pass experience to other factories. Where directors retained the final word, production plans advanced faster. There, however, the old question returns: does participation mean more than a meeting before the decision?"
 sr_focus_story_9_councils:0 "Argument has become experience. Share it with other factories."
 sr_focus_story_9_directors:0 "Deliveries are on target. The workers’ silence remains."
 sr_focus_story_10_title:0 "Four Months Later: the Second Laboratory Report"
 sr_focus_story_10_desc:0 "The laboratory report demonstrates how much scientific discovery depends on decisions made at an institute’s doors. Open cooperation has produced improvements in civilian factories; the protected program has instead developed technical solutions for the armed forces.\n\nBoth paths deliver results. The institutes also remember to whom they had to explain their work. Science has not become an apolitical space under Lito. It has acquired a direction whose effects will outlast this report."
 sr_focus_story_10_open:0 "The next institute should not have to start from nothing."
 sr_focus_story_10_secret:0 "Give the armed forces the new measurement procedures."
 sr_fs_factory_debate:0 "The Factory Learns to Decide"
 sr_fs_factory_debate_desc:0 "New self-management requires meetings and practice. Factory output: −3% for 90 days. A report follows after three months."
 sr_fs_factory_quota:0 "The Director Meets the Quota"
 sr_fs_factory_quota_desc:0 "Clear instructions temporarily accelerate production. Factory output: +4% for 180 days; workers still expect meaningful participation."
 sr_fs_procurement_drive:0 "Central Grain Procurement"
 sr_fs_procurement_drive_desc:0 "Fixed quotas ease short-term supply but burden rural communities. Factory output: +3%; stability: −2 percentage points for 180 days."
 sr_fs_open_research:0 "Open Laboratory Books"
 sr_fs_open_research_desc:0 "Funded exchange accelerates shared research. Research speed: +1.5% for 365 days."
 sr_fs_military_laboratories:0 "Protected Military Laboratories"
 sr_fs_military_laboratories_desc:0 "Research concentrates on applications in arms factories. Factory output: +2.5% for 365 days."
 sr_fs_field_command:0 "Responsibility at the Front"
 sr_fs_field_command_desc:0 "Officer education encourages initiative but requires more coordination. Army organization: +3%; planning speed: −3% for 365 days."
 sr_fs_central_planning:0 "Binding Staff Plans"
 sr_fs_central_planning_desc:0 "Central procedures facilitate planning but restrict local initiative. Planning speed: +6%; army organization: −1% for 365 days."
 sr_fs_air_workshops:0 "Spare Parts Before Records"
 sr_fs_air_workshops_desc:0 "Additional workshop funding keeps aircraft operational. Air accidents: −5%; air mission efficiency: +1% for 365 days."
 sr_fs_extended_flying:0 "Additional Training Flights"
 sr_fs_extended_flying_desc:0 "Pilots gain experience; additional flights consume fuel. Air force fuel consumption: +5% for 180 days."
 sr_fs_merchant_escorts:0 "Escorts for Merchant Shipping"
 sr_fs_merchant_escorts_desc:0 "Additional escort exercises improve protection and increase consumption. Convoy escort efficiency: +5%; naval fuel consumption: +2% for 365 days."
 sr_fs_fleet_presence:0 "The Union’s Flag at Sea"
 sr_fs_fleet_presence_desc:0 "Fleet visits strengthen crews but require fuel. Naval organization: +3%; naval fuel consumption: +5% for 180 days."
 sr_fs_privileges_review:0 "The Commission Reviews Privileges"
 sr_fs_privileges_review_desc:0 "Independent investigations occupy political staff. Daily political power: −0.05 for 180 days."
 sr_fs_learned_self_management:0 "Experienced Workers’ Councils"
 sr_fs_learned_self_management_desc:0 "Following a difficult start, workers share successful methods. Factory output: +3% for 365 days."
 sr_fs_electronics_bonus:0 "First Electronics Laboratory Trial"
 sr_fs_open_science_bonus:0 "Open Laboratory Exchange"
 sr_fs_military_science_bonus:0 "Protected Military Trial"
