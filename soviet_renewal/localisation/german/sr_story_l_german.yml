l_german:
 sr_story_government:0 "Litos Regierungstagebuch"
 sr_story_government_desc:0 "§YVertrauen in Litos Regierung: [?sr_story_trust|0]/100§!\n\nLito verspricht eine Union, in der Menschen mitreden dürfen. Die ersten hundert Tage zeigen, was dieses Versprechen wert ist. Parteiapparat, Betriebe und Republiken erinnern sich daran, wer ihnen etwas zugesagt hat.\n\nAngenommene Republikforderungen erscheinen als Missionen mit eigener Frist. Ein ehrliches Nein enttäuscht; ein gebrochenes Versprechen schadet stärker."
 sr_story_trust:0 "Vertrauen in Litos Regierung"
 sr_story_ukraine_promise:0 "Das ukrainische Aufbauversprechen einlösen"
 sr_story_ukraine_promise_desc:0 "Die Delegation wartet auf den unterschriebenen Aufbauvertrag. Innerhalb von 180 Tagen müssen 65 politische Macht bereitgestellt und ein kontrolliertes ukrainisches Kerngebiet mit freiem Zivilfabrikplatz gefunden werden. Dort entsteht eine Zivilfabrik. Die Versorgung bindet anschließend 180 Tage lang drei Prozentpunkte zusätzlichen Konsumgüterfaktor.\n\nErfüllt: +12 Vertrauen, −20 ukrainischer Widerstand, +0,04 Unionsbalance. Versäumt: −15 Vertrauen, +25 ukrainischer Widerstand, −0,06 Unionsbalance. Die Frist läuft ab der Zusage."
 sr_story_georgia_promise:0 "Das georgische Sprachenstatut verabschieden"
 sr_story_georgia_promise_desc:0 "Tiflis verlangt verbindliche Rechte für die georgische Sprache in Verwaltung und Ausbildung. Für 65 politische Macht können wir das Statut innerhalb von 150 Tagen umsetzen. Dauerhaft: +2 Prozentpunkte Stabilität, aber −0,05 tägliche politische Macht für die föderale Abstimmung.\n\nErfüllt: +12 Vertrauen, −20 georgischer Widerstand, +0,04 Unionsbalance. Versäumt: −15 Vertrauen, +25 georgischer Widerstand, −0,06 Unionsbalance."
 sr_story_kazakhstan_promise:0 "Den kasachischen Versorgungsvertrag erfüllen"
 sr_story_kazakhstan_promise_desc:0 "Alma-Ata verlangt einen Anschluss an die gemeinsamen Versorgungswege. Innerhalb von 210 Tagen investieren wir 90 politische Macht und bauen eine Infrastrukturstufe in einem kontrollierten kasachischen Kerngebiet mit freiem Infrastrukturplatz. Der Materialaufwand senkt den Fabrikausstoß für 210 Tage um 3 %.\n\nErfüllt: +15 Vertrauen, −20 kasachischer Widerstand, +0,04 Unionsbalance. Versäumt: −15 Vertrauen, +25 kasachischer Widerstand, −0,06 Unionsbalance."
 sr_story_rebuild_confidence:0 "Eine neue Vertrauensabstimmung wagen"
 sr_story_rebuild_confidence_desc:0 "Die Bilanz der ersten hundert Tage hat unsere Regierung beschädigt. Wenn wir durch erfüllte Zusagen oder öffentliche Rechenschaft wieder mindestens 55 Vertrauen erreicht haben, können wir für 70 politische Macht ein neues Mandat einholen. Das beendet die Regierungskrise und verschiebt die Unionsbalance um +0,05."
 sr_story_public_accountability:0 "Öffentlich über die Regierungsarbeit berichten"
 sr_story_public_accountability_desc:0 "Lito stellt sich Fragen aus Betrieben und Republiken. Für 45 politische Macht steigt das Vertrauen um 6. Ausschüsse prüfen die Antworten 90 Tage lang: +2 Prozentpunkte Stabilität, −0,05 tägliche politische Macht. Nach 120 Tagen erneut möglich. Die Anhörung ersetzt keine ausstehende Republikzusage."
 sr_story_ukraine_promise_tt:0 "Eine §Y180-Tage-Mission§! beginnt. Erfüllung kostet 65 politische Macht und bindet vorübergehend Konsumgüterkapazität. Ein gebrochenes Versprechen kostet mehr Vertrauen als eine sofortige Absage."
 sr_story_georgia_promise_tt:0 "Eine §Y150-Tage-Mission§! beginnt. Erfüllung kostet 65 politische Macht und verpflichtet dauerhaft zur föderalen Abstimmung."
 sr_story_kazakhstan_promise_tt:0 "Eine §Y210-Tage-Mission§! beginnt. Erfüllung kostet 90 politische Macht und bindet vorübergehend Industrieproduktion."
 sr_story_confidence_recovery_tt:0 "Die Entscheidung §YEine neue Vertrauensabstimmung wagen§! wird sichtbar. Für ein neues Mandat benötigen wir mindestens 55 Vertrauen und 70 politische Macht."
 sr_story_open_deliberation:0 "Geöffnete Türen"
 sr_story_open_deliberation_desc:0 "Lito lässt öffentlich beraten. Zusätzliche Mitsprache schafft Vertrauen und Stabilität, verlängert aber die Vorbereitung gemeinsamer Bauvorhaben."
 sr_story_central_administration:0 "Befehle aus der Zentrale"
 sr_story_central_administration_desc:0 "Ein straffer Apparat setzt Anweisungen schnell durch. In den Republiken wächst der Verdacht, dass sich unter Lito nur die Unterschrift geändert hat."
 sr_story_untouched_privileges:0 "Die alten Schlüsselhalter"
 sr_story_untouched_privileges_desc:0 "Lito hat den leitenden Parteikadern ihre Sonderrechte belassen. Sie halten ihm den Rücken frei, schützen aber weiterhin kostspielige Patronagenetze. Der Schwerpunkt „Die Privilegien überprüfen“ beendet dieses Arrangement."
 sr_story_emergency_secretariat:0 "Litos Sondersekretariat"
 sr_story_emergency_secretariat_desc:0 "Ein persönliches Sekretariat kann Ratsbeschlüsse blockieren. Es erleichtert die politische Steuerung, beschädigt aber den Glauben an verbindliche Mitbestimmung."
 sr_story_compromise_committees:0 "Ausschüsse statt Abkürzungen"
 sr_story_compromise_committees_desc:0 "Gemischte Ausschüsse prüfen die Einwände von Räten, Partei und Republiken. Das schafft Verlässlichkeit, kostet aber laufend politische Arbeit."
 sr_story_government_in_crisis:0 "Eine Regierung unter Beschuss"
 sr_story_government_in_crisis_desc:0 "Nach hundert Tagen zweifeln zu viele Delegierte an Litos Wort. Erst wiedergewonnenes Vertrauen und eine neue Vertrauensabstimmung können die Krise beenden."
 sr_story_relief_budget:0 "Ukrainischer Aufbauhaushalt"
 sr_story_relief_budget_desc:0 "Wohnraum, Verpflegung und zivile Güter begleiten das neue Werk. Diese tatsächliche Versorgung bindet vorübergehend zusätzliche Konsumgüterkapazität."
 sr_story_cultural_autonomy:0 "Das georgische Sprachenstatut"
 sr_story_cultural_autonomy_desc:0 "Die zugesagten Sprachrechte sind verbindlich geworden. Übersetzung und föderale Abstimmung kosten laufend politische Arbeit, stärken aber die Stabilität."
 sr_story_eastern_investment:0 "Material für die östlichen Versorgungswege"
 sr_story_eastern_investment_desc:0 "Bautrupps und Maschinen werden für den kasachischen Versorgungsvertrag bereitgestellt. Der unionsweite Fabrikausstoß fällt vorübergehend geringer aus."
 sr_story_mediation:0 "Lito am Verhandlungstisch"
 sr_story_mediation_desc:0 "Eine Schlichtung der Streiks bindet politische Mittel und verzögert neue Bauvorhaben. Dafür erhalten die Delegierten einen glaubwürdigen Weg zurück in die gemeinsamen Institutionen."
 sr_story_security_campaign:0 "Ordnung unter Bewachung"
 sr_story_security_campaign_desc:0 "Sicherheitskräfte drängen offene Proteste zurück. Die Regierung gewinnt Handlungsspielraum, doch die sichtbare Bewachung kostet Stabilität und Vertrauen."
 sr_domestic.1.t:0 "Die erste Unterschrift"
 sr_domestic.1.d:0 "Auf Litos Schreibtisch liegen zwei Fassungen derselben Antrittsrede. In der einen spricht die Partei für die Menschen; in der anderen sollen die Menschen auch der Partei widersprechen dürfen.\n\nHinter den Fenstern wartet die Moskauer Presse. In den Republiken wartet man auf etwas anderes: Darf ein Mann mit jugoslawischen Wurzeln eine gleichberechtigte Union versprechen und trotzdem allein bestimmen, was Gleichberechtigung bedeutet?\n\nLito legt den Füller auf das Papier. Ein einmaliger Übergangshaushalt von 40 politischer Macht steht bereit. Die ersten hundert Tage werden sein Versprechen auf die Probe stellen."
 sr_domestic.1.a:0 "Ich werde die Räte besuchen, bevor ich für sie spreche."
 sr_domestic.1.b:0 "Zuerst muss die Zentrale wieder handeln können."
 sr_domestic.1.c:0 "Die Partei führt; die Republiken müssen mit am Tisch sitzen."
 sr_domestic.2.t:0 "Die Schlüssel zum Apparat"
 sr_domestic.2.d:0 "Die Akten sind ordentlich geführt, die Dienstwagen pünktlich, die Sonderrationen vollständig. Gerade das macht den Bericht der Kontrolleure so unangenehm. Für die leitenden Kader hat der Regierungswechsel bisher kaum etwas verändert.\n\nEin Delegierter fragt, weshalb ein Werkleiter der Parteizentrale mehr Rechenschaft schulde als den Menschen im Werk. Die zuständige Kommission erklärt, eine öffentliche Untersuchung würde erfahrene Funktionäre gegen Lito aufbringen.\n\nDie Frage ist jetzt im Raum. Lito kann sie nicht gleichzeitig beantworten und verschwinden lassen."
 sr_domestic.2.a:0 "Die Untersuchung wird öffentlich. Niemand erhält einen Freibrief."
 sr_domestic.2.b:0 "Wir brauchen diese Männer. Ihre Privilegien bleiben vorerst."
 sr_domestic.2.c:0 "Unser gemeinsamer Ausschuss bekommt die Akten und ein Mandat."
 sr_domestic.3.t:0 "Wer darf Lito widersprechen?"
 sr_domestic.3.d:0 "Die erste größere Produktionskonferenz endet nicht mit Applaus. Ein Rat lehnt eine Zuteilung aus Moskau ab, ein Parteisekretär erklärt den Beschluss für unverbindlich. Beide berufen sich auf Litos Antrittsrede.\n\nDie Rechtskommission legt drei Möglichkeiten vor: verbindliche Einspruchsrechte, ein persönliches Veto des Regierungschefs oder ein ständiges Schlichtungsverfahren. Jede Lösung nimmt jemandem Macht.\n\nLito erkennt seine eigene Frage aus den Tagen der Revolution wieder: Ist Mitbestimmung auch dann ein Recht, wenn sie dem eigenen Vorhaben im Weg steht?"
 sr_domestic.3.a:0 "Auch meine Regierung wird an die Einspruchsrechte gebunden."
 sr_domestic.3.b:0 "In letzter Instanz entscheidet mein Sekretariat."
 sr_domestic.3.c:0 "Ein gemeinsamer Ausschuss muss den Streit entscheiden."
 sr_domestic.4.t:0 "Hundert Tage später"
 sr_domestic.4.d_high:0 "Diesmal wartet vor Litos Büro keine schweigende Delegation. Aus mehreren Republiken sind konkrete Vorschläge eingegangen; Delegierte streiten darüber, weil sie erwarten, dass ihre Stimmen etwas bewirken.\n\nNicht alle Konflikte sind gelöst. Doch die Entscheidungen der vergangenen hundert Tage haben genug Vertrauen geschaffen, um Litos Programm über eine persönliche Antrittsrede hinauszutragen. Auf dem letzten Blatt des Berichts steht ein knapper Satz: „Die Regierung hält sich an Verfahren, die auch gegen sie gelten.“"
 sr_domestic.4.d_middle:0 "Der Bericht über die ersten hundert Tage ist weder Anklage noch Vertrauensvotum. Einige Delegierte halten Lito für einen Vermittler; andere für einen Mann, der Widersprüche nur in die nächste Sitzung verschiebt.\n\nDie Union wartet auf überprüfbare Ergebnisse. Beratungen werden weitergehen, aber jedes neue Versprechen wird nun genauer aufgeschrieben. Die Revolution hat einen anderen Ton bekommen. Ob sie auch andere Regeln hat, bleibt umstritten."
 sr_domestic.4.d_low:0 "Die Delegierten haben sich Litos erste Rede noch einmal vorlesen lassen. Danach ist der Saal still. Von verbindlicher Mitsprache war die Rede gewesen; im Alltag sehen viele erneut Sonderrechte und persönliche Entscheidungen.\n\nEin Betriebsvertreter formuliert es vorsichtig: „Wir sollen Vertrauen haben. Aber auf welcher Erfahrung soll es beruhen?“ Die ersten hundert Tage enden mit einer Regierungskrise. Lito kann neues Vertrauen gewinnen, doch eine weitere Rede wird dafür nicht genügen."
 sr_domestic.4.a:0 "Dieses Mandat müssen wir uns immer wieder verdienen."
 sr_domestic.4.b:0 "Dann sollen die nächsten Beschlüsse überprüfbar sein."
 sr_domestic.4.c:0 "Wir müssen Vertrauen zurückgewinnen, bevor wir es verlangen."
 sr_domestic.11.t:0 "Die ukrainischen Delegierten bringen eine Rechnung"
 sr_domestic.11.d:0 "Die ukrainische Delegation erscheint mit Lieferlisten und beschädigten Werkzeugen. Sie verlangt kein weiteres Bekenntnis zur Brüderlichkeit, sondern ein ziviles Aufbauwerk samt Versorgung seiner Beschäftigten.\n\n„Wenn die Republik nur Abgaben liefert und auf den nächsten Plan wartet, worin besteht dann ihre Mitbestimmung?“ Lito kann einen verbindlichen Aufbauvertrag über 180 Tage zusagen. Die Fachleute nennen den Preis: politische Mittel und ein befristet höherer Konsumgüterbedarf. Eine offene Absage wäre enttäuschend. Eine Unterschrift ohne Umsetzung wäre schwerer zu vergessen."
 sr_domestic.11.a:0 "Schreibt die Frist auf. Die Regierung wird daran gemessen."
 sr_domestic.11.b:0 "Das kann ich euch derzeit nicht verbindlich zusagen."
 sr_domestic.12.t:0 "Tiflis verlangt mehr als eine Übersetzung"
 sr_domestic.12.d:0 "Die georgischen Abgeordneten haben den neuen Unionsentwurf sorgfältig gelesen. Nun fragen sie, in welcher Sprache sich ein Arbeiter gegen einen Verwaltungsentscheid wehren darf und wer seine Beschwerde tatsächlich versteht.\n\nIhr Vorschlag ist ein verbindliches Sprachenstatut für Verwaltung und Ausbildung. Die Zentrale müsste dauerhaft Übersetzungen und Abstimmungen finanzieren. Lito könnte innerhalb von 150 Tagen aus einem allgemeinen Versprechen ein einklagbares Verfahren machen. Oder er muss erklären, weshalb föderale Mitsprache an der Bürotür endet."
 sr_domestic.12.a:0 "Verständigung ist Teil der gemeinsamen Ordnung. Wir setzen es um."
 sr_domestic.12.b:0 "Ein gesondertes Statut können wir derzeit nicht tragen."
 sr_domestic.13.t:0 "Ein langer Weg von Alma-Ata"
 sr_domestic.13.d:0 "Die kasachische Delegation ist seit Tagen unterwegs. Ihr Sprecher legt einen Fahrplan auf den Tisch: ausgefallene Lieferungen, umgeleitete Maschinen, Orte, die auf jeder Unionskarte verbunden und im Alltag kaum erreichbar sind.\n\nLito bekommt einen Vertrag für einen tatsächlichen Infrastrukturanschluss vorgelegt. Er braucht 210 Tage, politische Mittel und Material, das anderswo fehlen wird. Die Delegation verlangt keine sofortige Gleichheit aller Lebensverhältnisse. Sie verlangt ein Versprechen mit einer Frist, an die sich auch Moskau halten muss."
 sr_domestic.13.a:0 "Die Versorgung ist eine gemeinsame Verpflichtung."
 sr_domestic.13.b:0 "Ich verspreche keinen Bau, dessen Mittel noch fehlen."
 sr_domestic.14.t:0 "Ein Werk und ein eingehaltenes Wort"
 sr_domestic.14.d:0 "Die erste Schicht meldet sich im neuen ukrainischen Aufbauwerk. Im Telegramm der Delegation stehen nüchterne Zahlen zu Maschinen, Wohnraum und Versorgung. Am Ende folgt ein handschriftlicher Zusatz: „Die Frist wurde gehalten.“\n\nDie Versorgungskosten bleiben für eine Weile spürbar. Aber Litos Unterschrift ist nun an einem Ort mit Werkstoren verbunden. Die zugesagte Gegenleistung wurde bereits umgesetzt; Vertrauen und Unionszusammenhalt haben sich verbessert."
 sr_domestic.14.a:0 "Antwortet mit Dank. Und lasst die Lieferungen nicht abreißen."
 sr_domestic.15.t:0 "Das Statut steht im Amtsblatt"
 sr_domestic.15.d:0 "Das georgische Sprachenstatut ist veröffentlicht. Am nächsten Morgen liegt der erste Widerspruch in georgischer Sprache auf dem Tisch einer Behörde. Niemand weiß, ob die Beschwerde recht bekommen wird. Sie muss jetzt aber ordentlich bearbeitet werden.\n\nAus Tiflis kommt ein kurzer Brief: „Wir haben nicht um freundliche Worte gebeten. Wir haben um ein Verfahren gebeten.“ Die laufende Abstimmung kostet politische Arbeit; die gegebene Zusage ist erfüllt."
 sr_domestic.15.a:0 "Ein Recht muss im Alltag gelten."
 sr_domestic.16.t:0 "Eine Verbindung, die auf der Karte gefehlt hat"
 sr_domestic.16.d:0 "Bautrupps melden den vereinbarten Ausbau der kasachischen Versorgungswege. Die Arbeit zieht noch für einige Monate Material aus anderen Produktionsplänen ab. Dafür erreicht eine Lieferung nun ihr Ziel, statt zum Gegenstand einer weiteren Beschwerde zu werden.\n\nDie Delegation aus Alma-Ata bittet darum, die Namen der örtlichen Arbeiter im Abschlussbericht zu nennen. Lito streicht die vorbereitete Selbstbelobigung der Zentrale und lässt die Liste beifügen. Der Vertrag wurde erfüllt."
 sr_domestic.16.a:0 "Dann gehören diese Namen in den Bericht."
 sr_domestic.17.t:0 "Die Frist auf dem ukrainischen Vertrag"
 sr_domestic.17.d:0 "Die vereinbarten 180 Tage sind vergangen. Die ukrainischen Delegierten legen denselben Vertrag erneut auf den Tisch. Auf dem Papier steht noch immer Litos Unterschrift; am vorgesehenen Ort steht das Werk nicht.\n\n„Wir hätten eine ehrliche Absage verstanden“, erklärt der Sprecher. „Worauf sollen wir uns beim nächsten Mal verlassen?“ Der Vertrauensverlust und der zusätzliche ukrainische Widerstand sind bereits eingetreten. Es wird Arbeit kosten, diese Erfahrung wieder zu ändern."
 sr_domestic.17.a:0 "Unsere Unterschrift war mehr wert als unsere Umsetzung."
 sr_domestic.18.t:0 "Ein Recht im Entwurfsstadium"
 sr_domestic.18.d:0 "Nach Ablauf der 150 Tage ist das georgische Sprachenstatut noch immer ein Entwurf. Behörden verweisen auf ausstehende Mittel, Ausschüsse auf fehlende Beschlüsse. In Tiflis wird längst über etwas anderes gesprochen: ob Zusagen aus Moskau überhaupt verbindlich sind.\n\nDie Republik hat keinen zusätzlichen Sonderstatus verlangt, heißt es im Protestschreiben, sondern die angekündigte Mitbestimmung im Alltag. Der Vertrauensverlust und der gestiegene georgische Widerstand sind bereits wirksam."
 sr_domestic.18.a:0 "Das lässt sich nicht mit einer weiteren Übersetzung lösen."
 sr_domestic.19.t:0 "Der Fahrplan bleibt derselbe"
 sr_domestic.19.d:0 "Aus Alma-Ata kommt ein Telegramm ohne Grußformel. Der vereinbarte Ausbau wurde innerhalb von 210 Tagen nicht umgesetzt. Daneben liegen Abschriften mehrerer Lieferanfragen, die zwischen den zuständigen Stellen hin- und hergingen.\n\nDie Entfernung zwischen Zentrale und Republik lässt sich wieder in ausgefallenen Lieferungen messen. Der erhöhte kasachische Widerstand und der Vertrauensverlust sind bereits eingetreten. Für die Delegierten zählt nun, was nach dem gebrochenen Wort tatsächlich geschieht."
 sr_domestic.19.a:0 "Wir haben nicht nur einen Fahrplan enttäuscht."
 sr_domestic.20.t:0 "Die Nachtschicht bleibt vor dem Tor"
 sr_domestic.20.d:0 "Die Berichte aus den Republiken ergeben erstmals ein gemeinsames Bild: Schichten treten nicht an, Lieferungen bleiben liegen, örtliche Funktionäre warten auf Anweisungen, die niemand gern unterschreiben will. Die Unionskrise ist in den Betrieben angekommen.\n\nEin Vermittler bittet Lito, selbst an den Verhandlungstisch zu kommen. Die Sicherheitsverwaltung verspricht eine schnellere Wiederaufnahme der Arbeit. Beides hat einen Preis. Wegsehen schont den Haushalt heute und verschärft die Krise morgen.\n\nDies ist eine einmalige politische Weggabelung. Die eigentlichen Widerstandsnetze müssen anschließend weiter bearbeitet werden."
 sr_domestic.20.a:0 "Ich verhandele. Und die Vereinbarung wird etwas kosten dürfen."
 sr_domestic.20.b:0 "Die Tore werden geöffnet und die Arbeit wird wieder aufgenommen."
 sr_domestic.20.c:0 "Die lokalen Stellen müssen die Lage allein klären."
 sr_domestic.21.t:0 "Die alten Schlüssel werden abgegeben"
 sr_domestic.21.d:0 "Die Überprüfung der Privilegien hat jene Sonderrechte erreicht, die Lito zu Beginn seiner Amtszeit noch stehen ließ. Einige Funktionäre verlassen ihre Posten, andere legen erstmals nachvollziehbare Ausgaben vor.\n\nDer Fabrikausstoß wird nicht länger durch das alte Patronagenetz belastet; dieser nationale Geist wurde bereits entfernt. Die Delegierten registrieren, dass ein früheres Zugeständnis nun tatsächlich korrigiert worden ist."
 sr_domestic.21.a:0 "Auch frühere Entscheidungen dürfen überprüft werden."
 sr_domestic.22.t:0 "Ein Mandat nach der Krise"
 sr_domestic.22.d:0 "Die neue Vertrauensabstimmung ist ausgezählt. Dieses Mal liegt dem Votum kein unbeschriebenes Regierungsprogramm zugrunde, sondern eine Reihe überprüfbarer Handlungen. Die Regierungskrise ist beendet.\n\nLito bleibt nach dem Ende der Sitzung im Saal. Auf mehreren Plätzen liegen noch handschriftliche Einwände. Er lässt sie einsammeln und zu den nächsten Regierungsunterlagen legen. Ein neues Mandat ist kein Freibrief."
 sr_domestic.22.a:0 "Dann beginnen wir mit den liegen gebliebenen Einwänden."
