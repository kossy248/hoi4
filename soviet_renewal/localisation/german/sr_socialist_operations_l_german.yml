l_german:
 sr_operation_red_dawn_name:0 "Operation »Roter Morgen«"
 sr_operation_red_dawn_desc:0 "Eine Revolution beginnt nicht mit einem Grenzübertritt, sondern mit der Frage, wer im Regierungssaal das letzte Wort hat. Litos Auslandsbüro bündelt die Kräfte der sozialistischen Bewegung in [From.GetNameDef] und bereitet den entscheidenden politischen Umbruch vor.\n\nIn dieser Spieloperation erreichen unsere Operativen das Regierungsgebäude und ermöglichen die Proklamation einer kommunistischen Regierung. Beim regulären Abschluss wechselt das Zielland unmittelbar zum Kommunismus. Seine Grenzen, Bündnisse und Untertanenstellung bleiben bestehen.\n\nBenötigt: La Résistance, eine Agentur, zwei Operative und 50 % Netzwerkstärke. Kosten: 75 politische Macht beim Start, 1.000 Infanteriewaffen und fünf Zivilfabriken für 30 Tage. Durchführung: 90 Tage. Jede noch bestehende nichtkommunistische Nation außer der Sowjetunion ist ein mögliches Ziel; auch Großmächte und Untertanen sind nicht ausgeschlossen."
 sr_socialist_operation_result_tt:0 "Bei Abschluss: Das weiterhin bestehende, geeignete Zielland erhält direkt eine kommunistische Regierung und +60 Prozentpunkte kommunistische Unterstützung. Es wird weder annektiert noch zur Marionette; bestehende Kriege und Bündnisse werden nicht durch die Operation verändert. Für 365 Tage kann dort keine weitere Operation »Roter Morgen« beginnen. Hat sich die politische Lage während der Mission bereits verändert, wird kein neuer Regierungswechsel erzwungen."
 sr_socialist_phase_contacts_name:0 "Der Funke unter der Asche"
 sr_socialist_phase_contacts_desc:0 "Das Auslandsbüro tritt mit der sozialistischen Bewegung des Ziellandes in Verbindung. Unterschiedliche Gruppen verständigen sich auf die gemeinsame Forderung nach einer neuen Regierung."
 sr_socialist_phase_contacts_outcome:0 "Die politische Bewegung tritt mit einem gemeinsamen Programm auf."
 sr_socialist_phase_government_name:0 "Die Türen der alten Ordnung"
 sr_socialist_phase_government_desc:0 "Im Mittelpunkt dieser Spielphase steht das Regierungsgebäude. Die Operativen unterstützen den politischen Machtwechsel, während Vertreter der sozialistischen Bewegung einen neuen Regierungsanspruch anmelden."
 sr_socialist_phase_government_outcome:0 "Die bisherige Regierung verliert die politische Kontrolle über ihren eigenen Amtssitz."
 sr_socialist_phase_proclamation_name:0 "Wenn der Morgen rot wird"
 sr_socialist_phase_proclamation_desc:0 "Die vorbereitete Proklamation erklärt die alte Regierung für abgelöst. Ein kommunistisches Kabinett übernimmt die Staatsgeschäfte; die Operation verändert die Regierung des Landes und nicht seine Grenzen."
 sr_socialist_phase_proclamation_outcome:0 "Eine kommunistische Regierung übernimmt die Staatsgeschäfte."
 sr_socialist_operation_1_t:0 "Ein roter Morgen jenseits unserer Grenzen"
 sr_socialist_operation_1_d:0 "Der Bericht aus [event_target:sr_socialist_revolution_target.GetNameDef] liegt zwischen den vertrauten Produktionszahlen auf Litos Schreibtisch. Das Regierungsgebäude ist zum Schauplatz eines politischen Umbruchs geworden. Die Proklamation ist verlesen, die kommunistische Regierung hat ihre Arbeit aufgenommen.\n\nEin Referent fragt, ob man nun auch von einem sowjetischen Sieg sprechen dürfe. Lito legt den Bericht zur Seite. »Ein Regierungswechsel ist ein Anfang«, antwortet er. »Ob Menschen dieser Regierung folgen, wird sich erst danach zeigen.«\n\nDie Operation ist abgeschlossen. Das neue kommunistische Land behält seine Grenzen und seine außenpolitischen Bindungen."
 sr_socialist_operation_1_a:0 "Der Morgen gehört denen, die ihn gestalten."
 sr_socialist_operation_2_t:0 "Die Proklamation im Regierungssaal"
 sr_socialist_operation_2_d:0 "Vor dem Regierungssaal stehen Delegierte, Beamte und neugierige Zuschauer. Ein Mitglied des neuen Kabinetts verliest die Proklamation: Die Staatsgeschäfte liegen fortan bei einer kommunistischen Regierung.\n\nDie Unterstützung aus Litos Union hat den Machtwechsel ermöglicht. Die Arbeit im eigenen Land beginnt aber erst jetzt. Aus einer verlesenen Erklärung müssen Versorgung, Verwaltung und ein politisches Programm werden.\n\nDer Regierungswechsel verändert weder die bestehenden Grenzen noch die Bündnisse oder eine etwaige Untertanenstellung unseres Landes."
 sr_socialist_operation_2_a:0 "Aus der Proklamation muss eine Regierung werden."
