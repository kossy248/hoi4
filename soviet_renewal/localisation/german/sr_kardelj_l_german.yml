 YUG_sr_edvard_kardelj:0 "Edvard Kardelj"
 YUG_sr_edvard_kardelj_desc:0 "Der slowenische Kommunist Edvard Kardelj hat sich mit der Frage beschäftigt, wie Sozialismus und nationale Gleichberechtigung zusammenfinden können. Da Lito in der Sowjetunion geblieben ist, führt Kardelj die jugoslawische Bewegung. Er unterstützt eine sozialistische Zusammenarbeit, verlangt jedoch eigene Institutionen und eine hörbare Stimme für die Völker seiner Heimat. Freundschaft mit Moskau ist für ihn kein Verzicht auf Mitsprache."
