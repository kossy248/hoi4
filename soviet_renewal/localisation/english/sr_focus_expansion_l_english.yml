l_english:
 sr_exp_1_t:0 "The Crossed-Out Page"
 sr_exp_1_d:0 "The editor slides two versions of Lito’s memoirs across the table. The first begins with a determined revolutionary who never doubted his path. In the second, the same man is frightened at a border station, argues with comrades and initially misunderstands a factory assembly.\n\n'This page weakens the chairman,' says the party secretary. The editor shakes her head: 'It explains why he had to listen to other people.'\n\nLito recognizes his own handwriting beneath the crossed-out passage. The new Union will grow up with this account. Should it encounter an infallible founder or a man whose convictions developed through disagreement?"
 sr_exp_1_a:0 "Print my mistakes as well. (25 political power)"
 sr_exp_1_b:0 "The doubts stay in the archive; the Union needs a clear account."
 sr_exp_2_t:0 "The Empty Chair at the End of the Table"
 sr_exp_2_d:0 "The delegates have described every office in the draft constitution. The chairman’s succession has only a provisional rule. An old comrade suggests that it need not be discussed during Lito’s lifetime.\n\n'That is precisely when we must discuss it,' replies a Georgian jurist. She wants a public procedure with guaranteed republican representation. Party headquarters offers a shorter solution: a small leadership committee names the next chairman and avoids prolonged arguments.\n\nLito looks at the empty chair beside the clerk. This decision appoints no successor tomorrow. It determines whether the Union will someday be able to negotiate without its founder."
 sr_exp_2_a:0 "Put the procedure in the charter. (50 political power)"
 sr_exp_2_b:0 "The leadership committee will secure continuity."
 sr_exp_3_t:0 "The Reserve Has No Opening Ceremony"
 sr_exp_3_d:0 "Invitations have already been printed for the new factory. Additional warehouses do not even receive a drawing in the newspaper. Yet reserve administrators give Lito an urgent calculation: one bad winter could make spare parts, grain and fuel scarce at the same time.\n\nDirectors want the resources invested in immediate production. The reserve commission argues that stored goods are promises for an emergency rather than unfulfilled orders.\n\nA common stockpile costs output and political effort today. A production drive is visible sooner but leaves less room when the next delivery fails to arrive."
 sr_exp_3_a:0 "An unseen warehouse can also sustain the Union. (60 political power)"
 sr_exp_3_b:0 "The next shift comes first; we must produce more now."
 sr_exp_4_t:0 "A School outside the Blueprint"
 sr_exp_4_d:0 "The new assembly hall is ready. Where suitable space existed, the Union has built a civilian factory; otherwise, 50 political power is available for a later location plan. Two settlement proposals now lie beside it.\n\nThe director needs dormitories and a factory bus. Families ask for a school, a clinic and a hall where they can discuss their own community. 'If we are settling people,' asks a worker, 'why are we building only for their working hours?'\n\nA complete community costs additional resources and ties up consumer goods for a year. A factory settlement produces sooner. Both will remain long after the opening speech has faded."
 sr_exp_4_a:0 "Build for citizens, not merely for shifts. (75 political power)"
 sr_exp_4_b:0 "Production must first finance the settlement."
 sr_exp_5_t:0 "An Oath and a Complaint"
 sr_exp_5_d:0 "The first new military oath has scarcely been read when the legal service receives a recruit’s complaint. His commander treated a petition to the republican council as a breach of discipline.\n\nThe general staff insists on exclusive military jurisdiction. A civilian complaints office, it warns, would turn every disputed order into political negotiations. Council representatives reply that someone who leaves his rights at the barracks gate can hardly swear to protect the Union’s rights.\n\nLito must determine the oversight his new army should accept. Its arms are meant to defend the charter. The question is whether that charter also applies inside the barracks."
 sr_exp_5_a:0 "Civilian review protects the oath. (40 political power)"
 sr_exp_5_b:0 "Military proceedings remain within the chain of command."
 sr_exp_6_t:0 "Two Letters about the Same Delivery"
 sr_exp_6_d:0 "The first letter asks for new equipment and uninterrupted exercises for a military unit. The second comes from a soldier’s family. They work additional shifts while his promised leave has been postponed again.\n\nArmy staff wants to preserve its readiness schedule. A union representative proposes family support and reliable leave arrangements; lost working hours would temporarily reduce output while easing the burden on the troops.\n\nLito places the letters side by side. Neither disproves the other. His military policy will decide which burden becomes visible and which remains taken for granted."
 sr_exp_6_a:0 "The families contribute; we will carry part of their burden. (45 political power)"
 sr_exp_6_b:0 "For now, readiness takes precedence over relief."
 sr_exp_honest_biography:0 "An Unabridged Founding Story"
 sr_exp_honest_biography_desc:0 "Public debate requires political effort and strengthens credibility: −0.05 daily political power and +2 percentage points stability for 180 days."
 sr_exp_constitutional_succession:0 "A Regulated Federal Transition"
 sr_exp_constitutional_succession_desc:0 "A binding succession procedure gives 3 percentage points stability but costs 0.05 political power daily for 730 days."
 sr_exp_party_continuity:0 "Continuity through the Leadership Committee"
 sr_exp_party_continuity_desc:0 "A closely controlled succession facilitates decisions: +0.10 daily political power and −2 percentage points stability for 730 days."
 sr_exp_common_reserve:0 "The Common Union Reserve"
 sr_exp_common_reserve_desc:0 "Stockpiles provide security but reduce current production: +3 percentage points stability, −2% supply consumption and −2% factory output for 365 days."
 sr_exp_output_drive:0 "Deliver More Today"
 sr_exp_output_drive_desc:0 "Immediate production orders take priority over reserves: +4% factory output and −2 percentage points stability for 365 days."
 sr_exp_workers_town:0 "A Settlement Becomes a Community"
 sr_exp_workers_town_desc:0 "Schools, clinics and local administration create trust but require consumer goods: +3 percentage points stability and +2 percentage points consumer goods factor for 365 days."
 sr_exp_factory_settlement:0 "The Settlement Follows the Factory"
 sr_exp_factory_settlement_desc:0 "Development initially serves production: +5% factory output and −2 percentage points stability for 180 days."
 sr_exp_military_ombudsmen:0 "Civilian Oversight in the Barracks"
 sr_exp_military_ombudsmen_desc:0 "Trusted complaints procedures strengthen cohesion and lengthen consultations: +2% army organization and −2% planning speed for 730 days."
 sr_exp_military_jurisdiction:0 "Exclusive Military Jurisdiction"
 sr_exp_military_jurisdiction_desc:0 "A tighter chain of command speeds planning but damages promises of citizens’ rights: +4% planning speed and −2 percentage points stability for 365 days."
 sr_exp_front_family_support:0 "A Compact between Front and Home"
 sr_exp_front_family_support_desc:0 "Supported families strengthen morale, while leave reduces output: +4% army morale and −2% factory output for 365 days."
 sr_exp_readiness_priority:0 "Readiness before Relief"
 sr_exp_readiness_priority_desc:0 "Additional orders increase output and prolong the burden: +3% factory output and −2% army morale for 365 days."
