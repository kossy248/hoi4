l_english:
 sr_bs_1_t:0 "A Letter That Smells of Home"
 sr_bs_1_d:0 "Among reports on steel quotas lies a letter from Belgrade. Young trade unionists ask Lito for printing presses, scholarships and a cultural centre. A handwritten line reads: 'You have not forgotten where you come from.'\n\nLito reads it twice. His secretary places the unanswered requests of the Soviet republics beside it. Preferential aid to his homeland would make a powerful statement. In Kyiv and Tbilisi, it might sound like a broken promise of equality. The councils will respond in 45 days."
 sr_bs_1_a:0 "We will make an exception for home. (60 political power)"
 sr_bs_1_b:0 "An exchange with equal rules for everyone. (20 political power)"
 sr_bs_1_c:0 "My first responsibility is to the Union."
 sr_bs_home_priority_tt:0 "The republics will respond to the preferential treatment in 45 days. Compensation costs another 50 political power; defending the exception weakens trust and increases Ukrainian resistance if that republic is represented."
 sr_bs_2_t:0 "What Begins in Belgrade Is Heard in Kyiv"
 sr_bs_2_priority_d:0 "The presses have arrived. Belgrade sends grateful letters; the republics send figures. A Ukrainian delegate asks why his factory must wait for equipment while Lito's homeland receives a special budget.\n\n'I do not oppose the aid,' he says. 'I oppose the standard.' Lito can fund compensation and end the special administration. Or he can defend the exception and accept the resentment."
 sr_bs_2_equal_d:0 "The first exchange report contains neither a Yugoslav special budget nor preferential scholarships. Belgrade is disappointed by the pace, but several republics have sent their own applicants.\n\nA government critic concedes: 'This time, the same rule applied to the chairman's friends.' The modest program has earned few headlines. That is partly why people believe it."
 sr_bs_2_distance_d:0 "The reply from Belgrade is polite and unusually short. The cultural centre remains closed; some organisers have approached other sponsors. Moscow has already allocated the money elsewhere.\n\nLito puts the letter in his personal drawer. The decision relieved the administration but explained little to the comrades at home. From outside, political independence can resemble indifference."
 sr_bs_2_a:0 "Compensate the republics. (50 political power)"
 sr_bs_2_b:0 "I stand by the exception."
 sr_bs_2_c:0 "One common rule matters more than a special promise."
 sr_bs_2_e:0 "We accept the consequences of keeping our distance."
 sr_bs_3_t:0 "The Diplomats Request an Explanation"
 sr_bs_3_d:0 "Several Balkan governments that remain non-communist have confiscated Soviet books and placed left-wing trade union meetings under surveillance. Their ambassadors call it unwanted interference. Local parties ask whether Moscow's new friendship can survive the first police raid.\n\nThe foreign commissariat proposes a public cultural program. The security apparatus offers clandestine presses and courier routes. Withdrawing would free resources immediately but weaken political work. Reports will arrive in 60 days. Political effects then apply only to surviving, peaceful, non-communist AI countries among the five Balkan partners."
 sr_bs_3_a:0 "Books, scholarships and open doors. (50 political power)"
 sr_bs_3_b:0 "Protect the underground organisation. (100 political power)"
 sr_bs_3_c:0 "Scale the contacts back for now."
 sr_bs_cultural_choice_tt:0 "After 60 days: +3 percentage points communist support in non-communist Balkan partners that remain eligible; the Union gains +1% research for 180 days and +3 trust."
 sr_bs_underground_choice_tt:0 "After 60 days: +6 percentage points communist support and a 180-day influence network in non-communist Balkan partners that remain eligible. For 180 days the Union loses 0.15 daily political power and 2 percentage points stability."
 sr_bs_retreat_choice_tt:0 "After 60 days: −2 percentage points communist support in non-communist Balkan partners that remain eligible and −4 trust in the Union."
 sr_bs_4_t:0 "A Reading Room Is Not Yet a Revolution"
 sr_bs_4_d:0 "The report lists small successes: a shared lecture, a translated textbook, a trade union library. Organisers no longer have to meet exclusively in back rooms. A government can prohibit a reading room, but every prohibition poses a question it must answer in public.\n\nCommunist support rises by three percentage points in the non-communist Balkan partners that remain eligible. Scientific exchange grants the Union a small research bonus for 180 days. No government changes, but the connection is stronger."
 sr_bs_4_a:0 "Relationships can grow without ultimatums."
 sr_bs_5_t:0 "The Press beneath the Bakery"
 sr_bs_5_d:0 "The courier routes work. Leaflets reach factories that would never host an open delegation. Communist support rises by six percentage points in the non-communist Balkan partners that remain eligible, and their networks gain another 180 days of backing.\n\nBut a confiscated suitcase contains Soviet accounts. The link to Moscow is difficult to deny. For 180 days, diplomatic damage control and domestic criticism cost daily political power and some stability. Lito's stronger influence has a price."
 sr_bs_5_a:0 "We keep helping. And answer the questions."
 sr_bs_6_t:0 "An Empty Seat at the Table"
 sr_bs_6_d:0 "Courier reports become infrequent, then stop. A Bulgarian trade unionist writes that his comrades collected their office rent themselves. They want to know whether Moscow's promises were meant only for quiet times.\n\nCommunist support falls by two percentage points in the non-communist Balkan partners that remain eligible. Critics in the Union recall Lito's speeches on international solidarity. Withdrawal saved resources. It did not save trust."
 sr_bs_6_a:0 "That was the price of our decision."
 sr_bs_7_t:0 "Who Speaks for the Balkan Federation?"
 sr_bs_7_d:0 "The founding celebrations are over. Five different sets of standing orders lie on the Federal People's Council's table. Small republics demand guaranteed votes; larger ones expect influence proportionate to their population. Soviet advisers mainly want quick decisions.\n\n'If federation means having a voice,' a delegate asks, 'why can we not write our own rules?' Lito can finance an elected federal assembly or place the key offices in the advisers' hands. The first shared budget in 120 days will test the arrangement."
 sr_bs_7_a:0 "Give the assembly time and resources. (60 political power)"
 sr_bs_7_b:0 "Our advisers must first make the administration work."
 sr_bs_8_t:0 "Their First Budget"
 sr_bs_8_d:0 "The budget debate lasted longer than expected. Delegates argued over ports, railways and school languages. In the end, even the dissatisfied signed: they had amendment rights and could win compromises.\n\nThe People's Council sends Lito a thick set of minutes rather than an oath of loyalty. It is the better sign. The surviving, peaceful Soviet Balkan subject gains additional stability and research speed for 365 days. Lito's choice also strengthens confidence in his federal promise."
 sr_bs_8_a:0 "A signature after an argument may last."
 sr_bs_9_t:0 "Decisions without Consent"
 sr_bs_9_d:0 "The Soviet advisers have accelerated production. Yet the republics' complaint repeats the same sentence in five languages: 'We vote on decisions that have already been made.' Several delegates leave before the final ballot.\n\nLito can replace the advisers' system with a funded federal assembly. It now costs more than offering participation at the start. Keeping the system saves political resources but imposes an additional year of discontent and production losses on the Balkan Federation."
 sr_bs_9_a:0 "Negotiate new rules together. (80 political power)"
 sr_bs_9_b:0 "The People's Council must implement the decisions."
 sr_bs_homeland_grants:0 "Special Budget for the Homeland"
 sr_bs_homeland_grants_desc:0 "Lito's preferential aid to Yugoslavia costs 0.10 daily political power for 180 days. Later compensation to the republics can end the special administration early."
 sr_bs_equal_exchange:0 "Exchange on Equal Terms"
 sr_bs_equal_exchange_desc:0 "Common rules reduce the maintenance cost of improved diplomatic relations by 10% for 180 days."
 sr_bs_cultural_front:0 "Open Cultural Contacts"
 sr_bs_cultural_front_desc:0 "A public Balkan exchange program increases research speed by 1% for 180 days."
 sr_bs_exposed_operations:0 "Exposed Underground Aid"
 sr_bs_exposed_operations_desc:0 "Revealed Soviet backing costs 0.15 daily political power and 2 percentage points of stability for 180 days."
 sr_bs_republic_assembly:0 "Federal Assembly"
 sr_bs_republic_assembly_desc:0 "A funded assembly represents the Balkan republics for 365 days: +5 percentage points stability and +0.10 daily political power."
 sr_bs_soviet_advisers:0 "Soviet Advisory Administration"
 sr_bs_soviet_advisers_desc:0 "A tighter administration increases factory output by 5% for 365 days at the cost of 3 percentage points stability. Missing participation will become a dispute after 120 days."
 sr_bs_federal_compact:0 "A Jointly Approved Budget"
 sr_bs_federal_compact_desc:0 "The first independently negotiated budget strengthens the Balkan Federation for 365 days: +3 percentage points stability and +2% research speed."
 sr_bs_federal_discontent:0 "Republics Ignored"
 sr_bs_federal_discontent_desc:0 "Rejecting a constitutional compromise burdens the Balkan Federation for 365 days: −5 percentage points stability and −5% factory output."
