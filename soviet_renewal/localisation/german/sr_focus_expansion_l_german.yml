l_german:
 sr_exp_1_t:0 "Die gestrichene Seite"
 sr_exp_1_d:0 "Die Redakteurin schiebt zwei Fassungen von Litos Erinnerungen über den Tisch. In der ersten beginnt alles mit einem entschlossenen Revolutionär, der seinen Weg nie bezweifelte. In der zweiten hat derselbe Mann Angst am Grenzbahnhof, streitet mit Genossen und versteht eine Werkversammlung zunächst falsch.\n\n'Diese Seite schwächt den Vorsitzenden', sagt der Parteisekretär. Die Redakteurin schüttelt den Kopf: 'Sie erklärt, warum er anderen zuhören musste.'\n\nLito erkennt seine eigene Handschrift unter der gestrichenen Passage. Die neue Union wird mit dieser Geschichte aufwachsen. Soll sie einen unfehlbaren Gründer kennenlernen oder einen Menschen, der seine Überzeugungen erst in Auseinandersetzungen fand?"
 sr_exp_1_a:0 "Druckt auch meine Irrtümer. (25 politische Macht)"
 sr_exp_1_b:0 "Die Zweifel bleiben im Archiv; die Union braucht eine klare Erzählung."
 sr_exp_2_t:0 "Der leere Stuhl am Ende des Tisches"
 sr_exp_2_d:0 "Die Delegierten haben jedes Amt im Verfassungsentwurf beschrieben. Bei der Nachfolge des Vorsitzenden steht nur eine vorläufige Regel. Ein alter Genosse meint, darüber müsse man zu Litos Lebzeiten nicht sprechen.\n\n'Gerade jetzt müssen wir darüber sprechen', erwidert eine georgische Juristin. Sie möchte ein öffentlich geregeltes Verfahren mit garantierter Vertretung der Republiken. Die Parteizentrale bietet eine kürzere Lösung an: Ein enges Führungsgremium benennt künftig den Vorsitzenden und verhindert dadurch lange Auseinandersetzungen.\n\nLito blickt auf den unbesetzten Stuhl neben dem Protokollführer. Die Entscheidung bestimmt keinen Nachfolger für morgen. Sie bestimmt, ob die Union eines Tages ohne ihren Gründer verhandeln kann."
 sr_exp_2_a:0 "Das Verfahren gehört in den Vertrag. (50 politische Macht)"
 sr_exp_2_b:0 "Das Führungsgremium sichert den Übergang."
 sr_exp_3_t:0 "Die Reserve hat keinen Eröffnungstag"
 sr_exp_3_d:0 "Für das neue Werk sind bereits Einladungen gedruckt. Für zusätzliche Lagerhäuser gibt es nicht einmal eine Zeichnung in der Zeitung. Trotzdem legt die Versorgungsverwaltung Lito eine eindringliche Rechnung vor: Ein schlechter Winter würde Ersatzteile, Getreide und Treibstoff gleichzeitig verteuern.\n\nDie Direktoren möchten die Mittel sofort in laufende Produktion stecken. Die Reservekommission hält dagegen, dass gelagerte Güter keine unerfüllten Aufträge seien, sondern ein Versprechen für den Ernstfall.\n\nEin gemeinsamer Vorrat kostet heute Leistung und politische Kraft. Ein Produktionsschub ist schneller sichtbar, lässt aber weniger Spielraum, wenn die nächste Lieferung ausbleibt."
 sr_exp_3_a:0 "Auch ein unsichtbares Lager kann die Union tragen. (60 politische Macht)"
 sr_exp_3_b:0 "Die nächste Schicht hat Vorrang; wir müssen jetzt mehr herstellen."
 sr_exp_4_t:0 "Eine Schule außerhalb des Bauplans"
 sr_exp_4_d:0 "Die neue Montagehalle ist fertig. Wo geeigneter Bauplatz vorhanden war, hat die Union eine Zivilfabrik errichtet; andernfalls stehen 50 politische Macht für eine spätere Standortlösung bereit. Nun liegen zwei Pläne für die Siedlung daneben.\n\nDer Direktor braucht Schlafräume und einen Werkbus. Die Familien verlangen eine Schule, eine Krankenstation und einen Saal, in dem sie selbst über ihre Gemeinde beraten können. 'Wenn wir Menschen ansiedeln', fragt eine Arbeiterin, 'warum bauen wir dann nur für ihre Arbeitszeit?'\n\nEin vollständiges Gemeinwesen kostet zusätzliche Mittel und bindet ein Jahr lang Konsumgüter. Die reine Werkssiedlung liefert schneller. Beide werden bleiben, lange nachdem die Eröffnungsrede verklungen ist."
 sr_exp_4_a:0 "Wir bauen für Bürger, nicht nur für Schichten. (75 politische Macht)"
 sr_exp_4_b:0 "Zuerst muss die Produktion den Aufbau finanzieren."
 sr_exp_5_t:0 "Ein Eid und eine Beschwerde"
 sr_exp_5_d:0 "Der erste neue Soldateneid ist kaum verlesen, als der Rechtsdienst eine Beschwerde eines Rekruten erhält. Sein Kommandeur habe eine Eingabe an den Republikrat als Disziplinbruch gewertet.\n\nDer Generalstab beharrt auf einer geschlossenen militärischen Zuständigkeit. Eine zivile Beschwerdestelle, warnt er, werde jeden strittigen Befehl zu einer politischen Verhandlung machen. Vertreter der Räte halten dagegen: Wer seine Rechte an der Kasernentür abgebe, könne schwerlich auf die Rechte der Union schwören.\n\nLito muss festlegen, welche Aufsicht der neuen Armee zumutbar ist. Die Waffen sollen den Vertrag verteidigen. Die Frage ist, ob der Vertrag auch innerhalb der Kaserne gilt."
 sr_exp_5_a:0 "Eine zivile Beschwerdestelle schützt den Eid. (40 politische Macht)"
 sr_exp_5_b:0 "Militärische Verfahren bleiben innerhalb der Kommandokette."
 sr_exp_6_t:0 "Zwei Briefe über dieselbe Lieferung"
 sr_exp_6_d:0 "Im ersten Brief bittet eine Einheit um neue Ausrüstung und zusammenhängende Übungszeit. Der zweite stammt aus der Familie eines ihrer Soldaten. Sie trägt zusätzliche Schichten, während der versprochene Heimaturlaub erneut verschoben wurde.\n\nDer Heeresstab möchte die laufende Bereitschaftsplanung nicht unterbrechen. Der Gewerkschaftsvertreter schlägt Familienhilfe und verlässliche Freistellungszeiten vor; die fehlenden Arbeitsstunden würden vorübergehend die Produktion mindern, aber die Truppe entlasten.\n\nLito legt beide Briefe nebeneinander. Keiner widerlegt den anderen. Seine Militärpolitik entscheidet sich daran, welche Belastung er sichtbar macht und welche er als selbstverständlich hinnimmt."
 sr_exp_6_a:0 "Die Familien tragen mit; wir tragen einen Teil ihrer Last. (45 politische Macht)"
 sr_exp_6_b:0 "Bereitschaft hat vorerst Vorrang vor Entlastung."
 sr_exp_honest_biography:0 "Eine ungekürzte Gründungsgeschichte"
 sr_exp_honest_biography_desc:0 "Die öffentliche Auseinandersetzung bindet politische Kraft und stärkt die Glaubwürdigkeit: täglich −0,05 politische Macht und +2 Prozentpunkte Stabilität für 180 Tage."
 sr_exp_constitutional_succession:0 "Ein geregelter föderaler Übergang"
 sr_exp_constitutional_succession_desc:0 "Ein bindendes Nachfolgeverfahren gibt für 730 Tage +3 Prozentpunkte Stabilität, kostet aber täglich 0,05 politische Macht."
 sr_exp_party_continuity:0 "Kontinuität durch das Führungsgremium"
 sr_exp_party_continuity_desc:0 "Eine eng geführte Nachfolgeregel erleichtert Entscheidungen: täglich +0,10 politische Macht und −2 Prozentpunkte Stabilität für 730 Tage."
 sr_exp_common_reserve:0 "Die Reserve der gemeinsamen Union"
 sr_exp_common_reserve_desc:0 "Vorräte geben Sicherheit, fehlen jedoch in der laufenden Produktion: +3 Prozentpunkte Stabilität, −2 % Nachschubverbrauch und −2 % Fabrikausstoß für 365 Tage."
 sr_exp_output_drive:0 "Heute mehr ausliefern"
 sr_exp_output_drive_desc:0 "Sofortige Produktionsaufträge haben Vorrang vor Reserven: +4 % Fabrikausstoß und −2 Prozentpunkte Stabilität für 365 Tage."
 sr_exp_workers_town:0 "Eine Siedlung wird zur Gemeinde"
 sr_exp_workers_town_desc:0 "Schule, Krankenstation und Gemeindeverwaltung schaffen Vertrauen, binden aber Konsumgüter: +3 Prozentpunkte Stabilität und +2 Prozentpunkte Konsumgüterfaktor für 365 Tage."
 sr_exp_factory_settlement:0 "Die Siedlung folgt dem Werk"
 sr_exp_factory_settlement_desc:0 "Der Aufbau dient vorerst der Produktion: +5 % Fabrikausstoß und −2 Prozentpunkte Stabilität für 180 Tage."
 sr_exp_military_ombudsmen:0 "Zivile Aufsicht in der Kaserne"
 sr_exp_military_ombudsmen_desc:0 "Vertrauenswürdige Beschwerdeverfahren stärken den Zusammenhalt und verlängern Abstimmungen: +2 % Heeresorganisation und −2 % Planungsgeschwindigkeit für 730 Tage."
 sr_exp_military_jurisdiction:0 "Geschlossene militärische Zuständigkeit"
 sr_exp_military_jurisdiction_desc:0 "Eine straffere Kommandokette beschleunigt Planung, beschädigt aber das Bürgerrechtsversprechen: +4 % Planungsgeschwindigkeit und −2 Prozentpunkte Stabilität für 365 Tage."
 sr_exp_front_family_support:0 "Ein Vertrag zwischen Front und Heimat"
 sr_exp_front_family_support_desc:0 "Entlastete Familien stärken die Moral; Freistellungen mindern die Produktion: +4 % Heeresmoral und −2 % Fabrikausstoß für 365 Tage."
 sr_exp_readiness_priority:0 "Bereitschaft vor Entlastung"
 sr_exp_readiness_priority_desc:0 "Zusätzliche Aufträge erhöhen die Leistung und verlängern die Belastung: +3 % Fabrikausstoß und −2 % Heeresmoral für 365 Tage."
