l_german:
 sr_government_program:0 "Litos Regierungsprogramm"
 sr_government_program_desc:0 "Nach den ersten hundert Tagen müssen aus Beschlüssen Einrichtungen werden. Es kann immer nur ein Vorhaben gleichzeitig finanziert werden. Jedes Vorhaben kann einmal begonnen werden; ein Fehlschlag erstattet das Startbudget nicht. Nach 90 Tagen folgt eine Zwischenentscheidung. Der Abschluss verlangt das dort beschlossene Konzept und die angegebenen Schwerpunkte.\n\nVertrauen in Litos Regierung: [?sr_story_trust|0]/100."
 sr_project_start_workshops:0 "Vorhaben: Die Werkstätten miteinander verbinden"
 sr_project_start_workshops_desc:0 "Startet ein 240-Tage-Vorhaben nach der Einrichtung der Arbeiterräte und ihrer ersten Richtungsentscheidung. Start: 75 politische Macht; Abschluss: weitere 25. Während der Arbeit: −2 % Fabrikausstoß. Nach 90 Tagen entscheiden wir zwischen örtlicher Mitsprache und einheitlichen Direktionsstandards. Für den Abschluss muss außerdem §YWerkstätten der Republiken§! abgeschlossen sein. Es kann nur ein Regierungsprojekt gleichzeitig laufen."
 sr_project_finish_workshops:0 "Werkstattnetz: Den Betriebsvertrag abschließen"
 sr_project_finish_workshops_desc:0 "Nach der Zwischenentscheidung und dem Schwerpunkt §YWerkstätten der Republiken§! kann der gemeinsame Betriebsvertrag für 25 politische Macht abgeschlossen werden. Mitsprache gibt für 365 Tage +3 % Fabrikausstoß und +10 Vertrauen; Direktionsstandards geben +4 % Fabrikausstoß, −1 Prozentpunkt Stabilität und +4 Vertrauen. Hatten wir den Räten zuvor das letzte Wort versprochen, kostet ein Direktionsabschluss zusätzlich 7 Vertrauen. Der Budgetmalus endet. Fristversäumnis: −8 Vertrauen, −0,03 Unionsbalance und 180 Tage −2 Prozentpunkte Stabilität."
 sr_project_start_education:0 "Vorhaben: Lernen nach der Schicht"
 sr_project_start_education_desc:0 "Startet nach der Vernetzung der Akademien ein 270-Tage-Volksbildungsprogramm. Start: 60 politische Macht; Abschluss: weitere 40. Abgestellte Lehrkräfte kosten während des Vorhabens 1 % Forschungsgeschwindigkeit. Nach 90 Tagen wählen wir offene Abendkurse oder technische Kaderschulung. Für den Abschluss muss außerdem §YTechnische Bildung verbreiten§! abgeschlossen sein. Es kann nur ein Regierungsprojekt gleichzeitig laufen."
 sr_project_finish_education:0 "Volksbildung: Das erste Lehrjahr eröffnen"
 sr_project_finish_education_desc:0 "Nach der Zwischenentscheidung und §YTechnische Bildung verbreiten§! kostet die Eröffnung 40 politische Macht. Offene Kurse geben 365 Tage +2 % Forschungsgeschwindigkeit und +8 Vertrauen. Technische Kaderschulung gibt 365 Tage +1 % Forschungsgeschwindigkeit, −3 % Heeresausbildungszeit und +3 Vertrauen. Der Lehrkräftemalus endet. Fristversäumnis: −8 Vertrauen, −0,03 Unionsbalance und 180 Tage −2 Prozentpunkte Stabilität."
 sr_project_start_supply:0 "Vorhaben: Ein Fahrplan für die ganze Union"
 sr_project_start_supply_desc:0 "Startet ein 240-Tage-Verkehrsprogramm, sobald §YVersorgung bis zur Front§! oder §YVersorgungswege der Union§! abgeschlossen ist. Start: 60 politische Macht; Abschluss: weitere 40. Die Umstellung kostet währenddessen 2 % Baugeschwindigkeit. Nach 90 Tagen entscheiden wir über zivile Fahrplanrechte oder militärische Vorrangzüge. Der Abschluss verlangt beide genannten Schwerpunkte. Es kann nur ein Regierungsprojekt gleichzeitig laufen."
 sr_project_finish_supply:0 "Unionsfahrplan: Die Verbindungen in Betrieb nehmen"
 sr_project_finish_supply_desc:0 "Nach der Zwischenentscheidung und den Schwerpunkten §YVersorgung bis zur Front§! sowie §YVersorgungswege der Union§! kostet der Abschluss 40 politische Macht. Zivile Fahrplanrechte geben für 365 Tage +3 % Baugeschwindigkeit, −2 % Nachschubverbrauch und +8 Vertrauen. Militärischer Vorrang gibt 365 Tage −4 % Nachschubverbrauch, −1 % Baugeschwindigkeit und +3 Vertrauen. Der Umstellungsmalus endet. Fristversäumnis: −8 Vertrauen, −0,03 Unionsbalance und 180 Tage −2 Prozentpunkte Stabilität."
 sr_projects_1_title:0 "Die erste Unterschrift gilt nicht als Ergebnis"
 sr_projects_1_councils_desc:0 "Die Vertreter der Werkstätten bringen Lito keine neue Losung mit. Sie legen Protokolle auf den Tisch. Seit der Rat das letzte Wort erhalten hat, werden in jedem Betrieb andere Ersatzteile bestellt und andere Erfahrungen gesammelt. Eine gute Lösung bleibt oft in derselben Halle, in der sie entstand.\n\nLito will das ändern, ohne die Räte in bloße Außenstellen einer Zentrale zu verwandeln. Das bereitgestellte Budget bezahlt reisende Fachkräfte und gemeinsame Unterlagen. In neunzig Tagen berichten die ersten Werkstätten. Bis zum Ablauf des Vorhabens müssen die Werkstätten der Republiken auch tatsächlich aufgebaut und der Betriebsvertrag beschlossen sein."
 sr_projects_1_directors_desc:0 "Die Direktoren sind an einheitliche Zahlen gewöhnt. Nun sollen sie erklären, warum zwei Betriebe dieselbe Maschine ganz unterschiedlich warten. Ihre Tabellen sind ordentlich; ihr Erfahrungsaustausch ist es nicht. Hinter den Direktoren warten die Belegschaftsvertreter auf eine Gelegenheit, selbst etwas vorzuschlagen.\n\nLito stellt ein Budget für Verbindungen zwischen den Werkstätten bereit. Ein Netz kann örtliche Lösungen verbreiten oder Direktionsanweisungen vereinheitlichen. Nach neunzig Tagen kommt diese Frage wieder auf den Tisch. Die nötigen Werkstätten und ein beschlossener Betriebsvertrag müssen innerhalb der Frist vorliegen."
 sr_projects_1_a:0 "Ich will beim nächsten Treffen Beispiele sehen, keine neuen Ordner."
 sr_project_workshops_plan_tt:0 "Der Countdown läuft seit Projektbeginn: 240 Tage. Nach 90 Tagen folgt die Richtungsentscheidung. Zum Abschluss sind der Schwerpunkt Werkstätten der Republiken und weitere 25 politische Macht nötig."
 sr_projects_2_title:0 "Eine Zeichnung wandert von Hand zu Hand"
 sr_projects_2_desc:0 "Auf dem Tisch liegt eine Reparaturzeichnung, die ein Schlosser in einer Nachtschicht verbessert hat. Drei andere Werke haben sie übernommen. Ein Direktor möchte daraus eine verbindliche Norm machen. Eine Delegierte widerspricht: Die Zeichnung sei gerade deshalb gut geworden, weil man eine vorhandene Vorschrift ändern durfte.\n\nDie erste gemeinsame Erfahrung stellt Lito vor eine alte Frage in neuer Form. Sollen gewählte Werkstattgruppen das Netz tragen, oder erhalten die Direktoren verbindliche Standards? Nach dieser Entscheidung bleibt noch Zeit, den Ausbau der Werkstätten abzuschließen."
 sr_projects_2_a:0 "Die Werkstätten wählen ihre Verbindungen selbst."
 sr_projects_2_b:0 "Ein gemeinsames Handbuch unter Verantwortung der Direktoren."
 sr_project_workshops_councils_tt:0 "Bei fristgerechtem Abschluss: 365 Tage +3 % Fabrikausstoß und +10 Vertrauen. Das Projekt verlangt weiterhin den Schwerpunkt Werkstätten der Republiken und 25 politische Macht."
 sr_project_workshops_standards_tt:0 "Bei fristgerechtem Abschluss: 365 Tage +4 % Fabrikausstoß, −1 Prozentpunkt Stabilität und +4 Vertrauen. Wenn wir früher den Räten das letzte Wort gegeben haben, kostet dieser Kurswechsel zusätzlich 7 Vertrauen."
 sr_projects_3_title:0 "Was aus dem Werkstattvertrag wurde"
 sr_projects_3_councils_desc:0 "Der Vertrag kommt mit handschriftlichen Ergänzungen zurück. Eine Werkstatt will ihre Delegierten jederzeit abberufen können; eine andere hat eine gute Ersatzteillösung zum gemeinsamen Standard vorgeschlagen. Die Delegierten haben nicht jedem Wunsch zugestimmt, aber sie mussten jeden beantworten.\n\nDer Ausbau ist abgeschlossen. Für ein Jahr trägt das Netz mehr Produktion und mehr Vertrauen. Lito legt die erste Zeichnung neben den unterschriebenen Vertrag. Die Veränderung ist klein genug, um sie genau zu erkennen: Eine örtliche Erfahrung braucht nun keine persönliche Einladung nach Moskau mehr."
 sr_projects_3_standards_desc:0 "Die neuen Handbücher liegen an den Arbeitsplätzen. Ersatzteile und Wartungsabläufe lassen sich leichter zwischen Betrieben verteilen. Die Produktion profitiert davon, doch die Direktoren müssen häufiger für Entscheidungen geradestehen, die anderswo getroffen wurden.\n\nDie Delegierten erinnern Lito daran, welchen Einfluss er den Räten zu Beginn eingeräumt hatte. Wo er das letzte Wort versprochen hatte, wird der neue Vertrag als Rücknahme gelesen. Die Werkstätten sind verbunden. Wem diese Verbindung politisch gehört, bleibt sichtbar umstritten."
 sr_projects_3_failed_desc:0 "Der Projektleiter bringt den angefangenen Betriebsvertrag mit. Es fehlen Verbindungen, Unterschriften oder die abschließende Finanzierung. Auf mehreren Seiten stehen inzwischen abgelaufene Termine.\n\nDie Umstellung wird beendet und bindet keine zusätzlichen Produktionsmittel mehr. Das bereits ausgegebene Startbudget ist jedoch verloren. In den Werkstätten hängt der angekündigte Eröffnungstermin noch am Brett. Lito lässt den Bericht veröffentlichen. Ein Vorhaben, das nichts fertigstellt, ist auch eine Entscheidung, an die man sich erinnert."
 sr_projects_3_a:0 "Der Bericht gehört zu unserer Bilanz."
 sr_projects_4_title:0 "Die Schule öffnet, wenn die Schicht endet"
 sr_projects_4_desc:0 "Die ersten Anmeldungen kommen auf abgegriffenen Zetteln. Eine Dreherin möchte technische Zeichnungen verstehen, ein Bahnarbeiter Mathematik nachholen. Der Akademievertreter verweist auf knappe Lehrkräfte: Wer am Abend unterrichtet, fehlt tagsüber im Institut.\n\nLito finanziert ein gemeinsames Volksbildungsprogramm. Damit es mehr als ein einzelner Kursraum wird, müssen Institute, Lehrmaterial und technische Bildung zusammenfinden. In neunzig Tagen entscheiden wir, wem die ersten Plätze gehören. Das vollständige Lehrjahr muss vor Ablauf der Frist eröffnet werden."
 sr_projects_4_a:0 "Ein Bildungsrecht braucht Lehrkräfte, Räume und Zeit."
 sr_project_education_plan_tt:0 "Der Countdown läuft seit Projektbeginn: 270 Tage. Nach 90 Tagen folgt die Wahl der Unterrichtsform. Zum Abschluss sind Technische Bildung verbreiten und weitere 40 politische Macht nötig."
 sr_projects_5_title:0 "Die letzte freie Schulbank"
 sr_projects_5_desc:0 "Die Anmeldeliste ist länger als die Reihe der neuen Bänke. Ein Ausbilder schlägt vor, die ersten Kurse auf Fachkräfte zu begrenzen, die Verwaltung und Streitkräfte sofort benötigen. Eine Lehrerin hat dagegen Bewerbungen von Menschen mitgebracht, die keinen Betrieb hinter ihrem Namen nennen können.\n\nDie Fachkurse versprechen rasch verwendbare Kenntnisse. Offene Abendkurse verbreiten Wissen langsamer, erreichen aber auch jene, die bei jeder bisherigen Auswahl zuletzt an der Reihe waren. Lito muss den Zugang festlegen, bevor der Ausbau in die entscheidende Phase geht."
 sr_projects_5_a:0 "Die offenen Kurse gehören zum Versprechen der Union."
 sr_projects_5_b:0 "Zuerst die Fachkräfte für Institute und Streitkräfte."
 sr_project_education_open_tt:0 "Bei fristgerechtem Abschluss: 365 Tage +2 % Forschungsgeschwindigkeit und +8 Vertrauen. Der Abschluss verlangt weiterhin Technische Bildung verbreiten und 40 politische Macht."
 sr_project_education_specialists_tt:0 "Bei fristgerechtem Abschluss: 365 Tage +1 % Forschungsgeschwindigkeit, −3 % Heeresausbildungszeit und +3 Vertrauen. Der Abschluss verlangt weiterhin Technische Bildung verbreiten und 40 politische Macht."
 sr_projects_6_title:0 "Das erste Zeugnis nach Feierabend"
 sr_projects_6_open_desc:0 "Am Ende der ersten Kurswoche bleibt eine Teilnehmerin noch einen Moment sitzen. Sie hat ihr Heft aufgeschlagen und prüft, ob ihr Name wirklich auf der Titelseite des Lehrbuchs stehen darf. Für die Akademie ist es eines von vielen Exemplaren. Für sie ist es der erste Unterricht, der nicht mit einer Auswahlprüfung begann.\n\nDas Lehrjahr ist eröffnet. Die abgestellten Lehrkräfte kehren in ein geordnetes Netz zurück, dessen Erfahrungen nun auch den Instituten nützen. Lito sieht in der Statistik mehr als eine zusätzliche Zeile: Menschen können an der gemeinsamen Entwicklung teilnehmen, ohne bereits zur vorgesehenen Gruppe zu gehören."
 sr_projects_6_specialists_desc:0 "Die ersten Kurse haben Fachkräfte in Betriebe, Institute und Ausbildungsstätten zurückgeschickt. Ihre Berichte sind knapp und verwendbar: weniger Missverständnisse bei Zeichnungen, schnellere Einweisung an Geräten, bessere technische Ausbildung.\n\nDas Programm ist abgeschlossen und sein Nutzen messbar. Auf der zweiten Anmeldeliste stehen weiterhin Namen, die keinen der gefragten Berufe besitzen. Lito legt beide Listen nebeneinander. Die Union hat Fachkräfte ausgebildet. Das allgemeinere Bildungsversprechen wartet auf eine andere Gelegenheit."
 sr_projects_6_failed_desc:0 "Im vorgesehenen Kursraum stehen Bänke, aber kein vollständiger Lehrplan liegt bereit. Die Beteiligten können einzeln erklären, was ihnen gefehlt hat. Zusammen ergeben die Berichte ein Programm, das seine Frist verpasst hat.\n\nDie zusätzliche Belastung der Institute endet. Das Startbudget kommt nicht zurück. Die Absage muss an Menschen verschickt werden, die bereits ihre Schichten getauscht hatten. Der politische Schaden steht in keiner Geräteliste, doch Lito kann ihn nicht übersehen."
 sr_projects_6_a:0 "Auch die nicht aufgenommenen Namen bleiben in der Akte."
 sr_projects_7_title:0 "Drei Fahrpläne für denselben Zug"
 sr_projects_7_desc:0 "Die Bahnverwaltungen nennen drei verschiedene Ankunftszeiten. Keine davon ist frei erfunden: Jede Behörde hat nur den Abschnitt gesehen, für den sie zuständig war. Am Übergabebahnhof warten zivile Güter und militärischer Nachschub auf dieselbe Rangiermannschaft.\n\nLito finanziert die Abstimmung zwischen Republiken, Betrieben und Heeresversorgung. Die Umstellung bindet zunächst Baukapazitäten. Nach neunzig Tagen muss eine Vorrangregel feststehen; vor Ablauf der Frist müssen zivile Versorgungswege und die Versorgung bis zur Front zusammenpassen."
 sr_projects_7_a:0 "Ein Zug darf an einer Verwaltungsgrenze nicht verschwinden."
 sr_project_supply_plan_tt:0 "Der Countdown läuft seit Projektbeginn: 240 Tage. Nach 90 Tagen folgt die Vorrangentscheidung. Zum Abschluss müssen Versorgung bis zur Front und Versorgungswege der Union abgeschlossen sein; weitere 40 politische Macht werden benötigt."
 sr_projects_8_title:0 "Wer bekommt das nächste Gleis?"
 sr_projects_8_desc:0 "Die ersten gemeinsamen Fahrpläne funktionieren, bis zwei dringende Anträge eintreffen. Eine Republik verlangt verlässliche zivile Lieferfenster. Der Generalstab fordert, militärische Transporte jederzeit vorziehen zu dürfen. Beide nennen denselben stillstehenden Zug als Beleg.\n\nVerbindliche zivile Fahrplanrechte schützen Wirtschaft und örtliche Zuständigkeit. Militärischer Vorrang senkt den Aufwand für die Heeresversorgung, macht die zivilen Verwaltungen aber abhängig von Ausnahmen. Lito muss eine Regel wählen, die die Beteiligten tatsächlich anwenden können."
 sr_projects_8_a:0 "Die Republiken erhalten verbindliche zivile Lieferfenster."
 sr_projects_8_b:0 "Der Generalstab bekommt Vorrang für die Versorgung."
 sr_project_supply_civil_tt:0 "Bei fristgerechtem Abschluss: 365 Tage +3 % Baugeschwindigkeit, −2 % Nachschubverbrauch und +8 Vertrauen."
 sr_project_supply_military_tt:0 "Bei fristgerechtem Abschluss: 365 Tage −4 % Nachschubverbrauch, −1 % Baugeschwindigkeit und +3 Vertrauen."
 sr_projects_9_title:0 "Der erste Zug kommt nach dem neuen Plan"
 sr_projects_9_civil_desc:0 "Die Ankunft wird nicht von einer Tribüne beobachtet. Eine Rangiermannschaft vergleicht die Wagenliste mit dem gemeinsamen Fahrplan und findet zum ersten Mal alle vorgesehenen Übergaben darin. Die militärischen Transporte haben feste Fenster; die zivilen Lieferungen müssen nicht mehr nach jeder Ausnahme neu verhandelt werden.\n\nDas Netz ist abgestimmt. Für ein Jahr erleichtert es Aufbau und Versorgung. Der Erfolg besteht nicht darin, dass niemand mehr streitet. Die Beteiligten wissen jetzt, an welcher gemeinsamen Regel sie ihren Streit prüfen können."
 sr_projects_9_military_desc:0 "Der Generalstab meldet kürzere Verzögerungen. Die Versorgung kann Transporte verbindlicher einplanen, weil militärische Vorränge nicht mehr an jeder Übergabe neu erklärt werden müssen. Die zivilen Verwaltungen führen genau Buch über die verschobenen Lieferfenster.\n\nDas Programm ist abgeschlossen. Die Heeresversorgung profitiert stärker als beim zivilen Modell; im Aufbau bleiben zusätzliche Umplanungen spürbar. Lito erhält die beiden Berichte in derselben Mappe. Keiner von beiden widerlegt den anderen."
 sr_projects_9_failed_desc:0 "Die gemeinsame Fahrplantafel bleibt im Entwurf. An einigen Übergaben gelten neue Regeln, an anderen die alten. Für die Beteiligten ist die unvollständige Umstellung schwerer zu erklären als ein klarer Beschluss.\n\nDie zusätzliche Bauverlangsamung endet mit dem Vorhaben. Das Startbudget ist verbraucht. Die Heeresversorgung und die Republiken müssen ihre Ausnahmen weiter einzeln aushandeln. Lito hat eine Verbindung angekündigt, auf die sich noch niemand verlassen kann."
 sr_projects_9_a:0 "Die Verbindungen werden an ihrer Benutzung gemessen."
 sr_project_workshop_budget:0 "Fachkräfte für das Werkstattnetz"
 sr_project_workshop_budget_desc:0 "Abgestellte Fachkräfte und Umstellungen kosten während des Projekts 2 % Fabrikausstoß. Der Malus endet bei Abschluss, Fristversäumnis oder Abbruch."
 sr_project_teacher_release:0 "Lehrkräfte für die Abendkurse"
 sr_project_teacher_release_desc:0 "Institute stellen Lehrkräfte ab. Während des Projekts: −1 % Forschungsgeschwindigkeit. Der Malus endet bei Abschluss, Fristversäumnis oder Abbruch."
 sr_project_transport_budget:0 "Die Fahrpläne werden umgestellt"
 sr_project_transport_budget_desc:0 "Die Abstimmung bindet während des Projekts Baukapazität: −2 % Baugeschwindigkeit. Der Malus endet bei Abschluss, Fristversäumnis oder Abbruch."
 sr_project_practical_councils:0 "Das Wissen der Werkstätten"
 sr_project_practical_councils_desc:0 "Ein von den Werkstätten getragenes Netz verbreitet örtliche Erfahrungen: +3 % Fabrikausstoß für 365 Tage."
 sr_project_standardized_workshops:0 "Einheitliche Direktionsstandards"
 sr_project_standardized_workshops_desc:0 "Einheitliche Abläufe verbessern die Produktion, beschränken aber örtliche Mitsprache: +4 % Fabrikausstoß und −1 Prozentpunkt Stabilität für 365 Tage."
 sr_project_public_learning:0 "Das offene Lehrjahr"
 sr_project_public_learning_desc:0 "Offene Abendkurse und gemeinsame Lehrmaterialien verbreiten Wissen: +2 % Forschungsgeschwindigkeit für 365 Tage."
 sr_project_technical_cadres:0 "Ausgebildete technische Kader"
 sr_project_technical_cadres_desc:0 "Gezielte Fachkurse unterstützen Institute und Streitkräfte: +1 % Forschungsgeschwindigkeit und −3 % Heeresausbildungszeit für 365 Tage."
 sr_project_republic_timetables:0 "Verbindliche Fahrplanrechte"
 sr_project_republic_timetables_desc:0 "Zivile Lieferfenster erleichtern den Aufbau und stimmen Transporte ab: +3 % Baugeschwindigkeit und −2 % Nachschubverbrauch für 365 Tage."
 sr_project_military_dispatch:0 "Vorrang für den Nachschub"
 sr_project_military_dispatch_desc:0 "Militärische Transporte werden bevorzugt: −4 % Nachschubverbrauch, aber −1 % Baugeschwindigkeit für 365 Tage."
 sr_project_unfinished_program:0 "Ein angekündigtes Vorhaben bleibt offen"
 sr_project_unfinished_program_desc:0 "Eine verstrichene Regierungszusage kostet für 180 Tage 2 Prozentpunkte Stabilität."
