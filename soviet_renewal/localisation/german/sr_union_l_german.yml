 sr_union_mass_strikes:0 "Massenstreiks in der Union"
 sr_union_mass_strikes_desc:0 "Mindestens eine vertretene Republik hat 50 oder mehr Widerstandspunkte. Streiks bremsen Produktion und Bau und schwächen die Stabilität. Die Auswirkungen enden, sobald alle vertretenen Republiken unter 50 liegen."
 sr_union_sabotage_networks:0 "Regionale Sabotagenetzwerke"
 sr_union_sabotage_networks_desc:0 "Mindestens eine vertretene Republik hat 80 oder mehr Widerstandspunkte. Sabotagen behindern Nachschub und industrielle Abläufe. Zusätzlich wird monatlich ein Infrastrukturlevel in einem eigenen kontrollierten Gebiet jeder betroffenen Republik beschädigt. Die Netzwerke verlieren ihren Einfluss, sobald alle vertretenen Republiken unter 80 liegen."
