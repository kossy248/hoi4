l_english:
 sr_story_government:0 "Lito’s Government Diary"
 sr_story_government_desc:0 "§YTrust in Lito’s government: [?sr_story_trust|0]/100§!\n\nLito promises a union whose people can speak for themselves. The first hundred days reveal what that promise means. Party officials, factories and republics remember the commitments made to them.\n\nAccepted petitions become missions with visible deadlines. An honest refusal disappoints; a broken promise does greater harm."
 sr_story_trust:0 "Trust in Lito’s Government"
 sr_story_ukraine_promise:0 "Honour the Ukrainian Reconstruction Pledge"
 sr_story_ukraine_promise_desc:0 "The delegation awaits the signed reconstruction contract. Within 180 days, spend 65 political power and find a controlled Ukrainian core with room for a civilian factory. Build one factory there. Its accompanying relief program raises the consumer goods factor by 3 percentage points for 180 days.\n\nFulfilment: +12 trust, −20 Ukrainian resistance, +0.04 Union balance. Failure: −15 trust, +25 Ukrainian resistance, −0.06 Union balance. The deadline begins with the promise."
 sr_story_georgia_promise:0 "Enact the Georgian Language Statute"
 sr_story_georgia_promise_desc:0 "Tbilisi requests binding language rights in administration and education. Within 150 days, spend 65 political power to enact the statute. Permanently gain 2 percentage points of stability at the cost of 0.05 daily political power for federal coordination.\n\nFulfilment: +12 trust, −20 Georgian resistance, +0.04 Union balance. Failure: −15 trust, +25 Georgian resistance, −0.06 Union balance."
 sr_story_kazakhstan_promise:0 "Fulfil the Kazakh Supply Contract"
 sr_story_kazakhstan_promise_desc:0 "Alma-Ata requests an actual connection to the Union’s supply routes. Within 210 days, spend 90 political power and build one infrastructure level in a controlled Kazakh core with room. The material commitment reduces factory output by 3% for 210 days.\n\nFulfilment: +15 trust, −20 Kazakh resistance, +0.04 Union balance. Failure: −15 trust, +25 Kazakh resistance, −0.06 Union balance."
 sr_story_rebuild_confidence:0 "Seek a New Vote of Confidence"
 sr_story_rebuild_confidence_desc:0 "The first hundred days damaged our government. Recover at least 55 trust through fulfilled promises or public accountability, then spend 70 political power to seek a new mandate. Remove the government crisis and gain 0.05 Union balance."
 sr_story_public_accountability:0 "Report Publicly on the Government’s Work"
 sr_story_public_accountability_desc:0 "Lito answers questions from factories and republics. Spend 45 political power to gain 6 trust. Review committees operate for 90 days: +2 percentage points of stability, −0.05 daily political power. Available again after 120 days. A hearing does not fulfil an outstanding republic pledge."
 sr_story_ukraine_promise_tt:0 "Start a §Y180-day mission§!. Fulfilment costs 65 political power and temporarily commits consumer goods capacity. Breaking the promise loses more trust than refusing it now."
 sr_story_georgia_promise_tt:0 "Start a §Y150-day mission§!. Fulfilment costs 65 political power and commits the government to permanent federal coordination."
 sr_story_kazakhstan_promise_tt:0 "Start a §Y210-day mission§!. Fulfilment costs 90 political power and temporarily commits industrial production."
 sr_story_confidence_recovery_tt:0 "Unlock §YSeek a New Vote of Confidence§!. A new mandate requires at least 55 trust and 70 political power."
 sr_story_open_deliberation:0 "Open Doors"
 sr_story_open_deliberation_desc:0 "Lito permits public deliberation. Participation builds trust and stability but extends the preparation of Union construction projects."
 sr_story_central_administration:0 "Orders from the Centre"
 sr_story_central_administration_desc:0 "A disciplined administration acts quickly. The republics suspect that Lito has changed the signature rather than the government’s methods."
 sr_story_untouched_privileges:0 "The Old Key Holders"
 sr_story_untouched_privileges_desc:0 "Lito has protected senior party officials’ privileges. They support him while sheltering expensive patronage networks. The focus “Review the Privileges” ends this arrangement."
 sr_story_emergency_secretariat:0 "Lito’s Special Secretariat"
 sr_story_emergency_secretariat_desc:0 "A personal secretariat can veto council decisions. It helps direct policy but damages belief in binding participation."
 sr_story_compromise_committees:0 "Committees before Shortcuts"
 sr_story_compromise_committees_desc:0 "Joint committees review objections from councils, party officials and republics. They build confidence but demand continuing political work."
 sr_story_government_in_crisis:0 "A Government under Fire"
 sr_story_government_in_crisis_desc:0 "After one hundred days, too many delegates doubt Lito’s word. Recovered trust and a new confidence vote are needed to end the crisis."
 sr_story_relief_budget:0 "The Ukrainian Reconstruction Budget"
 sr_story_relief_budget_desc:0 "Housing, food and civilian supplies accompany the new factory. Delivering them temporarily commits additional consumer goods capacity."
 sr_story_cultural_autonomy:0 "The Georgian Language Statute"
 sr_story_cultural_autonomy_desc:0 "Promised language rights are now binding. Translation and federal coordination cost continuing political work while strengthening stability."
 sr_story_eastern_investment:0 "Materials for the Eastern Supply Routes"
 sr_story_eastern_investment_desc:0 "Construction crews and machinery implement the Kazakh supply contract. Union factory output is temporarily reduced."
 sr_story_mediation:0 "Lito at the Negotiating Table"
 sr_story_mediation_desc:0 "Mediating the strikes commits political resources and delays new construction. Delegates gain a credible route back into shared institutions."
 sr_story_security_campaign:0 "Order under Guard"
 sr_story_security_campaign_desc:0 "Security forces suppress open protest. The government gains room to act, but visible coercion costs stability and trust."
 sr_domestic.1.t:0 "The First Signature"
 sr_domestic.1.d:0 "Two drafts of the inaugural address lie on Lito’s desk. In one, the party speaks for the people. In the other, the people may also disagree with the party.\n\nThe Moscow press waits outside. In the republics, people await something else: can a man with Yugoslav roots promise an equal union while deciding alone what equality means?\n\nLito lowers his pen. A one-off transition budget of 40 political power is available. The first hundred days will put his promise to the test."
 sr_domestic.1.a:0 "I will visit the councils before speaking for them."
 sr_domestic.1.b:0 "First, the centre must be able to act again."
 sr_domestic.1.c:0 "The party leads; the republics must sit at the table."
 sr_domestic.2.t:0 "The Keys to the Administration"
 sr_domestic.2.d:0 "The records are orderly, the official cars punctual and the special rations complete. That is precisely what makes the inspectors’ report uncomfortable. For senior officials, little has changed with the new government.\n\nA delegate asks why a factory director owes more accountability to party headquarters than to the people in the factory. The committee warns that a public investigation would turn experienced officials against Lito.\n\nThe question has been asked. Lito cannot both answer it and make it disappear."
 sr_domestic.2.a:0 "Make the investigation public. No one receives a blank cheque."
 sr_domestic.2.b:0 "We need these men. Their privileges remain for now."
 sr_domestic.2.c:0 "Give our joint committee the files and a mandate."
 sr_domestic.3.t:0 "Who May Disagree with Lito?"
 sr_domestic.3.d:0 "The first major production conference does not end in applause. A council rejects an allocation from Moscow; a party secretary declares the council’s decision non-binding. Both cite Lito’s inaugural address.\n\nThe legal commission proposes three answers: binding rights of appeal, a personal executive veto, or permanent mediation. Every answer takes power away from someone.\n\nLito recognises an old revolutionary question: is participation still a right when it obstructs his own plans?"
 sr_domestic.3.a:0 "The rights of appeal bind my government too."
 sr_domestic.3.b:0 "My secretariat will have the final word."
 sr_domestic.3.c:0 "A joint committee must settle the dispute."
 sr_domestic.4.t:0 "One Hundred Days Later"
 sr_domestic.4.d_high:0 "No silent delegation waits outside Lito’s office today. Several republics have sent practical proposals; delegates argue over them because they expect their voices to matter.\n\nNot every conflict has been resolved. But the past hundred days have created enough trust to carry Lito’s program beyond a personal speech. The report’s final page records a short judgement: “The government accepts procedures that may also be used against it.”"
 sr_domestic.4.d_middle:0 "The hundred-day report is neither an indictment nor a vote of confidence. Some delegates see a mediator in Lito; others see a man who postpones every contradiction until the next meeting.\n\nThe Union awaits verifiable results. Talks will continue, but every new promise will be written down more carefully. The revolution sounds different. Whether it follows different rules remains disputed."
 sr_domestic.4.d_low:0 "The delegates have requested another reading of Lito’s first address. Afterwards the hall falls silent. It promised binding participation; many still encounter special privileges and personal orders.\n\nA factory representative asks carefully: “We are told to trust. On what experience should that trust rest?” The first hundred days end in a government crisis. Lito can regain confidence, but another speech will not suffice."
 sr_domestic.4.a:0 "We must keep earning this mandate."
 sr_domestic.4.b:0 "Then let our next decisions be verifiable."
 sr_domestic.4.c:0 "We must regain trust before demanding it."
 sr_domestic.11.t:0 "The Ukrainian Delegates Bring a Bill"
 sr_domestic.11.d:0 "The Ukrainian delegation arrives with delivery lists and worn tools. It requests a civilian reconstruction factory and supplies for its workers, rather than another declaration of fraternity.\n\n“If the republic merely delivers levies and awaits the next plan, what does participation mean?” Lito may sign a binding 180-day reconstruction contract. The specialists name its price: political resources and a temporarily larger consumer goods commitment. An honest refusal would disappoint. An unfulfilled signature would be harder to forget."
 sr_domestic.11.a:0 "Write down the deadline. Judge the government by it."
 sr_domestic.11.b:0 "I cannot make that binding commitment now."
 sr_domestic.12.t:0 "Tbilisi Asks for More than a Translation"
 sr_domestic.12.d:0 "The Georgian delegates have read the new Union proposals carefully. Now they ask what language a worker may use to challenge an administrative decision, and who will actually understand the complaint.\n\nThey propose binding language rights in administration and education. The centre would have to fund translation and coordination permanently. Within 150 days, Lito could turn a general promise into an enforceable procedure. Otherwise he must explain why federal participation stops at an office door."
 sr_domestic.12.a:0 "Understanding one another belongs to our shared order."
 sr_domestic.12.b:0 "We cannot sustain a separate statute at present."
 sr_domestic.13.t:0 "A Long Road from Alma-Ata"
 sr_domestic.13.d:0 "The Kazakh delegation has spent days travelling. Its speaker spreads a timetable across the desk: missed deliveries, diverted machinery, places connected on every Union map but barely reachable in daily life.\n\nA contract for an actual infrastructure connection lies before Lito. It requires 210 days, political resources and materials that will be unavailable elsewhere. The delegation does not demand instant equality of living conditions. It asks for a promise whose deadline also binds Moscow."
 sr_domestic.13.a:0 "Supply is a shared obligation."
 sr_domestic.13.b:0 "I will not promise construction without its resources."
 sr_domestic.14.t:0 "A Factory and a Kept Promise"
 sr_domestic.14.d:0 "The first shift reports to the new Ukrainian reconstruction factory. The delegation’s telegram lists machinery, housing and supplies in restrained figures. A handwritten line follows: “The deadline was met.”\n\nRelief costs will remain noticeable for a while. But Lito’s signature now corresponds to real factory gates. The commitment has already been fulfilled, improving trust and Union cohesion."
 sr_domestic.14.a:0 "Send our thanks. And keep the deliveries coming."
 sr_domestic.15.t:0 "The Statute in the Official Gazette"
 sr_domestic.15.d:0 "The Georgian language statute has been published. Next morning, an appeal written in Georgian reaches a government office. No one yet knows whether it will succeed. It must now receive proper consideration.\n\nA brief letter arrives from Tbilisi: “We asked for a procedure, not kind words.” Coordination will cost continuing political effort. The promise has been kept."
 sr_domestic.15.a:0 "A right must apply in everyday life."
 sr_domestic.16.t:0 "A Connection Missing from the Map"
 sr_domestic.16.d:0 "Construction crews report the agreed expansion of Kazakh supply routes. The work will draw materials away from other plans for several more months. Meanwhile, a delivery reaches its destination instead of becoming another complaint.\n\nThe Alma-Ata delegation asks for local workers’ names to appear in the final report. Lito removes headquarters’ prepared self-congratulation and attaches the list. The contract has been fulfilled."
 sr_domestic.16.a:0 "Then those names belong in the report."
 sr_domestic.17.t:0 "The Deadline on the Ukrainian Contract"
 sr_domestic.17.d:0 "The agreed 180 days have passed. The Ukrainian delegates place the same contract on the table again. Lito’s signature remains on the paper; the factory is absent from the promised site.\n\n“We would have understood an honest refusal,” their speaker explains. “What should we rely on next time?” The loss of trust and increase in Ukrainian resistance have already taken effect. It will take work to change this experience."
 sr_domestic.17.a:0 "Our signature promised more than we delivered."
 sr_domestic.18.t:0 "A Right Still in Draft"
 sr_domestic.18.d:0 "After 150 days, the Georgian language statute remains a draft. Offices cite missing funding; committees await further resolutions. Tbilisi now debates whether Moscow’s promises are binding at all.\n\nThe protest letter says the republic requested no exceptional status, only the participation it had been promised. Reduced trust and increased Georgian resistance have already taken effect."
 sr_domestic.18.a:0 "Another translation cannot solve this."
 sr_domestic.19.t:0 "The Timetable Remains Unchanged"
 sr_domestic.19.d:0 "A telegram arrives from Alma-Ata without a greeting. The agreed construction was not delivered within 210 days. Beside it lie copies of supply requests passed between responsible offices.\n\nThe distance between the centre and the republic can again be measured in missed deliveries. Increased Kazakh resistance and reduced trust have already taken effect. The delegates will judge what actually follows the broken promise."
 sr_domestic.19.a:0 "We disappointed more than a timetable."
 sr_domestic.20.t:0 "The Night Shift Stays Outside"
 sr_domestic.20.d:0 "Reports from the republics form a common picture: workers do not begin their shifts, deliveries stand idle, local officials await orders no one wishes to sign. The Union crisis has reached the factories.\n\nA mediator asks Lito to attend negotiations personally. The security administration promises a quicker return to work. Both approaches carry a price. Looking away protects today’s budget while worsening tomorrow’s crisis.\n\nThis is a single political turning point. The underlying resistance networks will still require attention afterwards."
 sr_domestic.20.a:0 "I will negotiate. A credible agreement may cost us."
 sr_domestic.20.b:0 "Open the gates and resume production."
 sr_domestic.20.c:0 "Local authorities must handle this themselves."
 sr_domestic.21.t:0 "The Old Keys Are Handed Over"
 sr_domestic.21.d:0 "The review of privileges has reached the special rights Lito initially left intact. Some officials leave their posts; others submit accountable expenditure records for the first time.\n\nThe old patronage network no longer burdens factory output; its national spirit has already been removed. Delegates note that an earlier concession has now genuinely been corrected."
 sr_domestic.21.a:0 "Earlier decisions may be reviewed too."
 sr_domestic.22.t:0 "A Mandate after the Crisis"
 sr_domestic.22.d:0 "The new confidence vote has been counted. This time delegates judge a series of verifiable actions rather than an unwritten government program. The government crisis has ended.\n\nLito remains in the hall after the meeting. Handwritten objections still lie on several seats. He has them gathered for the next government papers. A new mandate is no blank cheque."
 sr_domestic.22.a:0 "Then begin with the objections we left unanswered."
