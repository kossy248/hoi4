l_german:
 sr_balkan_federation:0 "Litos Balkanpolitik"
 sr_balkan_federation_desc:0 "Nach den länderspezifischen Einflussschwerpunkten können wir sozialistische Bewegungen fördern. Ab 60 % kommunistischer Unterstützung ist eine sozialistische Regierungsbildung möglich. Sind Jugoslawien, Albanien, Bulgarien, Griechenland und Rumänien kommunistisch, friedlich und unabhängig oder unsere Untertanen, können sie sich zu einer gemeinsamen Föderation unter unserer Schutzherrschaft vereinen. Menschliche Spieler und fremde Untertanen sind ausgeschlossen."
 sr_balkan_form_federation:0 "Die sozialistische Balkanföderation gründen"
 sr_balkan_form_federation_desc:0 "Für 100 politische Macht vereinigen sich die fünf Länder zu einem einzigen sowjetischen Marionettenstaat. Jugoslawien bildet den rechtlichen Kern und übernimmt die Gebiete und Truppen der anderen vier Länder. Der Föderale Volksrat führt die neue Föderation; Lito bleibt in Moskau. Nur eigene Gebiete mit einem Kern eines der fünf Gründungsstaaten erhalten zusätzlich einen jugoslawischen Kern. Mitglieder fremder Fraktionen treten vor der Vereinigung friedlich aus; Fraktionsführer können nicht teilnehmen. Es werden keine Gebiete fremder Länder übertragen."
 sr_balkan_integrate_federation:0 "Die Balkanföderation in die Union integrieren"
 sr_balkan_integrate_federation_desc:0 "Die Föderation bleibt zunächst unser eigenständiger Marionettenstaat. Wenn wir alle Kerngebiete Polens und der Türkei direkt besitzen und kontrollieren, können wir sie für 150 politische Macht in die Sowjetunion integrieren. Ihr Gebiet und ihre Truppen gehen an uns über. Die Ausrufung der Sozialistischen Föderalen Slawischen Union bleibt eine gesonderte Entscheidung mit eigenen Voraussetzungen."
 sr_balkan_designated_subject_ready_tt:0 "Die bezeichnete Balkanföderation existiert, wird von der KI geführt, gehört zu unseren Untertanen befindet sich im Frieden und führt keine Fraktion an."
 YUG_sr_balkan_federal_council:0 "Föderaler Volksrat"
 YUG_sr_balkan_federal_council_desc:0 "Ein gemeinsamer Rat vertritt die fünf Gründungsrepubliken der sozialistischen Balkanföderation. Seine Regierung orientiert sich am Titoismus und steht unter Litos sowjetischer Schutzherrschaft."
