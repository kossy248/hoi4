l_english:
 sr_agitprop:0 "Lito's Agitprop: Words Becoming Tomorrow"
 sr_agitprop_campaign_lock_tt:0 "No other agitprop campaign can begin during the stated duration. Its bonuses expire with the campaign and do not stack permanently."
 sr_agitprop_councils:0 "The Councils Do Not Forget"
 sr_agitprop_councils_desc:0 "One hand holds meeting minutes, another a worn worker's cap. The poster reminds the leadership that participation means more than a friendly speech. The campaign opens meeting halls and publishes the administration's answers.\n\n180 days: Factory output +3%; stability +3 percentage points. Also gain 6 trust; each represented republic loses 5 resistance.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_councils_spirit:0 "The Councils Do Not Forget"
 sr_agitprop_councils_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Factory output +3%; stability +3 percentage points. Also gain 6 trust; each represented republic loses 5 resistance."
 sr_agitprop_desc:0 "A poster cannot fulfil a broken promise. It can bring people together for a shared next step. Only one campaign can run at a time. Each has a fixed duration, and the same title cannot be selected again for at least 180 days. The active design appears on the left; the final posters will follow from your supplied artwork.\n\nTrust in Lito's government: [?sr_story_trust|0]/100."
 sr_agitprop_earth:0 "The Earth Belongs to Those Who Work"
 sr_agitprop_earth_desc:0 "Workforces clasp hands above a globe. The campaign promotes exchange and socialist cooperation without taking away a partner's voice. A wider world starts with a credible invitation.\n\n180 days: Improve-relations maintenance cost −20%; daily political power +0.10. Available only at peace.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_earth_spirit:0 "The Earth Belongs to Those Who Work"
 sr_agitprop_earth_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Improve-relations maintenance cost −20%; daily political power +0.10. Available only at peace."
 sr_agitprop_horizon:0 "Our Tomorrow Knows No Borders"
 sr_agitprop_horizon_desc:0 "Hands from several republics hold an open textbook. Lito funds translations, public lectures and travelling technical exhibitions. Knowledge should travel without stopping at an official's office.\n\n180 days: Research speed +4%.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_horizon_spirit:0 "Our Tomorrow Knows No Borders"
 sr_agitprop_horizon_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Research speed +4%."
 sr_agitprop_light:0 "For the Union Until the Last Light"
 sr_agitprop_light_desc:0 "The station remains lit as the last hospital train arrives. The poster speaks of those defending the Union and those supplying it. Its promise is that no one will be left behind.\n\n90 days: Army recovery rate +6%; war support +5 percentage points; supply consumption −3%. Available only at war.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_light_spirit:0 "For the Union Until the Last Light"
 sr_agitprop_light_spirit_desc:0 "An active agitprop campaign supports this government objective for 90 days. Army recovery rate +6%; war support +5 percentage points; supply consumption −3%. Available only at war."
 sr_agitprop_no_active_campaign_tt:0 "No other agitprop campaign is active."
 sr_agitprop_peoples:0 "Eleven Peoples — One Shared Dawn"
 sr_agitprop_peoples_desc:0 "Different languages and different landscapes, but the same right to a future. The campaign depicts our timeline's eleven early republics as partners. Republics admitted later share that same promise of equality.\n\n180 days: Stability +4 percentage points; daily political power +0.05. Also gain 5 trust and 0.02 Union balance.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_peoples_spirit:0 "Eleven Peoples — One Shared Dawn"
 sr_agitprop_peoples_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Stability +4 percentage points; daily political power +0.05. Also gain 5 trust and 0.02 Union balance."
 sr_agitprop_sky:0 "No Sky Belongs to Tyrants"
 sr_agitprop_sky_desc:0 "A pilot and a mechanic look up at the same aircraft. Victory in the sky begins with a sound machine and a crew that trusts its skills. Records are welcome; a safely returned flight matters more.\n\n180 days: Air mission efficiency +4%; air accidents −5%.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_sky_spirit:0 "No Sky Belongs to Tyrants"
 sr_agitprop_sky_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Air mission efficiency +4%; air accidents −5%."
 sr_agitprop_star:0 "As Long as One Star Burns Above Us"
 sr_agitprop_star_desc:0 "Lito's face must not stand above the promises he made. The red star on this poster belongs to the people who hold the Union together every day: at the station, in the hospital and at the negotiating table.\n\n180 days: Stability +4 percentage points; war support +3 percentage points.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_star_spirit:0 "As Long as One Star Burns Above Us"
 sr_agitprop_star_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Stability +4 percentage points; war support +3 percentage points."
 sr_agitprop_steel:0 "From Steel We Forge Tomorrow"
 sr_agitprop_steel_desc:0 "A blast furnace glows against the night. Beneath it are no impossible record targets, but the names of workforces sharing their methods with other factories. The next production drive must build a future belonging to its workers.\n\n180 days: Factory output +6%; construction speed +3%.\n\nOnly one agitprop campaign can run at a time."
 sr_agitprop_steel_spirit:0 "From Steel We Forge Tomorrow"
 sr_agitprop_steel_spirit_desc:0 "An active agitprop campaign supports this government objective for 180 days. Factory output +6%; construction speed +3%."
 sr_union_amnesty_guarantees:0 "Guarantees for a Return"
 sr_union_amnesty_guarantees_desc:0 "Amnesty guarantees tie up personnel for 120 days. Army organization: −2%."
 sr_union_budget_reserve_tt:0 "The reserve expires after 365 days. Below −0.20 balance, release it once for 85 political power, +0.06 balance and +3 trust."
 sr_union_central_emergency_powers:0 "Headquarters Demands Full Powers"
 sr_union_central_emergency_powers_desc:0 "Once during a war with balance below −0.20: +100 political power and +5 percentage points war support. The price is −0.12 balance and −10 trust. For 180 days: +0.10 daily political power, but −4 percentage points stability. These powers do not reconcile the federation."
 sr_union_compromise_budget:0 "The Price of a Compromise"
 sr_union_compromise_budget_desc:0 "Contracts are reallocated for 90 days. Factory output: −3%."
 sr_union_delegate_congress:0 "Bring the Republics to One Table"
 sr_union_delegate_congress_desc:0 "Chairs and interpreters are not enough. Delegates receive standing negotiating rights and time to reach decisions. For 75 political power: +0.08 Union balance and +6 trust. Standing sessions cost 0.10 daily political power for 120 days. Available every 240 days."
 sr_union_delegate_sessions:0 "Delegates Stay at the Table"
 sr_union_delegate_sessions_desc:0 "The Union administration funds standing delegations for 120 days. Daily political power: −0.10."
 sr_union_emergency_compromise:0 "A Handshake Before the Abyss"
 sr_union_emergency_compromise_desc:0 "When balance drops below −0.20, Lito can fund an urgent compromise with at least 20 trust. For 90 political power: +0.15 balance and +8 trust; −2 percentage points stability. Reallocated contracts cost 3% factory output for 90 days. Cooldown: 365 days."
 sr_union_joint_war_council:0 "No War Without the Republics"
 sr_union_joint_war_council_desc:0 "During a war, every republic receives a voice in joint planning. For 60 political power: +0.07 balance, +3 trust and +3 percentage points war support. For 180 days: +5% planning speed, but −2.5% factory output due to revised delivery plans. Cooldown: 180 days."
 sr_union_joint_war_planning:0 "A War Council of All Republics"
 sr_union_joint_war_planning_desc:0 "Shared planning increases planning speed by 5% for 180 days but disrupts delivery plans: factory output −2.5%."
 sr_union_plan_audit:0 "A Public Audit of the Plan"
 sr_union_plan_audit_desc:0 "Factories suspend part of their work for a public review. Factory output: −3% for 90 days."
 sr_union_prepare_budget_reserve:0 "Prepare for the Day of Crisis"
 sr_union_prepare_budget_reserve_desc:0 "At peace and with at least 55 trust, the Union Council sets aside a budget reserve for 60 political power. It lasts 365 days and can only be released when balance falls below −0.20. This ties up resources now instead of granting an immediate bonus. A new reserve can be prepared after 365 days."
 sr_union_public_plan_audit:0 "Open the Plan to the People"
 sr_union_public_plan_audit_desc:0 "At peace, the federal plan's figures receive a public audit. Cost: 55 political power. +0.04 balance, +4 trust and −5 resistance in each represented republic. The audit disrupts deliveries: −3% factory output for 90 days. Cooldown: 180 days."
 sr_union_release_budget_reserve:0 "The Reserve Keeps the Promise"
 sr_union_release_budget_reserve_desc:0 "The prepared reserve is released exactly once during a crisis: +85 political power, +0.06 balance and +3 trust. This consumes the reserve. The decision requires an existing reserve and balance below −0.20."
 sr_union_republic_amnesty:0 "Open the Doors for a Return"
 sr_union_republic_amnesty_desc:0 "During mass strikes, Lito offers a supervised amnesty. Cost: 100 political power. Each represented republic loses 15 resistance; +8 trust and +0.06 balance. Guarantees cost 3 percentage points war support and 2% army organization for 120 days. Cooldown: 365 days."
 sr_union_wartime_secretariat:0 "Extraordinary Powers"
 sr_union_wartime_secretariat_desc:0 "The wartime headquarters speeds decisions for 180 days while limiting participation. Daily political power: +0.10; stability: −4 percentage points."
