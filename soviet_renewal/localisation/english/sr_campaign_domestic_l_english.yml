l_english:
 sr_cd_1_t:0 "The Constitution Reaches the Factory Floor"
 sr_cd_1_workers_d:0 "The delegates bring the minutes of the factory meeting where Lito gave workers the final say. A toolmaker places the new constitution beside them. Her council dismissed a director; the party committee reversed that decision the next morning.\n\n'Does the constitution still apply', she asks, 'when the party dislikes the result?' The responsible secretary warns about interrupted supply chains. He does not dispute a right to consultation. He disputes one factory's right to disrupt a Union-wide plan.\n\nLito's earlier answer must now become a rule. Binding procedures require time and resources. A party veto keeps the plan together, but makes the original promise smaller."
 sr_cd_1_director_d:0 "Lito left the director responsible for the production plan. Since the new constitution, several councils have disputed whether that includes an indefinite veto. A delegation elected a director whom the party committee refuses to appoint.\n\n'Last time we discussed a turbine', one delegate says. 'Today we are asking who may overrule our vote.' The party secretary recalls Lito's promise of dependable leadership. Lito recognizes both signatures: the one beneath the delivery plan and the one beneath the constitution.\n\nHe can finance a binding appeals procedure. Or he can confirm that the party retains the final word in a dispute."
 sr_cd_1_a:0 "A council's vote must also bind a party committee. (60 political power)"
 sr_cd_1_b:0 "The party is responsible for the common plan and retains its veto."
 sr_cd_council_review_tt:0 "After 120 days, factory councils and party committees report on this settlement. Their response depends on this choice. A further 120 days later, a lasting appeals procedure will be debated."
 sr_cd_2_t:0 "Four Months Under the New Rule"
 sr_cd_2_binding_d:0 "The first weeks were uncomfortable. Three delivery plans were renegotiated, meetings continued late into the night, and one director had to explain a rejected decision. The report also records two factories sharing their own improvements with other plants.\n\nThe delegate from the original meeting sends Lito no letter of gratitude. She sends her council's standing orders, corrected in the margins. Workers are beginning to rely on procedures they can apply themselves. Party committees request additional staff to coordinate decisions between factories."
 sr_cd_2_veto_d:0 "Delivery figures look respectable. Council minutes are growing thinner. One council submitted its proposed shift arrangements three times and received three refusals without a written explanation.\n\nThe toolmaker requests another meeting. 'If nobody has to explain a refusal, we need not write the application.' The party committee replies that the current arrangement prevented shortages.\n\nLito can replace the veto with binding appeals now. It requires less political work than a new constitution, but the reversal would be public."
 sr_cd_2_a:0 "The rules remain binding. Support the committees' coordination work."
 sr_cd_2_b:0 "Vetoes will require reasons and permit appeals. Change the course. (40 political power)"
 sr_cd_2_c:0 "The delivery figures show why we need this arrangement."
 sr_cd_3_t:0 "Who Decides When Lito Is Not in the Room?"
 sr_cd_3_rules_d:0 "The constitutional commission presents a slim booklet. It defines appeal deadlines, responsibilities and a right to a written answer. Some party officials consider it unnecessary: Lito can continue to resolve particularly difficult cases himself.\n\nA council chair objects. 'Then our right lasts only as long as we can get an appointment.' Lito turns the pages. Published rules would also limit his own discretion. Personal arbitration is quicker and politically convenient. It leaves the Union waiting outside his door."
 sr_cd_3_personal_d:0 "Since the party veto, more petitions have arrived directly at Lito's office. His secretaries sort them by urgency. An angry council wrote on its envelope: 'Responsible for the constitution: the chairman personally.'\n\nThe constitutional commission offers a regular appeals procedure. Publishing it consumes political resources and ends the unrestricted veto. Some party officials warn that Lito would surrender one of his most effective means of arbitration.\n\nThe pile on his desk does not shrink during their discussion."
 sr_cd_3_a:0 "Publish the appeals charter. It must work without an appointment with me. (50 political power)"
 sr_cd_3_b:0 "For now, the difficult cases will remain on my desk."
 sr_cd_11_t:0 "Three Delegations, Three Files"
 sr_cd_11_d:0 "Delegations from the republics still represented in the Union arrive with different records. Ukraine discusses promised workshops, Georgia cultural rights, Kazakhstan transport routes. Where a promise was fulfilled, delegates ask whether it establishes a lasting right. Where a deadline expired, they ask why another application took priority.\n\nAn official proposes answering each case separately. The delegations insist on a joint hearing: only comparison will reveal whether Lito's Union applies the same standards to everyone. A commission would occupy political staff for three months. Without it, allocations remain in the hands of individual departments."
 sr_cd_11_a:0 "Put every file on the same table. (50 political power)"
 sr_cd_11_b:0 "Let the departments continue. Comparisons only delay their work."
 sr_cd_republic_hearing_tt:0 "A comparative report follows in 90 days. Previously fulfilled and broken promises remain relevant. Rejecting the hearing adds 10 resistance in still-represented republics whose promise was broken."
 sr_cd_12_t:0 "The Line Between a Right and an Exception"
 sr_cd_12_hearing_d:0 "The commission has not made the files identical. It has revealed where identical words meant different things. An approved factory was a lasting investment; cultural rights could be restricted by the next departmental instruction. Unfulfilled promises appeared in no common register.\n\nDelegations now demand a written settlement and clear responsibilities. One departmental head warns that guaranteed procedures consume political work every day. He would rather allocate new resources according to immediate production. Lito can turn the comparison into binding rules or file it as material for the next plan."
 sr_cd_12_unexamined_d:0 "The departments have continued their programs. Their answers to the republics remain different too. One delegation points to a fulfilled promise; another places an overdue letter beside it. In the corridor, people already say that better connections secure earlier appointments.\n\nA written settlement is still possible. It helps republics that remain represented according to their earlier experience: fulfilled promises set an example, while broken ones can be partly reconciled. The cheaper alternative is competition for resources based on production. That may improve figures without improving equal treatment."
 sr_cd_12_a:0 "Write down the rules, including remedies for overlooked applications. (40 political power)"
 sr_cd_12_b:0 "New resources go where they promise the greatest output."
 sr_cd_republic_settlement_tt:0 "Only currently represented republics are affected: a previously fulfilled promise reduces their resistance by 5 and adds 2 trust; a broken promise reduces resistance by 10. A further report follows after 150 days, repeating these distinctions after checking representation again."
 sr_cd_13_t:0 "What Became of the Comparative Report"
 sr_cd_13_settlement_d:0 "The second report describes no great celebrations. It records answers delivered on time and decisions that could be appealed. Where Lito had kept his word, the new rules are accepted more readily. Where a promise had been broken, the language remains cautious. There, receiving a binding answer matters first.\n\nThe commission does not call this a final reconciliation. It calls it a difference people can notice in ordinary life. Only republics that still belong to the Union are included."
 sr_cd_13_production_d:0 "The new allocations enabled additional production. The comparative report nevertheless returns to Lito's desk. A republic already disappointed by an earlier promise sees competition as another explanation for why it must wait. Delegates from territories since lost no longer appear on the list.\n\nThe department points to its production figures. Political representatives point to empty chairs. Both records describe the same decision."
 sr_cd_13_a:0 "Publish the report. Even limited progress must be open to scrutiny."
 sr_cd_13_b:0 "We accept the political cost of our production priorities."
 sr_cd_21_t:0 "The Constitution Is Not Being Conscripted"
 sr_cd_21_councils_d:0 "Since the outbreak of war, emergency orders have piled up beside council minutes. A representative of the arms factories recalls Lito's promise at the factory meeting: participation must not end at the first difficult moment. The general staff answers with supply reports.\n\nA joint war council would include civilian representatives and slow coordination. The proposed emergency cabinet could enforce production orders immediately. It promises to return its powers later.\n\nLito underlines the word 'later'. Nobody has yet agreed what date it means."
 sr_cd_21_centre_d:0 "The first war meeting ends with a demand for additional powers. The emergency cabinet's draft proposes shorter procedures, binding production orders and authority to postpone civilian objections.\n\nRepublican representatives request seats at the table. They promise cooperation but want to learn of decisions concerning their factories before reading the order sheet. A joint war council costs political effort and some planning speed. The emergency cabinet would release resources immediately.\n\nLito asks who will return these powers after the war. That paragraph is still missing from the draft."
 sr_cd_21_a:0 "The republics and councils will have seats at the table. (60 political power)"
 sr_cd_21_b:0 "Grant the emergency cabinet the powers it temporarily needs."
 sr_cd_war_review_tt:0 "Factory reports follow in 90 days. Another 120 days later, the return of emergency powers is debated. The course responds to whether the Union is still at war."
 sr_cd_22_t:0 "A Night Shift Writes Back"
 sr_cd_22_war_d:0 "Management announces a new record. Attached is a night-shift letter: the same machines are running longer, breaks have been shortened, and two accidents are absent from the statistics. The factory doctor requests access to the complete lists.\n\nThe armaments administration warns that scrutiny costs production. A funded inspection could enforce standards while lowering output temporarily. An additional quota promises more equipment for the front. Lito can also leave responsibility with local officials; then it remains uncertain which reports reach his desk at all."
 sr_cd_22_peace_d:0 "The front reports have fallen silent. The night shift's letter is still in the armaments office. It describes shortened breaks and accidents missing from production records. The factory doctor now requests the lists from the war years.\n\nA funded inspection would reveal the causes while briefly disrupting production. The departmental head would rather leave the investigation to local officials. War can no longer explain the delay; the decision remains a question of responsibility."
 sr_cd_22_a:0 "Give the doctor the complete lists and an inspection team. (40 political power)"
 sr_cd_22_b:0 "The front needs equipment. Set a higher quota for the next period."
 sr_cd_22_c:0 "Let the local authorities investigate the case themselves."
 sr_cd_23_t:0 "Emergency Powers Have a Return Date"
 sr_cd_23_war_d:0 "The next review takes place while the Union remains at war. The emergency cabinet declares its work unfinished. Republican representatives reply that an undefined task can swallow every deadline. Even where a joint war council was formed, temporary exceptions have become habitual.\n\nLito can restore binding civilian oversight, extend the exception with a new deadline or simply let it lapse. None of these choices replaces missing equipment. It determines which part of government must still explain its decisions."
 sr_cd_23_peace_d:0 "The Union is at peace again. Some ministries have nevertheless kept their exceptional procedures: established routines, they say, must not be abandoned too soon. Republican representatives insist on the promised return date.\n\nLito can fund the restoration of civilian rights and establish binding responsibilities. Or he can let temporary powers lapse without an additional program. A new wartime extension is unavailable in peacetime. The paragraph missing at the war's beginning still awaits its place on the final page."
 sr_cd_23_a:0 "Restore binding civilian oversight. (30 political power)"
 sr_cd_23_b:0 "Extend the exception once; the Union is still fighting."
 sr_cd_23_c:0 "Let the exceptions expire. We cannot fund an additional program."
 sr_cd_last_review_tt:0 "A final report follows in 120 days. An extended exception is more readily tolerated when trust remains high; below 55 trust it damages stability and production. Returned rights strengthen confidence in the constitution."
 sr_cd_24_t:0 "A Private Letter to the Chairman"
 sr_cd_24_decree_d:0 "A delegate writes without official stationery. He supported the war effort and will continue to do so. But his workers now ask which temporary exception is actually temporary.\n\nThe letter's effect depends on Lito's previous credibility. Where trust survives, the renewed deadline is reluctantly accepted. Where earlier promises already created doubts, the extension seems further evidence that the center is unwilling to return rights. The letter requests no grand speech. It asks that the next promise mean something."
 sr_cd_24_rights_d:0 "A republican delegate's letter contains an unusual observation: the local administration overturned a wartime department's decision and was not overruled. He writes that his colleagues value this more than another speech about the constitution.\n\nReturning civilian rights slowed procedures and irritated several departmental heads. It also showed that a temporary exception can end under Lito. The letter promises no unlimited loyalty. It promises to participate in the next difficult negotiation."
 sr_cd_24_a:0 "That is why the constitution must also apply in a crisis."
 sr_cd_24_b:0 "Trust carries this deadline. It is not an unlimited mandate."
 sr_cd_24_c:0 "Their exhaustion is also a response to our decisions."
 sr_cd_constitutional_debate:0 "The Constitution on the Factory Floor"
 sr_cd_constitutional_debate_desc:0 "Drawing up binding council rights temporarily consumes working time: factory output −2%, daily political power −0.05."
 sr_cd_binding_councils:0 "Binding Council Decisions"
 sr_cd_binding_councils_desc:0 "Reliable appeals add 2 percentage points of stability and cost 0.05 daily political power."
 sr_cd_party_veto:0 "The Party Committee's Final Word"
 sr_cd_party_veto_desc:0 "Central decisions are easier to enforce: daily political power +0.10, stability −2 percentage points."
 sr_cd_comparative_commission:0 "Republican Comparative Commission"
 sr_cd_comparative_commission_desc:0 "Examining previous promises together costs 0.10 daily political power."
 sr_cd_local_guarantees:0 "Reliable Regional Procedures"
 sr_cd_local_guarantees_desc:0 "Written responsibilities add 2 percentage points of stability and cost 0.05 daily political power."
 sr_cd_competitive_allocations:0 "Resources Follow Production"
 sr_cd_competitive_allocations_desc:0 "Productive factories receive priority: factory output +2.5%, stability −2 percentage points."
 sr_cd_war_councils:0 "Republics in the War Council"
 sr_cd_war_councils_desc:0 "Participation adds 2% army organization but requires coordination: planning speed −2%."
 sr_cd_emergency_cabinet:0 "Temporary Emergency Cabinet"
 sr_cd_emergency_cabinet_desc:0 "Binding production orders add 3% factory output but cost 3 percentage points of stability."
 sr_cd_labour_inspections:0 "The Factory Doctor Sees the Records"
 sr_cd_labour_inspections_desc:0 "Inspecting working conditions temporarily reduces factory output by 2% and adds 2 percentage points of stability."
 sr_cd_wartime_quotas:0 "Additional Wartime Quota"
 sr_cd_wartime_quotas_desc:0 "Longer production adds 4% factory output and costs 2 percentage points of stability."
 sr_cd_renewed_decree:0 "The Exception Extended Once"
 sr_cd_renewed_decree_desc:0 "Extended special administration adds 0.10 daily political power and costs 3 percentage points of stability."
 sr_cd_returned_rights:0 "Civilian Oversight Restored"
 sr_cd_returned_rights_desc:0 "Reorganization adds 2.5 percentage points of stability; additional coordination costs 1% factory output."
 sr_cd_constitutional_confidence:0 "A Constitution People Can Invoke"
 sr_cd_constitutional_confidence_desc:0 "Verifiable procedures strengthen confidence in public decisions: daily political power +0.05, stability +2 percentage points."
 sr_cd_emergency_fatigue:0 "Tired of the Temporary Exception"
 sr_cd_emergency_fatigue_desc:0 "When trust is low, extended special powers resemble another broken promise: factory output −2%, stability −2.5 percentage points."
