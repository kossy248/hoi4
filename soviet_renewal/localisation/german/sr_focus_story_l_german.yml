l_german:
 sr_focus_story_1_title:0 "Wem gehört die Werkbank?"
 sr_focus_story_1_desc:0 "Der Direktor hat seine Produktionszahlen schon vorgelesen, als eine Schlosserin aufsteht. Wenn der Rat nur beraten dürfe, fragt sie, was unterscheide ihn dann von der alten Betriebsversammlung? Hinter ihr klopfen Hände auf die Tische. Der Direktor hält die Lieferfristen dagegen: Über eine Turbine könne man nicht so lange abstimmen, bis das Kraftwerk stillstehe.\n\nLito muss entscheiden, welches seiner Versprechen an diesem Tag Gewicht hat. Die Arbeiterselbstverwaltung wird eingerichtet. Aber wer darf im Streitfall Nein sagen?"
 sr_focus_story_1_councils:0 "Der Rat erhält das letzte Wort. Gebt ihm Zeit und Mittel."
 sr_focus_story_1_director:0 "Der Rat berät; der Direktor verantwortet den Plan."
 sr_focus_story_2_title:0 "Das Getreide bleibt nicht auf dem Papier"
 sr_focus_story_2_desc:0 "Auf der Karte im Landwirtschaftskommissariat sehen Lieferungen wie gerade Pfeile aus. Die Delegation vom Land hat andere Unterlagen mitgebracht: Listen mit Saatgut, ausgefallenen Wagen und Familien, die das Korn bis zur nächsten Ernte benötigen. Ihre Genossenschaften wollen liefern, verlangen aber verlässliche Preise.\n\nDie Planer warnen, dass zusätzliche Verträge Geld kosten. Eine verbindliche Abnahmequote verspricht raschere Lieferungen. Lito kennt die Gefahr: Ein voller Speicher kann auf dem Papier wie ein Erfolg aussehen und in den Dörfern wie ein gebrochenes Wort."
 sr_focus_story_2_contracts:0 "Bezahlt verlässliche Verträge, statt neue Quoten zu diktieren."
 sr_focus_story_2_quota:0 "Die Städte brauchen Getreide. Setzt eine feste Abnahmequote."
 sr_focus_story_3_title:0 "Ein Labor mit zwei Schlüsseln"
 sr_focus_story_3_desc:0 "Die erste Versuchsreihe ist gelungen. Nun streiten die Laborleiter darüber, wer das Ergebnis sehen darf. Die zivile Akademie möchte Zeichnungen und Messwerte an alle Republiken verschicken. Der Nachrichtendienst verlangt verschlossene Schränke und Zugangsscheine: Was heute eine Funkanlage verbessere, könne morgen dem Gegner dienen.\n\nBeide Seiten bieten Lito Fortschritt an. Die eine verlangt zusätzliche Mittel für den Austausch, die andere verspricht sofortige Anwendungen in den Rüstungsbetrieben. Unter seiner Unterschrift muss stehen, für wen dieses Wissen bestimmt ist."
 sr_focus_story_3_open:0 "Die Institute sollen ihre Ergebnisse miteinander teilen."
 sr_focus_story_3_secret:0 "Militärische Anwendungen haben zunächst Vorrang."
 sr_focus_story_4_title:0 "Der Hauptmann widerspricht"
 sr_focus_story_4_desc:0 "Der Generalstab beschreibt das Manöver als Beweis reibungsloser Führung. Dann legt ein Hauptmann seine Marschtabelle daneben: Seine Kompanie habe auf einen schriftlichen Befehl gewartet, während die Nachbareinheit längst zurückwich. Hätte er eigenmächtig handeln dürfen, wäre die Übung anders ausgegangen.\n\nEin Stabsoffizier antwortet trocken, dass eine Armee aus tausend eigenmächtigen Hauptleuten keine gemeinsame Front halte. In den neuen Offiziersschulen werden beide sitzen. Lito entscheidet, welche Lehre an der Tafel stehen wird."
 sr_focus_story_4_initiative:0 "Wir bilden Offiziere aus, die Verantwortung übernehmen."
 sr_focus_story_4_plans:0 "Initiative braucht einen gemeinsamen Einsatzplan."
 sr_focus_story_5_title:0 "Der Flug, über den niemand berichtet"
 sr_focus_story_5_desc:0 "Die Zeitung hat den neuen Höhenrekord schon auf die Titelseite gesetzt. Im gleichen Umschlag liegt ein Bericht über ein Flugzeug, das nach einer Übung nicht zurückkam. Die Mechaniker nennen fehlende Ersatzteile; der Ausbildungsleiter beklagt zu wenige Flugstunden.\n\nDie Mittel reichen zunächst für eine zusätzliche Anstrengung. Neue Werkstätten kosten politische Unterstützung und Geld. Zusätzliche Ausbildungsflüge lassen sich sofort ansetzen, verbrauchen aber Treibstoff. Lito lässt die Rekordmeldung liegen und nimmt den Unfallbericht zur Hand."
 sr_focus_story_5_workshops:0 "Erst die Ersatzteile. Niemand fliegt für eine Schlagzeile."
 sr_focus_story_5_training:0 "Mehr Flugstunden: Erfahrung lässt sich nicht am Boden lernen."
 sr_focus_story_6_title:0 "Zwei Karten für die gleiche Flotte"
 sr_focus_story_6_desc:0 "Der Admiral breitet eine Seekarte mit Häfen und möglichen Flottenbesuchen aus. Daneben legt ein Verbindungsoffizier Meldungen der Handelsmarine: lange Routen, schlecht gesicherte Konvois und Kapitäne, die im Ernstfall auf sich gestellt wären.\n\nEine sichtbare Flotte gibt der Union Ansehen und stärkt die Besatzungen. Ein besonderes Geleitprogramm schützt unscheinbare Frachter, bindet aber Mittel. Lito fragt nach, welche Schiffe die Union vermissen würde, wenn sie morgen ausblieben."
 sr_focus_story_6_escorts:0 "Eine starke Union bringt ihre Handelsschiffe nach Hause."
 sr_focus_story_6_prestige:0 "Die Welt soll unsere Flagge auf See sehen."
 sr_focus_story_7_title:0 "Die Namen im versiegelten Dossier"
 sr_focus_story_7_desc:0 "Das Dossier enthält keine großen Verschwörungen. Es beschreibt Dienstwohnungen, verschwundene Materiallieferungen und Aufträge für Verwandte. Auf mehreren Seiten stehen Namen von Genossen, die Lito persönlich kennen. Einer hat sich bereits zu einem vertraulichen Gespräch angekündigt.\n\nDie Untersuchungskommission verlangt freie Hand. Der Parteisekretär empfiehlt, zunächst die nachgeordneten Stellen zu prüfen: Die Führung dürfe sich in dieser Lage nicht selbst schwächen. Lito hatte Rechenschaft versprochen. Jetzt betrifft das Wort seine eigenen Verbündeten."
 sr_focus_story_7_independent:0 "Auch meine Freunde legen Rechenschaft ab."
 sr_focus_story_7_limited:0 "Begrenzt das Verfahren. Die Parteiführung muss arbeitsfähig bleiben."
 sr_focus_story_8_title:0 "Eine Union aus Entscheidungen"
 sr_focus_story_8_desc:0 "Auf Litos Schreibtisch liegt der Abschlussbericht. Er enthält Werkversammlungen, Ernteleistungen, Streit über Befehle und die Briefe der Republiken. Die Union steht noch. Die Frage, warum sie steht, lässt sich nicht mit einer einzigen Zahl beantworten.\n\nManche ihrer Einrichtungen beruhen auf Zustimmung, andere auf Geduld und wieder andere auf der Macht der Zentrale. Lito blättert zur letzten Seite. Dort wartet keine neue Parole, sondern die nächste Aufgabe: Die Menschen müssen den Institutionen auch dann vertrauen können, wenn er nicht persönlich am Verhandlungstisch sitzt.\n\nAktuelles Vertrauen in Litos Regierung: [?sr_story_trust|0]/100."
 sr_focus_story_8_trusted:0 "Das Vertrauen gehört den Menschen, die diese Union tragen."
 sr_focus_story_8_contested:0 "Der Vertrag steht. Überzeugungsarbeit bleibt unsere Aufgabe."
 sr_focus_story_9_title:0 "Drei Monate später: die Werkversammlung"
 sr_focus_story_9_desc:0 "Der neue Bericht kommt ohne Goldrand. Er nennt versäumte Schichten, erfüllte Aufträge und Entscheidungen, die im ersten Entwurf nicht vorgesehen waren. Die Regeln aus Litos Werkbesuch sind inzwischen Alltag geworden.\n\nWo die Räte entscheiden durften, kosteten Auseinandersetzungen zunächst Zeit; inzwischen geben Belegschaften ihre Erfahrungen an andere Werke weiter. Wo der Direktor das letzte Wort behielt, kamen die Pläne schneller voran. Doch dort kehrt die Frage zurück, ob Mitsprache mehr bedeutet als eine Sitzung vor der Entscheidung."
 sr_focus_story_9_councils:0 "Aus Streit ist Erfahrung geworden. Teilt sie mit den anderen Werken."
 sr_focus_story_9_directors:0 "Die Lieferzahlen stimmen. Das Schweigen der Belegschaften bleibt."
 sr_focus_story_10_title:0 "Vier Monate später: der zweite Laborbericht"
 sr_focus_story_10_desc:0 "Der Laborbericht zeigt, wie viel von einer wissenschaftlichen Entdeckung an den Türen des Instituts entschieden wird. Die offene Zusammenarbeit hat Verbesserungen in zivilen Betrieben ermöglicht; das geschützte Programm hat dagegen technische Speziallösungen für die Streitkräfte hervorgebracht.\n\nBeide Wege liefern Ergebnisse. Doch die Institute erinnern sich auch daran, wem sie ihre Arbeit erklären mussten. Forschung ist unter Lito kein unpolitischer Raum geworden. Sie hat eine Richtung erhalten, die lange über diesen Bericht hinauswirken wird."
 sr_focus_story_10_open:0 "Das nächste Institut soll nicht wieder bei null beginnen."
 sr_focus_story_10_secret:0 "Die Streitkräfte erhalten die neuen Messverfahren."
 sr_fs_factory_debate:0 "Der Betrieb lernt mitzuentscheiden"
 sr_fs_factory_debate_desc:0 "Die neue Selbstverwaltung benötigt Sitzungen und Einarbeitung. Fabrikausstoß: −3 % für 90 Tage. Nach drei Monaten folgt eine Bilanz."
 sr_fs_factory_quota:0 "Der Direktor erfüllt die Quote"
 sr_fs_factory_quota_desc:0 "Klare Weisungen beschleunigen vorübergehend die Fertigung. Fabrikausstoß: +4 % für 180 Tage; die Belegschaften erwarten weiterhin echte Mitsprache."
 sr_fs_procurement_drive:0 "Zentrale Getreideabnahme"
 sr_fs_procurement_drive_desc:0 "Feste Abnahmequoten entlasten kurzfristig die Versorgung, belasten aber die Gemeinden. Fabrikausstoß: +3 %; Stabilität: −2 Prozentpunkte für 180 Tage."
 sr_fs_open_research:0 "Offene Laborbücher"
 sr_fs_open_research_desc:0 "Finanzierter Austausch beschleunigt die gemeinsame Forschung. Forschungsgeschwindigkeit: +1,5 % für 365 Tage."
 sr_fs_military_laboratories:0 "Geschützte Militärlabore"
 sr_fs_military_laboratories_desc:0 "Die Forschung konzentriert sich auf Anwendungen in Rüstungsbetrieben. Fabrikausstoß: +2,5 % für 365 Tage."
 sr_fs_field_command:0 "Verantwortung an der Front"
 sr_fs_field_command_desc:0 "Die Offiziersausbildung fördert Initiative, verlangt jedoch mehr Abstimmung. Heeresorganisation: +3 %; Planungsgeschwindigkeit: −3 % für 365 Tage."
 sr_fs_central_planning:0 "Verbindliche Stabspläne"
 sr_fs_central_planning_desc:0 "Zentrale Verfahren erleichtern die Planung, schränken örtliche Initiative jedoch ein. Planungsgeschwindigkeit: +6 %; Heeresorganisation: −1 % für 365 Tage."
 sr_fs_air_workshops:0 "Ersatzteile vor Rekorden"
 sr_fs_air_workshops_desc:0 "Zusätzliche Werkstattmittel sichern einsatzfähige Flugzeuge. Luftunfälle: −5 %; Luftmissionseffizienz: +1 % für 365 Tage."
 sr_fs_extended_flying:0 "Zusätzliche Ausbildungsflüge"
 sr_fs_extended_flying_desc:0 "Die Piloten sammeln Erfahrung; zusätzliche Flüge verbrauchen Treibstoff. Treibstoffverbrauch der Luftwaffe: +5 % für 180 Tage."
 sr_fs_merchant_escorts:0 "Geleit für die Handelsmarine"
 sr_fs_merchant_escorts_desc:0 "Zusätzliche Geleitübungen verbessern den Schutz und erhöhen den Verbrauch. Konvoischutzeffizienz: +5 %; Marinetreibstoffverbrauch: +2 % für 365 Tage."
 sr_fs_fleet_presence:0 "Die Flagge der Union auf See"
 sr_fs_fleet_presence_desc:0 "Flottenbesuche stärken die Besatzungen, benötigen aber Treibstoff. Marineorganisation: +3 %; Marinetreibstoffverbrauch: +5 % für 180 Tage."
 sr_fs_privileges_review:0 "Die Kommission prüft die Privilegien"
 sr_fs_privileges_review_desc:0 "Unabhängige Ermittlungen binden politische Arbeitskraft. Tägliche politische Macht: −0,05 für 180 Tage."
 sr_fs_learned_self_management:0 "Erfahrene Arbeiterräte"
 sr_fs_learned_self_management_desc:0 "Nach der schwierigen Anfangsphase geben die Belegschaften erfolgreiche Verfahren weiter. Fabrikausstoß: +3 % für 365 Tage."
 sr_fs_electronics_bonus:0 "Erste Versuchsreihe der Elektroniklabore"
 sr_fs_open_science_bonus:0 "Offener Austausch der Labore"
 sr_fs_military_science_bonus:0 "Geschützte militärische Versuchsreihe"
