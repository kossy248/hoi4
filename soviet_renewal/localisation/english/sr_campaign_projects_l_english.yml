l_english:
 sr_government_program:0 "Lito’s Government Program"
 sr_government_program_desc:0 "After the first hundred days, resolutions must become institutions. Only one program can be financed at a time. Each can be started once; failure does not refund its initial budget. An interim choice follows after 90 days. Completion requires the concept chosen there and the listed focuses.\n\nTrust in Lito’s government: [?sr_story_trust|0]/100."
 sr_project_start_workshops:0 "Program: Connect the Workshops"
 sr_project_start_workshops_desc:0 "Starts a 240-day program after workers’ councils have been established and their first policy choice made. Start: 75 political power; completion: another 25. During the program: −2% factory output. After 90 days, choose local participation or uniform director standards. Completion also requires §YWorkshops of the Republics§!. Only one government program can run at a time."
 sr_project_finish_workshops:0 "Workshop Network: Sign the Operating Agreement"
 sr_project_finish_workshops_desc:0 "After the interim choice and §YWorkshops of the Republics§!, conclude the operating agreement for 25 political power. Participation grants +3% factory output for 365 days and +10 trust. Director standards grant +4% factory output and −1 percentage point stability for 365 days, plus 4 trust. If councils were previously promised the final word, choosing directors also costs 7 trust. The temporary budget penalty ends. Missing the deadline costs 8 trust, 0.03 Union balance and 2 percentage points stability for 180 days."
 sr_project_start_education:0 "Program: Learning after the Shift"
 sr_project_start_education_desc:0 "Starts a 270-day public education program after connecting the academies. Start: 60 political power; completion: another 40. Reassigned teachers cost 1% research speed during the program. After 90 days, choose open evening classes or technical cadre training. Completion also requires §YExpand Technical Education§!. Only one government program can run at a time."
 sr_project_finish_education:0 "Public Education: Open the First Academic Year"
 sr_project_finish_education_desc:0 "After the interim choice and §YExpand Technical Education§!, opening costs 40 political power. Open classes grant +2% research speed for 365 days and +8 trust. Technical training grants +1% research speed and −3% army training time for 365 days, plus 3 trust. The teacher penalty ends. Missing the deadline costs 8 trust, 0.03 Union balance and 2 percentage points stability for 180 days."
 sr_project_start_supply:0 "Program: One Timetable for the Whole Union"
 sr_project_start_supply_desc:0 "Starts a 240-day transport program once §YSupply to the Front§! or §YSupply Routes of the Union§! is complete. Start: 60 political power; completion: another 40. Reorganization costs 2% construction speed while the program runs. After 90 days, choose guaranteed civilian schedules or military priority. Completion requires both listed focuses. Only one government program can run at a time."
 sr_project_finish_supply:0 "Union Timetable: Put the Connections into Service"
 sr_project_finish_supply_desc:0 "After the interim choice and both §YSupply to the Front§! and §YSupply Routes of the Union§!, completion costs 40 political power. Civilian schedule rights grant +3% construction speed and −2% supply consumption for 365 days, plus 8 trust. Military priority grants −4% supply consumption and −1% construction speed for 365 days, plus 3 trust. The reorganization penalty ends. Missing the deadline costs 8 trust, 0.03 Union balance and 2 percentage points stability for 180 days."
 sr_projects_1_title:0 "The First Signature Is Not a Result"
 sr_projects_1_councils_desc:0 "Workshop representatives bring no new slogan to Lito. They place minutes on his desk. Since councils received the final word, each factory has ordered different spare parts and accumulated different experience. A good solution often remains inside the hall where it was first devised.\n\nLito wants to change that without turning councils into branch offices of a central authority. The allocated budget pays for travelling specialists and common documents. The first workshops will report in ninety days. Before the deadline, republican workshops must actually be developed and an operating agreement adopted."
 sr_projects_1_directors_desc:0 "The directors are accustomed to uniform figures. Now they must explain why two factories maintain the same machine in different ways. Their tables are orderly; their exchange of experience is not. Behind them, worker representatives wait for a chance to offer proposals.\n\nLito funds connections between workshops. A network can spread local solutions or standardize directors’ instructions. That question returns to the table after ninety days. The necessary workshops and an adopted operating agreement must be ready before the deadline."
 sr_projects_1_a:0 "At our next meeting, I want examples rather than new folders."
 sr_project_workshops_plan_tt:0 "The 240-day countdown began with the program. A policy choice follows after 90 days. Completion requires Workshops of the Republics and another 25 political power."
 sr_projects_2_title:0 "A Drawing Passes from Hand to Hand"
 sr_projects_2_desc:0 "A repair drawing lies on the table. A mechanic improved it during a night shift; three other factories have adopted it. A director wants to turn it into a binding standard. A delegate objects: the drawing became useful precisely because someone was allowed to change an existing instruction.\n\nThe first shared experience confronts Lito with an old question in a new form. Should elected workshop groups run the network, or should directors receive binding standards? After this decision, time remains to finish expanding the workshops."
 sr_projects_2_a:0 "The workshops choose their own connections."
 sr_projects_2_b:0 "A common handbook under the directors’ responsibility."
 sr_project_workshops_councils_tt:0 "On timely completion: +3% factory output for 365 days and +10 trust. The program still requires Workshops of the Republics and 25 political power."
 sr_project_workshops_standards_tt:0 "On timely completion: +4% factory output and −1 percentage point stability for 365 days, plus 4 trust. If councils were previously given the final word, this change of course also costs 7 trust."
 sr_projects_3_title:0 "What Became of the Workshop Agreement"
 sr_projects_3_councils_desc:0 "The agreement returns with handwritten amendments. One workshop wants the right to recall its delegates at any time; another proposes a successful spare-parts solution as a common standard. Delegates have not accepted every request, but have had to answer each one.\n\nExpansion is complete. For a year, the network sustains more production and greater trust. Lito places the first drawing beside the signed agreement. The change is small enough to see precisely: local experience no longer needs a personal invitation to Moscow before it can travel."
 sr_projects_3_standards_desc:0 "The new handbooks are at the workstations. Spare parts and maintenance routines pass more easily between factories. Production benefits, but directors must more often answer for decisions made elsewhere.\n\nDelegates remind Lito of the influence he originally granted councils. Where he promised them the final word, the new agreement is read as a withdrawal. The workshops are connected. Political ownership of that connection remains visibly disputed."
 sr_projects_3_failed_desc:0 "The program director brings the unfinished operating agreement. Connections, signatures or final financing are still missing. Dates on several pages have already passed.\n\nReorganization ends and no longer ties up extra production resources. The initial budget is gone. In the workshops, the announced opening date still hangs on the noticeboard. Lito orders publication of the report. A program that finishes nothing is also a decision people remember."
 sr_projects_3_a:0 "The report belongs in our record."
 sr_projects_4_title:0 "School Opens When the Shift Ends"
 sr_projects_4_desc:0 "The first applications arrive on worn scraps of paper. A lathe operator wants to understand technical drawings; a railway worker wants to study mathematics. The academy representative points to scarce teachers: anyone teaching in the evening will be absent from the institute during the day.\n\nLito funds a common public education program. For it to become more than one classroom, institutes, teaching materials and technical education must be brought together. In ninety days, we decide who receives the first places. The complete academic year must open before the deadline."
 sr_projects_4_a:0 "A right to education needs teachers, rooms and time."
 sr_project_education_plan_tt:0 "The 270-day countdown began with the program. A choice of teaching model follows after 90 days. Completion requires Expand Technical Education and another 40 political power."
 sr_projects_5_title:0 "The Last Empty School Desk"
 sr_projects_5_desc:0 "The application list is longer than the row of new desks. An instructor proposes reserving the first courses for specialists immediately needed by administration and the armed forces. A teacher has brought applications from people unable to name a sponsoring workplace.\n\nSpecialist courses promise knowledge that can be used quickly. Open evening classes spread knowledge more slowly but also reach people placed last in every previous selection. Lito must determine access before expansion reaches its decisive stage."
 sr_projects_5_a:0 "Open classes are part of the Union’s promise."
 sr_projects_5_b:0 "First, the specialists needed by institutes and armed forces."
 sr_project_education_open_tt:0 "On timely completion: +2% research speed for 365 days and +8 trust. Completion still requires Expand Technical Education and 40 political power."
 sr_project_education_specialists_tt:0 "On timely completion: +1% research speed and −3% army training time for 365 days, plus 3 trust. Completion still requires Expand Technical Education and 40 political power."
 sr_projects_6_title:0 "The First Certificate after Work"
 sr_projects_6_open_desc:0 "At the end of the first teaching week, one participant remains seated for a moment. Her notebook is open; she checks whether her name may really appear on the textbook’s title page. To the academy, it is one copy among many. To her, it is the first course that did not begin with a selection examination.\n\nThe academic year is open. Reassigned teachers return to an orderly network whose experience now benefits the institutes as well. Lito sees more than an extra statistical line: people can participate in common development without already belonging to the expected group."
 sr_projects_6_specialists_desc:0 "The first courses have sent trained specialists back to factories, institutes and military schools. Their reports are brief and practical: fewer misunderstandings over drawings, quicker equipment instruction and better technical training.\n\nThe program is complete and its benefits measurable. The second application list still contains names without one of the sought-after professions. Lito places both lists side by side. The Union has trained specialists. Its broader promise of education awaits another opportunity."
 sr_projects_6_failed_desc:0 "Desks stand in the planned classroom, but no complete curriculum is ready. Participants can individually explain what they lacked. Together, their reports describe a program that missed its deadline.\n\nThe extra burden on institutes ends. The initial budget does not return. Cancellation letters must be sent to people who had already exchanged shifts. The political damage appears on no equipment list, but Lito cannot overlook it."
 sr_projects_6_a:0 "The names not admitted also remain in the file."
 sr_projects_7_title:0 "Three Timetables for the Same Train"
 sr_projects_7_desc:0 "Railway administrations list three different arrival times. None is invented: each authority has examined only its own section. At the interchange, civilian goods and military supplies await the same shunting crew.\n\nLito funds coordination between republics, factories and army supply services. Reorganization initially ties up construction capacity. A priority rule must be chosen after ninety days; before the deadline, civilian supply routes and supplies to the front must fit together."
 sr_projects_7_a:0 "A train must not disappear at an administrative border."
 sr_project_supply_plan_tt:0 "The 240-day countdown began with the program. A priority choice follows after 90 days. Completion requires both Supply to the Front and Supply Routes of the Union, plus another 40 political power."
 sr_projects_8_title:0 "Who Gets the Next Track?"
 sr_projects_8_desc:0 "The first common timetables work until two urgent requests arrive. A republic demands dependable civilian delivery windows. The general staff demands the right to give military transport priority at any time. Both cite the same stationary train as evidence.\n\nBinding civilian schedules protect the economy and local responsibilities. Military priority reduces the army’s supply burden but makes civilian authorities dependent on exceptions. Lito must choose a rule the parties can actually apply."
 sr_projects_8_a:0 "Give the republics guaranteed civilian delivery windows."
 sr_projects_8_b:0 "The general staff receives supply priority."
 sr_project_supply_civil_tt:0 "On timely completion: +3% construction speed and −2% supply consumption for 365 days, plus 8 trust."
 sr_project_supply_military_tt:0 "On timely completion: −4% supply consumption and −1% construction speed for 365 days, plus 3 trust."
 sr_projects_9_title:0 "The First Train Arrives under the New Plan"
 sr_projects_9_civil_desc:0 "No grandstand watches its arrival. A shunting crew compares the wagon list with the common timetable and, for the first time, finds every expected handover in it. Military transports have fixed windows; civilian deliveries no longer need renegotiation after every exception.\n\nThe network is coordinated. For a year, it supports both construction and supply. Its success does not mean nobody argues anymore. The parties now know the shared rule against which their arguments can be judged."
 sr_projects_9_military_desc:0 "The general staff reports shorter delays. Supply officers can plan transport more reliably because military priorities no longer need explaining at every handover. Civilian administrations keep exact records of postponed delivery windows.\n\nThe program is complete. Army supply benefits more than under the civilian model; extra rescheduling remains visible in construction. Both reports arrive in the same folder on Lito’s desk. Neither disproves the other."
 sr_projects_9_failed_desc:0 "The common timetable remains a draft. Some interchanges use new rules, others the old ones. To participants, an incomplete transition is harder to explain than a clear decision.\n\nThe extra construction penalty ends with the program. The initial budget is spent. Army supply officers and republics must continue negotiating exceptions individually. Lito announced a connection on which nobody can yet rely."
 sr_projects_9_a:0 "Connections are judged by whether people can use them."
 sr_project_workshop_budget:0 "Specialists for the Workshop Network"
 sr_project_workshop_budget_desc:0 "Reassigned specialists and reorganization cost 2% factory output during the program. The penalty ends on completion, timeout or cancellation."
 sr_project_teacher_release:0 "Teachers for Evening Classes"
 sr_project_teacher_release_desc:0 "Institutes release teaching staff. During the program: −1% research speed. The penalty ends on completion, timeout or cancellation."
 sr_project_transport_budget:0 "Reorganizing the Timetables"
 sr_project_transport_budget_desc:0 "Coordination ties up construction capacity during the program: −2% construction speed. The penalty ends on completion, timeout or cancellation."
 sr_project_practical_councils:0 "Knowledge from the Workshops"
 sr_project_practical_councils_desc:0 "A workshop-led network spreads local experience: +3% factory output for 365 days."
 sr_project_standardized_workshops:0 "Uniform Director Standards"
 sr_project_standardized_workshops_desc:0 "Uniform procedures improve production but restrict local participation: +4% factory output and −1 percentage point stability for 365 days."
 sr_project_public_learning:0 "The Open Academic Year"
 sr_project_public_learning_desc:0 "Open evening classes and common teaching materials spread knowledge: +2% research speed for 365 days."
 sr_project_technical_cadres:0 "Trained Technical Cadres"
 sr_project_technical_cadres_desc:0 "Targeted courses support institutes and the armed forces: +1% research speed and −3% army training time for 365 days."
 sr_project_republic_timetables:0 "Binding Timetable Rights"
 sr_project_republic_timetables_desc:0 "Civilian delivery windows support construction and coordinate transport: +3% construction speed and −2% supply consumption for 365 days."
 sr_project_military_dispatch:0 "Priority for Military Supply"
 sr_project_military_dispatch_desc:0 "Military transport receives priority: −4% supply consumption but −1% construction speed for 365 days."
 sr_project_unfinished_program:0 "An Announced Program Left Unfinished"
 sr_project_unfinished_program_desc:0 "An expired government promise costs 2 percentage points stability for 180 days."
