 YUG_sr_edvard_kardelj:0 "Edvard Kardelj"
 YUG_sr_edvard_kardelj_desc:0 "The Slovenian communist Edvard Kardelj has studied how socialism and national equality can coexist. With Lito remaining in the Soviet Union, Kardelj leads the Yugoslav movement. He supports socialist cooperation but insists on separate institutions and an audible voice for the peoples of his homeland. Friendship with Moscow does not mean surrendering their say."
