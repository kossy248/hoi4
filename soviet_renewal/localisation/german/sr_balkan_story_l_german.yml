l_german:
 sr_bs_1_t:0 "Ein Brief, der nach Heimat riecht"
 sr_bs_1_d:0 "Zwischen Berichten über Stahlquoten liegt ein Brief aus Belgrad. Junge Gewerkschafter bitten Lito um Druckmaschinen, Stipendien und ein Kulturhaus. Am Rand steht handschriftlich: 'Du hast nicht vergessen, woher du kommst.'\n\nLito liest die Zeile zweimal. Sein Referent legt daneben die noch unbeantworteten Anträge der sowjetischen Republiken. Eine bevorzugte Hilfe für die Heimat wäre ein starkes politisches Signal. Dieselbe Geste könnte in Kiew und Tiflis wie ein gebrochenes Gleichheitsversprechen wirken. In 45 Tagen wird sich zeigen, wie die Räte reagieren."
 sr_bs_1_a:0 "Für die Heimat machen wir eine Ausnahme. (60 politische Macht)"
 sr_bs_1_b:0 "Ein Austauschprogramm zu gleichen Bedingungen. (20 politische Macht)"
 sr_bs_1_c:0 "Meine Verantwortung liegt vorerst in der Union."
 sr_bs_home_priority_tt:0 "In 45 Tagen reagieren die Republiken auf die Sonderbehandlung. Ein Ausgleich kostet weitere 50 politische Macht; die Verteidigung der Ausnahme schwächt das Vertrauen und erhöht gegebenenfalls den ukrainischen Widerstand."
 sr_bs_2_t:0 "Was in Belgrad beginnt, hört Kiew mit"
 sr_bs_2_priority_d:0 "Die Druckmaschinen sind angekommen. Aus Belgrad kommen dankbare Briefe; aus den Republiken kommen Zahlen. Ein ukrainischer Delegierter fragt, warum sein Werk auf neue Maschinen wartet, während Litos Heimat ein Sonderbudget erhält.\n\n'Ich widerspreche nicht der Hilfe', sagt er. 'Ich widerspreche dem Maßstab.' Lito kann einen Ausgleich finanzieren und die Sonderverwaltung beenden. Oder er verteidigt die Ausnahme und nimmt neue Ressentiments in Kauf."
 sr_bs_2_equal_d:0 "Der erste Austauschbericht enthält weder ein jugoslawisches Sonderbudget noch bevorzugte Stipendien. Belgrad ist enttäuscht über das Tempo, doch Delegierte aus mehreren Republiken haben ihre eigenen Bewerber entsandt.\n\nEin Kritiker der Regierung räumt ein: 'Diesmal galt dieselbe Regel auch für die Freunde des Vorsitzenden.' Das kleine Programm hat kaum eine Schlagzeile verdient. Gerade deshalb wirkt es glaubwürdig."
 sr_bs_2_distance_d:0 "Die Antwort aus Belgrad ist höflich und auffallend kurz. Das Kulturhaus bleibt geschlossen; einige Organisatoren wenden sich anderen Geldgebern zu. In Moskau ist das gesparte Geld längst verplant.\n\nLito legt den Brief in seine persönliche Schublade. Die Entscheidung hat die Verwaltung entlastet, aber den Genossen in der Heimat wenig erklärt. Politische Eigenständigkeit kann von außen wie Gleichgültigkeit aussehen."
 sr_bs_2_a:0 "Die Republiken bekommen einen Ausgleich. (50 politische Macht)"
 sr_bs_2_b:0 "Ich stehe zu dieser Ausnahme."
 sr_bs_2_c:0 "Eine gemeinsame Regel ist mehr wert als ein Sonderversprechen."
 sr_bs_2_e:0 "Wir tragen die Folgen unseres Abstands."
 sr_bs_3_t:0 "Diplomaten bitten um eine Erklärung"
 sr_bs_3_d:0 "In mehreren noch nicht kommunistischen Balkanstaaten werden sowjetische Bücher beschlagnahmt und Treffen linker Gewerkschafter überwacht. Die Botschafter sprechen von unerwünschter Einmischung. Die lokalen Parteien fragen dagegen, ob Moskaus neue Freundschaft die erste Polizeirazzia übersteht.\n\nDas Außenkommissariat schlägt ein öffentliches Kulturprogramm vor. Der Sicherheitsapparat bietet verdeckte Druckereien und Kurierwege an. Ein Rückzug würde sofort Kräfte freisetzen, aber die politische Arbeit schwächen. Nach 60 Tagen treffen die Berichte ein. Politische Wirkungen betreffen dann nur noch bestehende, friedliche, nicht kommunistische KI-Staaten unter den fünf Balkanpartnern."
 sr_bs_3_a:0 "Bücher, Stipendien und offene Türen. (50 politische Macht)"
 sr_bs_3_b:0 "Schützt die Arbeit im Untergrund. (100 politische Macht)"
 sr_bs_3_c:0 "Die Kontakte vorerst zurückfahren."
 sr_bs_cultural_choice_tt:0 "Nach 60 Tagen: +3 Prozentpunkte kommunistische Unterstützung in weiterhin geeigneten nicht kommunistischen Balkanpartnern; die Union erhält +1 % Forschung für 180 Tage und +3 Vertrauen."
 sr_bs_underground_choice_tt:0 "Nach 60 Tagen: +6 Prozentpunkte kommunistische Unterstützung und 180 Tage Einflussnetzwerk in weiterhin geeigneten nicht kommunistischen Balkanpartnern. Die Union verliert für 180 Tage täglich 0,15 politische Macht und 2 Prozentpunkte Stabilität."
 sr_bs_retreat_choice_tt:0 "Nach 60 Tagen: −2 Prozentpunkte kommunistische Unterstützung in weiterhin geeigneten nicht kommunistischen Balkanpartnern und −4 Vertrauen in der Union."
 sr_bs_4_t:0 "Ein Lesesaal ist noch keine Revolution"
 sr_bs_4_d:0 "Der Bericht erzählt von kleinen Erfolgen: eine gemeinsame Vorlesung, ein übersetztes Fachbuch, eine Gewerkschaftsbibliothek. Die Organisatoren müssen sich nicht länger nur in Hinterzimmern treffen. Regierungen können einen Lesesaal verbieten; jedes Verbot liefert aber eine Frage, die sie öffentlich beantworten müssen.\n\nIn den weiterhin geeigneten nicht kommunistischen Balkanpartnern wächst die kommunistische Unterstützung um drei Prozentpunkte. Der wissenschaftliche Austausch gibt der Union für 180 Tage einen kleinen Forschungsbonus. Es gibt keine neue Regierung, wohl aber eine belastbarere Verbindung."
 sr_bs_4_a:0 "Beziehungen entstehen auch ohne Ultimaten."
 sr_bs_5_t:0 "Die Druckerei unter der Bäckerei"
 sr_bs_5_d:0 "Die Kurierwege funktionieren. Flugblätter erreichen Fabriken, die keine offene Delegation empfangen würde. In den weiterhin geeigneten nicht kommunistischen Balkanpartnern wächst die kommunistische Unterstützung um sechs Prozentpunkte; die Netzwerke erhalten weitere 180 Tage Unterstützung.\n\nDoch ein beschlagnahmter Koffer enthält sowjetische Abrechnungen. Die Verbindung nach Moskau lässt sich kaum leugnen. Für 180 Tage kosten die diplomatische Abwehr und die innenpolitische Kritik täglich politische Kraft und etwas Stabilität. Litos wirksamerer Einfluss hat seinen Preis."
 sr_bs_5_a:0 "Wir helfen ihnen weiter. Und beantworten die Fragen."
 sr_bs_6_t:0 "Ein leerer Platz am Verhandlungstisch"
 sr_bs_6_d:0 "Die Kuriere berichten seltener, dann gar nicht mehr. Ein bulgarischer Gewerkschafter schreibt, seine Genossen hätten die Miete für ihr Büro selbst gesammelt. Sie wollen wissen, ob Moskaus Versprechen nur für ruhige Zeiten gelten.\n\nIn den weiterhin geeigneten nicht kommunistischen Balkanpartnern sinkt die kommunistische Unterstützung um zwei Prozentpunkte. In der Union erinnern Kritiker an Litos große Worte über internationale Solidarität. Der Rückzug hat Ressourcen gespart; Vertrauen spart er nicht."
 sr_bs_6_a:0 "Das war der Preis unserer Entscheidung."
 sr_bs_7_t:0 "Wer spricht für die Balkanföderation?"
 sr_bs_7_d:0 "Die Gründungsfeiern sind vorbei. Im Sitzungssaal des Föderalen Volksrats liegen fünf unterschiedliche Geschäftsordnungen auf dem Tisch. Kleine Republiken verlangen garantierte Stimmen, die großen erwarten Einfluss entsprechend ihrer Bevölkerung. Sowjetische Berater möchten vor allem schnelle Beschlüsse.\n\n'Wenn Föderation Mitsprache bedeutet', fragt eine Delegierte, 'warum dürfen wir dann unsere eigene Ordnung nicht schreiben?' Lito kann eine gewählte föderale Versammlung finanzieren. Oder er legt die entscheidenden Stellen in die Hand der sowjetischen Berater. In 120 Tagen wird die erste gemeinsame Haushaltsrunde zeigen, was das neue Bündnis trägt."
 sr_bs_7_a:0 "Die Versammlung bekommt Zeit und Mittel. (60 politische Macht)"
 sr_bs_7_b:0 "Unsere Berater sichern zunächst die Handlungsfähigkeit."
 sr_bs_8_t:0 "Der erste Haushalt gehört ihnen"
 sr_bs_8_d:0 "Die Haushaltsdebatte hat länger gedauert als geplant. Die Delegierten stritten um Häfen, Bahnlinien und Schulsprachen. Am Ende unterschrieben auch jene, die mit dem Ergebnis unzufrieden waren: Sie hatten Änderungsrechte und konnten Kompromisse durchsetzen.\n\nDer Volksrat schickt Lito keinen Treueschwur, sondern ein dickes Protokoll. Das ist das bessere Zeichen. Die weiterhin bestehende, friedliche sowjetische Balkanföderation erhält für 365 Tage zusätzliche Stabilität und Forschungsgeschwindigkeit. Litos Entscheidung stärkt zugleich das Vertrauen in sein föderales Versprechen."
 sr_bs_8_a:0 "Eine Unterschrift nach einem Streit kann halten."
 sr_bs_9_t:0 "Beschlüsse ohne Zustimmung"
 sr_bs_9_d:0 "Die sowjetischen Berater haben die Produktion beschleunigt. Die Beschwerde der Republiken enthält trotzdem denselben Satz in fünf Sprachen: 'Wir stimmen über Entscheidungen ab, die längst gefallen sind.' Mehrere Delegierte verlassen die Sitzung vor der Schlussabstimmung.\n\nLito kann die Beraterordnung jetzt durch eine finanzierte föderale Versammlung ersetzen. Das kostet mehr, als frühzeitig Mitsprache zuzulassen. Behält er die Ordnung bei, spart er politische Kraft, doch die Balkanföderation trägt ein Jahr lang zusätzliche Unzufriedenheit und Produktionsverluste."
 sr_bs_9_a:0 "Die Ordnung gemeinsam neu aushandeln. (80 politische Macht)"
 sr_bs_9_b:0 "Der Volksrat muss die Beschlüsse umsetzen."
 sr_bs_homeland_grants:0 "Sonderbudget für die Heimat"
 sr_bs_homeland_grants_desc:0 "Litos bevorzugte Hilfe für Jugoslawien bindet für 180 Tage täglich 0,10 politische Macht. Ein späterer Ausgleich für die Republiken kann die Sonderverwaltung vorzeitig beenden."
 sr_bs_equal_exchange:0 "Austausch zu gleichen Bedingungen"
 sr_bs_equal_exchange_desc:0 "Einheitliche Regeln erleichtern für 180 Tage die Pflege diplomatischer Beziehungen: −10 % Unterhaltskosten für verbesserte Beziehungen."
 sr_bs_cultural_front:0 "Offene Kulturkontakte"
 sr_bs_cultural_front_desc:0 "Ein öffentliches Balkan-Austauschprogramm erhöht die Forschungsgeschwindigkeit für 180 Tage um 1 %."
 sr_bs_exposed_operations:0 "Aufgedeckte Untergrundhilfe"
 sr_bs_exposed_operations_desc:0 "Die Folgen aufgedeckter sowjetischer Unterstützung binden für 180 Tage täglich 0,15 politische Macht und senken die Stabilität um 2 Prozentpunkte."
 sr_bs_republic_assembly:0 "Föderale Versammlung"
 sr_bs_republic_assembly_desc:0 "Die Balkanföderation erhält für 365 Tage eine finanzierte Vertretung ihrer Republiken: +5 Prozentpunkte Stabilität und +0,10 tägliche politische Macht."
 sr_bs_soviet_advisers:0 "Sowjetische Beraterordnung"
 sr_bs_soviet_advisers_desc:0 "Eine straffere Verwaltung erhöht den Fabrikausstoß für 365 Tage um 5 %, kostet aber 3 Prozentpunkte Stabilität. Nach 120 Tagen wird die fehlende Mitsprache zum politischen Streit."
 sr_bs_federal_compact:0 "Ein gemeinsam beschlossener Haushalt"
 sr_bs_federal_compact_desc:0 "Der erste eigenständig ausgehandelte Haushalt stärkt die Balkanföderation für 365 Tage: +3 Prozentpunkte Stabilität und +2 % Forschungsgeschwindigkeit."
 sr_bs_federal_discontent:0 "Übergangene Republiken"
 sr_bs_federal_discontent_desc:0 "Der verweigerte Verfassungskompromiss belastet die Balkanföderation für 365 Tage: −5 Prozentpunkte Stabilität und −5 % Fabrikausstoß."
