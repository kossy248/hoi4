 sr_balkan_yugoslavia_member_ready_tt:0 "Jugoslawien existiert, ist kommunistisch, KI-gesteuert und im Frieden; es ist unabhängig oder unser Untertan und führt keine Fraktion an. Mitglieder fremder Fraktionen treten vor der Vereinigung friedlich aus."
 sr_balkan_propaganda_yugoslavia:0 "Sozialistische Bewegung in Jugoslawien fördern"
 sr_balkan_propaganda_yugoslavia_desc:0 "Für 50 politische Macht unterstützen wir die sozialistische Bewegung in Jugoslawien. Die kommunistische Unterstützung steigt um 8 Prozentpunkte; ein Einflussnetzwerk wirkt 365 Tage. Alle 180 Tage wiederholbar. Nur bei einer KI-Regierung, Frieden mit uns und ohne fremde Oberherrschaft."
 sr_balkan_socialist_government_yugoslavia:0 "Sozialistische Regierungsbildung in Jugoslawien unterstützen"
 sr_balkan_socialist_government_yugoslavia_desc:0 "Ab 60 % kommunistischer Unterstützung helfen wir für 75 politische Macht bei der Bildung einer kommunistischen Regierung in Jugoslawien. Das Land bleibt zunächst eigenständig. Diese Entscheidung löst keinen Krieg aus und ist frühestens nach 365 Tagen erneut verfügbar."
