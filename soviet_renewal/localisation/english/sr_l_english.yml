l_english:
 SOV_cosif_kozs_lito:0 "Cosif Kozs Lito"
 SOV_cosif_kozs_lito_desc:0 "A revolutionary with Yugoslav roots who stayed in Russia and rose to lead the Soviet Union. Lito seeks a strong federal union. His central challenge is the tension between self-management and party power."
 sr_agricultural_cooperatives:0 "Agricultural Cooperatives"
 sr_agricultural_cooperatives_desc:0 "Reliable deliveries reduce the consumer goods factor by 2 percentage points."
 sr_balkan_exchange:0 "Scientific Exchange"
 sr_balkan_exchange_desc:0 "Ties with the Yugoslav homeland and its diaspora increase research speed by 5 percent."
 sr_central_coordination:0 "Central Coordination"
 sr_central_coordination_desc:0 "Factory output: +2.5%. Daily political power: −0.05."
 sr_civil_electronics_bonus:0 "Federal Electronics Research"
 sr_civil_industry_bonus:0 "Federal Industrial Research"
 sr_exp_charter_army:0 "Army in Service of the Union Charter"
 sr_exp_charter_army_desc:0 "Army organization: +2% for 730 days."
 sr_exp_civil_service:0 "A Comprehensible Administration"
 sr_exp_civil_service_desc:0 "Gain 0.05 daily political power for 730 days."
 sr_exp_development_school_bonus:0 "Experience of Federal Development"
 sr_exp_federal_legal_service:0 "Federal Legal Service"
 sr_exp_federal_legal_service_desc:0 "Stability: +3 percentage points; −0.03 daily political power for 730 days."
 sr_exp_field_medical_network:0 "Republic Medical Network"
 sr_exp_field_medical_network_desc:0 "Casualty trickleback: +3%; army organization recovery: +3% for 730 days."
 sr_exp_local_defence:0 "Local Defence Registers"
 sr_exp_local_defence_desc:0 "Core-territory defence: +3%; entrenchment speed: +3% for 730 days."
 sr_exp_maintenance_union:0 "Shared Maintenance Records"
 sr_exp_maintenance_union_desc:0 "Production efficiency growth: +3%; factory output: −1% for 730 days."
 sr_exp_officer_compact_bonus:0 "Lessons of the Common Front"
 sr_exp_petition_service:0 "An Open Petition Service"
 sr_exp_petition_service_desc:0 "Handling direct petitions costs 0.03 political power daily for 365 days."
 sr_exp_repair_columns:0 "Mobile Repair Columns"
 sr_exp_repair_columns_desc:0 "Supply consumption: −3%; factory output: −1% for 730 days."
 sr_exp_signals_bonus:0 "Common Signals Technology"
 sr_exp_translation_chambers:0 "Republic Translation Chambers"
 sr_exp_translation_chambers_desc:0 "Stability: +2 percentage points; −0.03 daily political power for 365 days."
 sr_exp_workplace_charter:0 "Federal Workplace Statute"
 sr_exp_workplace_charter_desc:0 "Stability: +2 percentage points; factory output: +2%; −0.03 daily political power for 730 days."
 sr_exp_workshop_standard_bonus:0 "Common Workshop Standards"
 sr_federal_charter:0 "Federal Union Charter"
 sr_federal_charter_desc:0 "Binding procedures facilitate cooperation. Daily political power: +0.10."
 sr_federal_planning:0 "Federal Investment Planning"
 sr_federal_planning_desc:0 "Joint investment increases construction speed by 5%."
 sr_industrial_research:0 "Federal Industrial Research"
 sr_lito_academy_network:0 "Connect the Academies"
 sr_lito_academy_network_desc:0 "A common research program grants one 50% industrial research bonus. After Agitprop of the Peoples, unlock one additional original Agitprop poster slot."
 sr_lito_academy_network_research_bonus:0 "Connect the Academies: Research Support"
 sr_lito_agricultural_cooperatives:0 "Agricultural Cooperatives"
 sr_lito_agricultural_cooperatives_desc:0 "The cooperatives are ready, but villages want to know who controls their grain. Choose paid delivery contracts or a central procurement quota. Both establish the supply network, with different effects on trust and short-term output."
 sr_lito_air_close_support:0 "Above the Ground Forces"
 sr_lito_air_close_support_desc:0 "Lito prioritizes support at the front: ground attack +5%. This focus excludes specialization in interception."
 sr_lito_air_command:0 "An Air Force for the Union"
 sr_lito_air_command_desc:0 "Between two record-breaking bulletins lies an accident report. The air force review still grants experience; we then allocate scarce resources between spare parts and additional training flights. Funding does not cover both."
 sr_lito_air_ground_crews:0 "Maintenance Before Records"
 sr_lito_air_ground_crews_desc:0 "Good maintenance permanently reduces air accidents by 5% and increases air mission efficiency by 2%."
 sr_lito_air_ground_support:0 "Flying Support"
 sr_lito_air_ground_support_desc:0 "The air force concentrates on supporting ground forces: ground attack +5%."
 sr_lito_air_interception:0 "Protect Union Skies"
 sr_lito_air_interception_desc:0 "Lito prioritizes airspace protection: interception efficiency +5%. This focus excludes specialization in ground support."
 sr_lito_air_interceptors:0 "Guardians of Union Skies"
 sr_lito_air_interceptors_desc:0 "The air force concentrates on interception: interception efficiency +5%."
 sr_lito_air_joint_command:0 "Joint Air Planning"
 sr_lito_air_joint_command_desc:0 "A temporary planning program reduces air doctrine costs by 5%."
 sr_lito_air_joint_planning:0 "Joint Operational Planning"
 sr_lito_air_joint_planning_desc:0 "Air doctrine costs are reduced by 5% for 730 days. The new planning also grants 10 air experience."
 sr_lito_air_maintenance:0 "Reliable Ground Crews"
 sr_lito_air_maintenance_desc:0 "Good maintenance reduces air accidents by 5% and increases air mission efficiency by 2%."
 sr_lito_air_observation:0 "Connect Air Observation"
 sr_lito_air_observation_desc:0 "Following the chosen specialization, a common reporting system improves air detection by 5% for 730 days and grants 15 air experience."
 sr_lito_air_observation_network:0 "Connected Air Observation"
 sr_lito_air_observation_network_desc:0 "Sharing observation reports increases air detection by 5%."
 sr_lito_air_operational_readiness:0 "From Airfield to Operation"
 sr_lito_air_operational_readiness_desc:0 "For 1095 days, air fuel consumption falls by 5% and air mission efficiency increases by 2%. We gain 20 air experience."
 sr_lito_air_pilots:0 "Joint Pilot Schools"
 sr_lito_air_pilots_desc:0 "Joint training standards reduce air accidents by 10% for 730 days."
 sr_lito_air_readiness:0 "Operational Air Formations"
 sr_lito_air_readiness_desc:0 "Prepared formations consume 5% less fuel and gain 2% air mission efficiency."
 sr_lito_air_training:0 "Joint Pilot Schools"
 sr_lito_air_training_desc:0 "A temporary training program reduces air accidents by 10%."
 sr_lito_army_artillery:0 "Fire Plans Instead of Isolated Orders"
 sr_lito_army_artillery_desc:0 "Coordinated artillery fire grants 20 army experience and 5% artillery attack for 730 days."
 sr_lito_army_citizens_charter:0 "The Soldier Remains a Citizen"
 sr_lito_army_citizens_charter_desc:0 "The new military oath invokes a Union of peoples. The general staff asks whether complaints against commanders will therefore face civilian review. An event defines the relationship between discipline and citizens’ rights."
 sr_lito_army_combined_arms:0 "Infantry and Armor Together"
 sr_lito_army_combined_arms_desc:0 "Joint operational procedures increase army organization by 3% and division speed by 2%."
 sr_lito_army_homeland_defence:0 "Defend Every Republic"
 sr_lito_army_homeland_defence_desc:0 "Defense on core territory and entrenchment speed increase by 5% each for 1095 days."
 sr_lito_army_in_union_service:0 "Arms Serve the Charter"
 sr_lito_army_in_union_service_desc:0 "The reform ends without a new military rank for Lito. The armed forces reaffirm their duties toward every republic. Gain 3 preservation points, 3 trust and 2% army organization for 730 days."
 sr_lito_army_officers:0 "Officers for the Federation"
 sr_lito_army_officers_desc:0 "An exercise report contradicts the general staff’s success bulletin. Officer schools will open; Lito must decide whether frontline initiative or reliable central operational plans shape their teaching."
 sr_lito_army_readiness:0 "Maneuvers of All Republics"
 sr_lito_army_readiness_desc:0 "Union-wide maneuvers grant 25 army experience and 5 percentage points of war support."
 sr_lito_army_review:0 "Review the Red Army"
 sr_lito_army_review_desc:0 "Lito orders a review of training and leadership, granting 25 army experience."
 sr_lito_army_staff:0 "Federal General Staff"
 sr_lito_army_staff_desc:0 "Coordinated staff work reduces land doctrine costs by 5% and increases planning speed by 5%."
 sr_lito_army_staff_work:0 "A Federal General Staff"
 sr_lito_army_staff_work_desc:0 "The new general staff reduces land doctrine costs by 5% and increases planning speed by 5%."
 sr_lito_army_supply:0 "Supply to the Front"
 sr_lito_army_supply_desc:0 "Responsibilities and transport plans are standardized, permanently reducing supply consumption by 5%."
 sr_lito_artillery_coordination:0 "Coordinated Artillery"
 sr_lito_artillery_coordination_desc:0 "Joint fire planning temporarily increases artillery attack by 5%."
 sr_lito_balkan_cooperation:0 "Coordinate the Balkan Movements"
 sr_lito_balkan_cooperation_desc:0 "Political contacts form a joint forum for scientific and organizational exchange. Gain 5 preservation points and one 50 percent research bonus for industrial technology. Participating countries retain their own governments and factions."
 sr_lito_balkan_diplomacy:0 "Diplomacy Among Equals"
 sr_lito_balkan_diplomacy_desc:0 "Maintaining improved relations costs 10 percent less political power."
 sr_lito_balkan_forum:0 "A Forum for the Balkans"
 sr_lito_balkan_forum_desc:0 "Albania and Romania are invited to cooperate. Mutual opinion with existing countries increases by 25. Gain 2.5 percentage points of stability and 3 preservation points. Invitations force neither membership nor territorial change."
 sr_lito_balkan_influence_network:0 "Socialist Contact Networks"
 sr_lito_balkan_influence_network_desc:0 "Political contacts and organizational support strengthen communist influence for 365 days. Daily communist support: +0.02. No automatic change of government."
 sr_lito_balkan_partnership:0 "A Partnership of Equals"
 sr_lito_balkan_partnership_desc:0 "We seek cooperation with Yugoslavia, Bulgaria and Greece. Existing countries gain 25 mutual opinion points. Maintaining improved relations costs 10 percent less. This excludes regional coercion and does not annex or subordinate anyone. A subsequent exchange of letters tests our commitment to equality."
 sr_lito_balkan_research:0 "Joint Industrial Research"
 sr_lito_balkan_solidarity:0 "Willingness to Cooperate"
 sr_lito_belgrade:0 "Bridges to Belgrade"
 sr_lito_belgrade_desc:0 "Scientific and cultural ties with the homeland and its diaspora enrich our institutes. Scientific exchange grants 5 percent research speed."
 sr_lito_cadre_schools:0 "Cadres for the Federation"
 sr_lito_cadre_schools_desc:0 "Trained administrators facilitate coordination: +0.05 daily political power."
 sr_lito_central_coordination:0 "Central Coordination"
 sr_lito_central_coordination_desc:0 "Common production targets increase factory output by 2.5% but cost 0.05 political power daily. Also gain 3 preservation points. This course excludes autonomous republic budgets."
 sr_lito_central_mandate:0 "Mandate from Party Headquarters"
 sr_lito_central_mandate_desc:0 "Daily political power: +0.10. Stability: −2.5 percentage points."
 sr_lito_citizen_letters:0 "Letters without an Official Seal"
 sr_lito_citizen_letters_desc:0 "A second entrance opens at the mail office: complaints may reach government without approval from the local party bureau. Gain 3 trust and 2 preservation points; the petition service costs 0.03 political power daily for 365 days."
 sr_lito_civil_compact:0 "Unite Knowledge and Prosperity"
 sr_lito_civil_compact_bonus:0 "Federal Development Program"
 sr_lito_civil_compact_desc:0 "Economy and research pool their experience. Two additional 50% industrial research bonuses support further development."
 sr_lito_combined_arms:0 "Combined Arms"
 sr_lito_combined_arms_desc:0 "Joint procedures increase army organization by 3% and division speed by 2%."
 sr_lito_common_assembly_halls:0 "A Common Assembly Hall"
 sr_lito_common_assembly_halls_desc:0 "Several republics share a production order rather than competing through parallel small batches. Build a civilian factory in a suitable owned, controlled core. If there is no suitable space, gain 50 political power."
 sr_lito_congress:0 "One Union, Many Peoples"
 sr_lito_congress_desc:0 "A joint congress opens Lito’s federal program: party, republics, economy and defence must find a common course."
 sr_lito_constitutional_guarantees:0 "Secure Constitutional Rights"
 sr_lito_constitutional_guarantees_desc:0 "Reliable procedures ease regional conflicts. Resistance in each represented republic: −5; stability: +3 percentage points."
 sr_lito_council_mandate:0 "Mandate from the Councils"
 sr_lito_council_mandate_desc:0 "Council participation adds 2.5 percentage points of stability."
 sr_lito_course:0 "Lito’s New Course"
 sr_lito_course_desc:0 "Cosif Kozs Lito calls for a socialist union of equal peoples."
 sr_lito_danube_workshops:0 "Workshops for the Great Connection"
 sr_lito_danube_workshops_desc:0 "From the Danube to the Dnieper, machines use incompatible spare parts. A common workshop program connects production regions. Gain one 50% industrial research bonus and 15 political power."
 sr_lito_defence_council:0 "A Joint Defence Council"
 sr_lito_defence_council_desc:0 "Army, air force and navy coordinate operational planning. Each service gains 25 experience."
 sr_lito_defence_industrial_compact:0 "Armaments under Federal Contract"
 sr_lito_defence_industrial_compact_desc:0 "The army orders to common standards while factories retain their civilian representation. Build a military factory in a suitable owned, controlled core. If no suitable space exists, gain 50 political power."
 sr_lito_defence_preparation:0 "Prepared Homeland Defense"
 sr_lito_defence_preparation_desc:0 "Prepared defensive plans increase defense on core territory and entrenchment speed by 5% each."
 sr_lito_development_school:0 "The Blueprint Travels On"
 sr_lito_development_school_desc:0 "Engineers now travel with the previous factory’s error reports as well as its orders. Two 50% industrial research bonuses help the next republic avoid repeating those mistakes."
 sr_lito_electronics_laboratories:0 "Electronics Laboratories"
 sr_lito_electronics_laboratories_desc:0 "The new laboratories bring civilian researchers and intelligence officers together. The electronics bonus remains; we must choose between open research and military secrecy. Laboratory directors report again four months later."
 sr_lito_electronics_laboratories_research_bonus:0 "Electronics Laboratories: Research Support"
 sr_lito_federal_civil_service:0 "The State Must Explain Itself"
 sr_lito_federal_civil_service_desc:0 "A Kazakh village secretary and a Georgian teacher should be able to explain the same decree. A federal administrative school replaces contradictory circulars with comprehensible procedures. Gain 0.05 daily political power for 730 days."
 sr_lito_federal_officer_compact:0 "The School of the Common Front"
 sr_lito_federal_officer_compact_desc:0 "The officer college publishes contradictory exercise reports. They become a common doctrine that does not confuse criticism with disloyalty. Gain two 50% land doctrine cost reductions and 10 army experience."
 sr_lito_federal_plan:0 "Plan Together, Decide Locally"
 sr_lito_federal_plan_desc:0 "A common investment framework increases construction speed by 5% and grants two 50% industrial research bonuses."
 sr_lito_federal_plan_research_bonus:0 "Plan Together, Decide Locally: Research Support"
 sr_lito_federal_resolution:0 "The Charter Holds"
 sr_lito_federal_resolution_desc:0 "Party and republics reaffirm their shared order. Resistance in each represented republic: −5; also gain 5 preservation points."
 sr_lito_federal_unity:0 "Unity Through Participation"
 sr_lito_federal_unity_desc:0 "The Union Charter proves itself in practice. Resistance in each represented republic: −5; also gain 5 preservation points."
 sr_lito_federal_universities:0 "Federal Research Universities"
 sr_lito_federal_universities_desc:0 "The expanded university network creates one additional research slot."
 sr_lito_field_hospitals_compact:0 "No One Is Left Nameless"
 sr_lito_field_hospitals_compact_desc:0 "Medical posts compare casualty records across republics and share experience. For 730 days, casualty trickleback and army organization recovery increase by 3%. This affects manpower recovery rather than automatically restoring divisions."
 sr_lito_field_logistics:0 "Supply to the Front"
 sr_lito_field_logistics_desc:0 "Common supply procedures reduce supply consumption by 5%."
 sr_lito_front_and_home:0 "Between the Front and the Kitchen Table"
 sr_lito_front_and_home_desc:0 "A soldier’s letter and a worker family’s petition describe the same supply order from different directions. An event has Lito allocate resources between military readiness and burdens on families. Both choices temporarily change the army."
 sr_lito_homeland:0 "Remember the Homeland"
 sr_lito_homeland_desc:0 "Lito’s Yugoslav origins shape his foreign policy. If Yugoslavia exists, mutual opinion improves by 40. Also gain 50 political power."
 sr_lito_independent_socialism:0 "An Independent Socialism"
 sr_lito_independent_socialism_desc:0 "The Union determines its own foreign policy. A joint staff reviews our security situation. Gain 15 army experience and 3 percentage points of war support."
 sr_lito_industrial_towns:0 "A Factory Is Not Yet a Town"
 sr_lito_industrial_towns_desc:0 "The new factory appears in the plan; housing, a school and a meeting hall do not. An event decides whether the settlement becomes a community immediately or initially serves only its production order. For Lito, development becomes a social decision."
 sr_lito_industrial_union:0 "Industry for the Union"
 sr_lito_industrial_union_desc:0 "Add one military factory to federal industry if an owned, controlled core state has room. Otherwise gain 50 political power."
 sr_lito_influence_albania:0 "Political Contacts in Albania"
 sr_lito_influence_albania_desc:0 "Political ties with Albania strengthen its communist party by up to 10 percentage points. For 365 days, networks support its daily ideological development. Mutual opinion increases by 25. This focus changes no government and forces neither a coup nor faction membership."
 sr_lito_influence_bulgaria:0 "Strengthen the Bulgarian Left"
 sr_lito_influence_bulgaria_desc:0 "Political ties with Bulgaria strengthen its communist party by up to 10 percentage points. For 365 days, networks support its daily ideological development. Mutual opinion increases by 25. This focus changes no government and forces neither a coup nor faction membership."
 sr_lito_influence_greece:0 "Support the Greek Workers’ Movement"
 sr_lito_influence_greece_desc:0 "Political ties with Greece strengthen its communist party by up to 10 percentage points. For 365 days, networks support its daily ideological development. Mutual opinion increases by 25. This focus changes no government and forces neither a coup nor faction membership."
 sr_lito_influence_romania:0 "Socialist Networks in Romania"
 sr_lito_influence_romania_desc:0 "Political ties with Romania strengthen its communist party by up to 10 percentage points. For 365 days, networks support its daily ideological development. Mutual opinion increases by 25. This focus changes no government and forces neither a coup nor faction membership."
 sr_lito_influence_yugoslavia:0 "Ties with the Yugoslav Workers’ Movement"
 sr_lito_influence_yugoslavia_desc:0 "Political ties with Yugoslavia strengthen its communist party by up to 10 percentage points. For 365 days, networks support its daily ideological development. Mutual opinion increases by 25. This focus changes no government and forces neither a coup nor faction membership."
 sr_lito_joint_coordination:0 "Joint Coordination Staff"
 sr_lito_joint_coordination_desc:0 "A temporary coordination program increases research speed by 2%."
 sr_lito_knowledge_for_all:0 "Knowledge for the Future"
 sr_lito_knowledge_for_all_desc:0 "Shared knowledge accelerates the next generation of technology: two 50% electronics research bonuses."
 sr_lito_knowledge_for_all_research_bonus:0 "Knowledge for the Future: Research Support"
 sr_lito_living_constitution:0 "No One Owns the Charter"
 sr_lito_living_constitution_desc:0 "The constitution now reaches schools, barracks and local offices. Its meaning must be discussed where people depend on it. A federal legal service gives 3 percentage points stability for 730 days but costs 0.03 political power daily."
 sr_lito_local_budgets:0 "Autonomous Republic Budgets"
 sr_lito_local_budgets_desc:0 "Regional budget rights grant 2.5 percentage points stability but slow union-wide construction by 2%. This course excludes central coordination."
 sr_lito_local_defence_registers:0 "Every Village Knows the Assembly Point"
 sr_lito_local_defence_registers_desc:0 "The defence map now includes schools, bridges and communal depots. Local offices plan with the army rather than waiting for an emergency. For 730 days: +3% core-territory defence and +3% entrenchment speed."
 sr_lito_local_investment:0 "Regional Investment Funds"
 sr_lito_local_investment_desc:0 "Build one civilian factory in an owned, controlled core state with room. If no suitable space exists, gain 50 political power instead."
 sr_lito_maintenance_union:0 "The Machine Must Run Tomorrow"
 sr_lito_maintenance_union_desc:0 "Maintenance records are shared instead of disappearing behind the next success bulletin. Spares and training cost output today but prevent stoppages tomorrow. For 730 days: +3% production efficiency growth and −1% factory output."
 sr_lito_mobile_repair_columns:0 "Workshops behind the Front"
 sr_lito_mobile_repair_columns_desc:0 "Mechanics from civilian factories accompany supply columns. The army saves 3% supply consumption for 730 days, while the detached specialists cost 1% factory output."
 sr_lito_native_agitprop_academy_slot_tt:0 "After Agitprop of the Peoples: one additional original Agitprop poster slot and the knowledge and youth campaigns."
 sr_lito_native_agitprop_councils_slot_tt:0 "After Agitprop of the Peoples: one additional original Agitprop poster slot and the collectivist campaign."
 sr_lito_native_agitprop_ready_tt:0 "The Lito installer successfully prepared the original Agitprop files."
 sr_lito_naval_crew_training:0 "Trained Ship Crews"
 sr_lito_naval_crew_training_desc:0 "A temporary training program increases naval organization by 5%."
 sr_lito_naval_escorts:0 "Protected Sea Lanes"
 sr_lito_naval_escorts_desc:0 "Experienced escort formations increase convoy escort efficiency by 5%."
 sr_lito_naval_fuel:0 "Efficient Fleet Management"
 sr_lito_naval_fuel_desc:0 "Coordinated sailing and supply plans reduce naval fuel consumption by 5%."
 sr_lito_naval_interdiction:0 "Trained Commerce Raiders"
 sr_lito_naval_interdiction_desc:0 "Improved procedures increase convoy raiding efficiency by 5%."
 sr_lito_naval_observation:0 "Shared Naval Situation Picture"
 sr_lito_naval_observation_desc:0 "Shared observations increase naval coordination by 3%."
 sr_lito_naval_production:0 "Coordinated Dockyard Work"
 sr_lito_naval_production_desc:0 "Common production standards increase dockyard output by 5%."
 sr_lito_naval_readiness:0 "Cooperating Fleets"
 sr_lito_naval_readiness_desc:0 "Joint maneuvers increase naval organization by 3%."
 sr_lito_navy_crews:0 "Train Sailors Together"
 sr_lito_navy_crews_desc:0 "A joint training program improves naval organization by 5% for 730 days."
 sr_lito_navy_dockyards:0 "Coordinate Union Dockyards"
 sr_lito_navy_dockyards_desc:0 "Common standards permanently increase dockyard output by 5%."
 sr_lito_navy_escorts:0 "Protect the Convoys"
 sr_lito_navy_escorts_desc:0 "Joint escort exercises permanently increase convoy escort efficiency by 5%."
 sr_lito_navy_fuel:0 "Fuel for the Fleets"
 sr_lito_navy_fuel_desc:0 "Coordinated sailing plans permanently reduce naval fuel consumption by 5%."
 sr_lito_navy_interdiction:0 "Disrupt Enemy Supply"
 sr_lito_navy_interdiction_desc:0 "Convoy raiding efficiency increases by 5% for 730 days. Trials grant 15 navy experience."
 sr_lito_navy_joint_exercises:0 "Joint Fleet Maneuvers"
 sr_lito_navy_joint_exercises_desc:0 "Major maneuvers grant 35 navy experience and increase naval organization by 3% for 1095 days."
 sr_lito_navy_observation:0 "A Shared Naval Situation Picture"
 sr_lito_navy_observation_desc:0 "Sharing observations improves naval coordination by 3% for 730 days."
 sr_lito_navy_review:0 "Review the Fleets"
 sr_lito_navy_review_desc:0 "The admirals present two maps: one showing the Union’s presence at sea, the other threatened merchant routes. The fleet review grants experience; the following discussion sets its political priority."
 sr_lito_notebook:0 "The Pages Lito Kept"
 sr_lito_notebook_desc:0 "A battered notebook contains workshops, border stations and comrades’ names rather than state plans. Editors want to make it the story of the new Union. An event decides whether its doubts and mistakes will also be published."
 sr_lito_oath_to_peoples:0 "An Oath to the Peoples"
 sr_lito_oath_to_peoples_desc:0 "New officials pledge loyalty neither to a portrait nor to one republic. Their oath concerns the shared charter. Gain 3 percentage points war support and 3 preservation points."
 sr_lito_officer_schools:0 "Practical Officer Training"
 sr_lito_officer_schools_desc:0 "A temporary training program reduces army training time by 5%."
 sr_lito_polish_frontier:0 "The Polish Frontier Question"
 sr_lito_polish_frontier_desc:0 "We prepare a forcible reordering in the west. Gain a 730-day annexation war goal against an existing Poland that is not our subject. This declares no war and is unavailable during an ongoing war with Poland."
 sr_lito_political_contacts:0 "Socialist Political Contacts"
 sr_lito_politics_accountability:0 "Accountability to the Union"
 sr_lito_politics_accountability_desc:0 "The leadership publicly accounts for its promises. Debate adds 3 percentage points of stability but reduces war support by 2 percentage points."
 sr_lito_politics_anti_corruption:0 "Review the Privileges"
 sr_lito_politics_anti_corruption_desc:0 "A sealed dossier names the very comrades who enabled Lito’s rise. An independent investigation costs political power and burdens administration. A limited inquiry protects party leadership but damages trust in its promise of equality."
 sr_lito_politics_cadre_schools:0 "Agitprop of the Peoples"
 sr_lito_politics_cadre_schools_desc:0 "Lito brings political education and poster campaigns together in a common Agitprop bureau. The republics’ languages and experiences shape its public work. Opens the Soviet Agitprop campaigns and grants 0.05 daily political power."
 sr_lito_politics_central_mandate:0 "A Mandate from Party Headquarters"
 sr_lito_politics_central_mandate_desc:0 "A strong headquarters speeds political decisions. Gain 50 political power and another 0.10 daily. The price is 5 points toward breakdown and a stability penalty of 2.5 percentage points. This excludes the council mandate."
 sr_lito_politics_constitution:0 "The Federal Constitution"
 sr_lito_politics_constitution_desc:0 "A binding constitutional framework defines the rights of the party, councils and republics. Gain 5 preservation points and reduce each represented republic’s resistance by 5."
 sr_lito_politics_council_mandate:0 "A Mandate from the Councils"
 sr_lito_politics_council_mandate_desc:0 "Lito binds his leadership to council consent. Spend 50 political power, gain 5 preservation points and reduce resistance in every represented republic by 5. The national spirit adds 2.5 percentage points of stability. This excludes a central party mandate."
 sr_lito_politics_mandate:0 "Lito’s Political Legacy"
 sr_lito_politics_mandate_desc:0 "Lito’s government has established its own institutional foundation. Gain 2.5 percentage points each of stability and war support."
 sr_lito_politics_party_congress:0 "A Mandate for Lito"
 sr_lito_politics_party_congress_desc:0 "A party congress endorses Cosif Kozs Lito’s leadership and an explicit political program. Gain 75 political power."
 sr_lito_polytechnic_institutes:0 "Polytechnic Institutes"
 sr_lito_polytechnic_institutes_desc:0 "Combining teaching with applied science increases research speed by 2.5%."
 sr_lito_pressure_doctrine:0 "Regional Pressure"
 sr_lito_pressure_doctrine_desc:0 "War justifications take 5 percent less time."
 sr_lito_public_memory:0 "The Memory of the Union"
 sr_lito_public_memory_desc:0 "Archives collect workers’ letters and records of failed negotiations beside government declarations. The Union should not have to reinvent its history after every change of leadership. Gain 5 trust and 2 percentage points stability."
 sr_lito_ratify_compromise:0 "Ratify the Federal Compromise"
 sr_lito_ratify_compromise_desc:0 "After choosing an economic framework, the republics ratify their common order. Resistance in each represented republic: −5; also gain 5 preservation points."
 sr_lito_regional_pressure:0 "Build Regional Pressure"
 sr_lito_regional_pressure_desc:0 "Lito prepares a more assertive course. Gain 50 political power and 5 percentage points of war support but lose 3 percentage points of stability. War justifications take 5 percent less time. This excludes a partnership of equals and declares no war."
 sr_lito_regional_workshops:0 "Workshops of the Republics"
 sr_lito_regional_workshops_desc:0 "Build another civilian factory in an owned, controlled core state with room. Otherwise gain 50 political power."
 sr_lito_republic_congress:0 "Hear the Republics"
 sr_lito_republic_congress_desc:0 "A common congress opens negotiations: +50 political power and 3 points toward preserving the Union. Delegations from Ukraine, Georgia and Kazakhstan subsequently present specific demands."
 sr_lito_research_exchange:0 "Researchers Across the Republics"
 sr_lito_research_exchange_desc:0 "Exchange programs increase research speed by a further 2.5%."
 sr_lito_scientific_standards:0 "Common Technical Standards"
 sr_lito_scientific_standards_desc:0 "Common procedures ease technology transfer. Gain one 50% industrial research bonus."
 sr_lito_scientific_standards_research_bonus:0 "Common Technical Standards: Research Support"
 sr_lito_shared_defence:0 "Shared Defence Obligations"
 sr_lito_shared_defence_desc:0 "The republics coordinate defence: +15 army experience and +3 percentage points war support."
 sr_lito_shared_prosperity:0 "Shared Prosperity"
 sr_lito_shared_prosperity_desc:0 "Visible results strengthen confidence in the new economy: +3 percentage points stability and two 25% industrial research bonuses."
 sr_lito_shared_prosperity_research_bonus:0 "Shared Prosperity: Research Support"
 sr_lito_signals_of_republics:0 "Many Languages, One Signal"
 sr_lito_signals_of_republics_desc:0 "An order must not fail because of a radio operator’s accent. Common signal tables and technical courses connect units from all republics. Gain one 50% electronics research bonus."
 sr_lito_slavic_consolidation:0 "Consolidate the Greater Federation"
 sr_lito_slavic_consolidation_desc:0 "After proclaiming the Socialist Federal Slavic Union, its institutions must work together. Gain 5 percentage points stability and 10 preservation points; resistance in each represented republic falls by 5."
 sr_lito_socialist_partnership:0 "The Union Acts Independently"
 sr_lito_socialist_partnership_desc:0 "A joint scientific coordination staff supports our chosen foreign policy. Gain 2% research speed for 730 days."
 sr_lito_straits_question:0 "The Straits Question"
 sr_lito_straits_question_desc:0 "Our assertive course now turns toward Turkey. Gain a 730-day annexation war goal against an existing Turkey that is not our subject. It covers Turkey rather than only the straits and declares no war."
 sr_lito_succession_charter:0 "A Constitution after Lito"
 sr_lito_succession_charter_desc:0 "One name is absent from the draft constitution: the successor. Lito must choose whether future leadership rests on a controlled party headquarters or a binding federal procedure. The event establishes institutions and changes trust and political capacity."
 sr_lito_supply_corridors:0 "Union Supply Routes"
 sr_lito_supply_corridors_desc:0 "Add one infrastructure level in an owned, controlled core state where another level is possible. Otherwise gain 50 political power."
 sr_lito_technical_education:0 "Expand Technical Education"
 sr_lito_technical_education_desc:0 "Broader education supports the federal social contract: +3 percentage points stability and +50 political power."
 sr_lito_translation_chambers:0 "A Rostrum for Every Accent"
 sr_lito_translation_chambers_desc:0 "A speech is no participation when only the capital understands its language. Translation chambers make republican petitions accessible. For 365 days: +2 percentage points stability but −0.03 daily political power; also gain 3 trust."
 sr_lito_union_charter:0 "A New Union Charter"
 sr_lito_union_charter_desc:0 "Binding procedures give the republics a voice. Daily political power: +0.10; also gain 5 preservation points."
 sr_lito_union_future:0 "Preserve the Union"
 sr_lito_union_future_desc:0 "Lito’s program unites federal cohesion, development and common defence. Gain 5 percentage points stability and 10 preservation points. A final report recalls the decisions on which this Union rests."
 sr_lito_union_reserve:0 "A Winter in the State Reserve"
 sr_lito_union_reserve_desc:0 "The development plan promises new factories; reserve administrators warn of one bad winter. An event allocates scarce resources between a common emergency reserve and immediate expansion. Both courses have an economic price."
 sr_lito_workers_councils:0 "Councils in the Factories"
 sr_lito_workers_councils_desc:0 "A factory assembly disputes Lito’s promise: do workers decide, or does the director retain the final word? Workers’ self-management remains; an event determines its practical form. A first report follows after three months. After Agitprop of the Peoples, unlock one additional original Agitprop poster slot."
 sr_lito_workplace_charter:0 "A Shift Ends with a Right"
 sr_lito_workplace_charter_desc:0 "A production contract also needs rules on accidents, shifts and complaints. A common workplace statute gives 2 percentage points stability and 2% factory output for 730 days. Its administration costs 0.03 political power daily."
 sr_local_budgets:0 "Autonomous Republic Budgets"
 sr_local_budgets_desc:0 "Stability: +2.5 percentage points. Construction speed: −2%."
 sr_polytechnic_network:0 "Polytechnic Network"
 sr_polytechnic_network_desc:0 "Research speed: +2.5%."
 sr_scientific_exchange:0 "Federal Researcher Exchange"
 sr_scientific_exchange_desc:0 "Research speed: +2.5%."
 sr_soviet_tree:0 "Lito’s Union"
 sr_workers_councils:0 "Workers’ Self-Management"
 sr_workers_councils_desc:0 "Workers’ councils coordinate factory operations. Factory output: +5%."
 sr_yugoslav_friendship:0 "Lito’s Yugoslav Ties"
 titoism:0 "Titoism"
 titoism_desc:0 "Titoism combines socialist ownership with workers’ self-management, federal participation and an independent foreign policy. Shared interests should hold the Union together, but self-management remains in tension with the power of the communist party."
