 sr_union_council:0 "Lito’s Union Council"
 sr_union_council_desc:0 "The shared balance represents cohesion among all represented Union republics. Each republic council strengthens preservation and protects its republic from its monthly breakdown contribution for 180 days.\n\nMonthly: 0.5 points toward breakdown, plus 0.2 for each represented republic without a current council. War and stability below 40% each cost 1 additional point; stability above 60% gives 1 point toward preservation.\n\nRussia, Ukraine, Belarus, Georgia, Armenia, Azerbaijan, Kazakhstan, Uzbekistan, Turkmenistan, Kyrgyzstan and Tajikistan belong to this timeline’s early federal reform. Estonia, Latvia, Lithuania and Moldavia are represented only while the Soviet Union owns their core territory. Yugoslavia is a potential partner, not a Union republic.\n\nThe far left brings severe crisis penalties. Republics do not automatically secede as a result.\n\nResistance (0–100): During a severe Union crisis below -60, each represented republic gains 10 points per month. Above +20 preservation, resistance falls by 5; otherwise it falls by 2. At 50, mass strikes begin; at 80, sabotage damages one infrastructure level monthly in each affected republic if a suitable owned and controlled state exists. Republic councils immediately reduce their own resistance by 15.\n\nResistance by republic: Russia [?sr_resistance_russia|0]; Ukraine [?sr_resistance_ukraine|0]; Belarus [?sr_resistance_belarus|0]; Georgia [?sr_resistance_georgia|0]; Armenia [?sr_resistance_armenia|0]; Azerbaijan [?sr_resistance_azerbaijan|0]; Kazakhstan [?sr_resistance_kazakhstan|0]; Uzbekistan [?sr_resistance_uzbekistan|0]; Turkmenistan [?sr_resistance_turkmenistan|0]; Kyrgyzstan [?sr_resistance_kyrgyzstan|0]; Tajikistan [?sr_resistance_tajikistan|0]; Estonia [?sr_resistance_estonia|0]; Latvia [?sr_resistance_latvia|0]; Lithuania [?sr_resistance_lithuania|0]; Moldavia [?sr_resistance_moldavia|0]."
 sr_union_council_ready_tt:0 "At least 180 days have passed since the previous republic council."
 sr_union_council_protection_tt:0 "This republic contributes no monthly neglect pressure for 180 days."
 sr_union_emergency_congress:0 "Convene an Emergency Union Congress"
 sr_union_emergency_congress_desc:0 "An emergency congress enables concessions and new agreements: 15 points toward preservation, at the cost of 2 percentage points of stability from public political conflict. Costs 125 political power; available once every 365 days."
 sr_union_consult_russia:0 "Republic Council: Russian Republic"
 sr_union_consult_russia_desc:0 "Lito listens to the republic’s representatives and negotiates shared goals. Spend 35 political power to shift the balance 3 points toward preservation. Russian Republic: no monthly neglect contribution for 180 days. The council can then be convened again.\n\nCurrent resistance: [?sr_resistance_russia|0]/100. A republic council immediately reduces it by 15 points."
