 sr_union_council:0 "Litos Unionsrat"
 sr_union_council_desc:0 "Die gemeinsame Balance steht für den Zusammenhalt aller vertretenen Unionsrepubliken. Jeder Republikrat stärkt die Erhaltung und schützt seine Republik 180 Tage vor ihrem monatlichen Beitrag zum Einbruch.\n\nMonatlich: 0,5 Punkte zum Einbruch, zusätzlich 0,2 je vertretener Republik ohne aktuellen Rat. Krieg und Stabilität unter 40 % kosten jeweils 1 weiteren Punkt; Stabilität über 60 % bringt 1 Punkt zur Erhaltung.\n\nRussland, Ukraine, Belarus, Georgien, Armenien, Aserbaidschan, Kasachstan, Usbekistan, Turkmenistan, Kirgisistan und Tadschikistan gehören zur frühen Föderalreform dieser Zeitlinie. Estland, Lettland, Litauen und Moldau werden nur vertreten, wenn die Sowjetunion dort Kerngebiete besitzt. Jugoslawien ist ein möglicher Partner, keine Unionsrepublik.\n\nAm linken Rand drohen schwere Krisen-Mali. Republiken treten dadurch nicht automatisch aus der Union aus.\n\nWiderstand (0–100): In einer schweren Unionskrise unter -60 steigt er monatlich um 10 Punkte je vertretener Republik. Über +20 Erhaltung sinkt er um 5, sonst um 2 Punkte. Ab 50 Punkten entstehen Massenstreiks; ab 80 folgen Sabotagen mit monatlich einem Infrastrukturschaden in jeder betroffenen Republik, sofern ein eigenes kontrolliertes Gebiet vorhanden ist. Republikräte senken den jeweiligen Widerstand sofort um 15 Punkte.\n\nWiderstand der Republiken: Russland [?sr_resistance_russia|0]; Ukraine [?sr_resistance_ukraine|0]; Belarus [?sr_resistance_belarus|0]; Georgien [?sr_resistance_georgia|0]; Armenien [?sr_resistance_armenia|0]; Aserbaidschan [?sr_resistance_azerbaijan|0]; Kasachstan [?sr_resistance_kazakhstan|0]; Usbekistan [?sr_resistance_uzbekistan|0]; Turkmenistan [?sr_resistance_turkmenistan|0]; Kirgisistan [?sr_resistance_kyrgyzstan|0]; Tadschikistan [?sr_resistance_tajikistan|0]; Estland [?sr_resistance_estonia|0]; Lettland [?sr_resistance_latvia|0]; Litauen [?sr_resistance_lithuania|0]; Moldau [?sr_resistance_moldavia|0]."
 sr_union_council_ready_tt:0 "Der letzte Republikrat liegt mindestens 180 Tage zurück."
 sr_union_council_protection_tt:0 "Diese Republik trägt 180 Tage lang nicht zur monatlichen Vernachlässigung der Union bei."
 sr_union_emergency_congress:0 "Außerordentlichen Unionskongress einberufen"
 sr_union_emergency_congress_desc:0 "Ein Krisenkongress ermöglicht Zugeständnisse und neue Vereinbarungen: 15 Punkte zur Erhaltung, aber 2 Prozentpunkte Stabilitätsverlust durch den offenen Machtstreit. Kostet 125 politische Macht und ist einmal pro 365 Tage verfügbar."
 sr_union_consult_russia:0 "Republikrat: Russische Republik"
 sr_union_consult_russia_desc:0 "Lito hört die Vertreter der Republik an und verhandelt gemeinsame Ziele. Für 35 politische Macht verschiebt sich die Balance um 3 Punkte zur Erhaltung. Russische Republik: 180 Tage ohne ihren monatlichen Vernachlässigungsbeitrag. Danach kann der Rat erneut einberufen werden.\n\nAktueller Widerstand: [?sr_resistance_russia|0]/100. Ein Republikrat senkt ihn sofort um 15 Punkte."
