l_german:
 sr_cd_1_t:0 "Die Verfassung kommt in die Werkhalle"
 sr_cd_1_workers_d:0 "Die Delegierten bringen das Protokoll jener Werkversammlung mit, bei der Lito den Beschäftigten das letzte Wort gab. Jetzt legt eine Werkzeugmacherin die neue Verfassung daneben. Ihr Rat habe einen Direktor abgewählt; das Parteikomitee habe die Entscheidung am nächsten Morgen aufgehoben.\n\n'Gilt die Verfassung auch dann', fragt sie, 'wenn der Beschluss der Partei nicht gefällt?' Der zuständige Sekretär warnt vor unterbrochenen Lieferketten. Er bestreitet nicht das Recht auf Beratung. Er bestreitet, dass eine Werkhalle allein über einen unionsweiten Plan entscheiden dürfe.\n\nAus Litos damaliger Antwort soll nun eine Regel werden. Ein verbindliches Verfahren kostet Zeit und Mittel. Ein Parteiveto hält den Plan zusammen, lässt aber die alte Zusage kleiner werden."
 sr_cd_1_director_d:0 "Lito hatte dem Direktor die Verantwortung für den Produktionsplan gelassen. Seit der neuen Verfassung bestreiten mehrere Betriebsräte, dass dies ein unbefristetes Vetorecht einschließe. Eine Delegation hat einen Direktor gewählt, dessen Ernennung das Parteikomitee verweigert.\n\n'Damals ging es um eine Turbine', sagt ein Delegierter. 'Heute geht es darum, wer unsere Stimme überstimmen darf.' Der Parteisekretär erinnert an die Zusage verlässlicher Führung. Lito kennt beide Unterschriften: die unter dem Lieferplan und die unter der Verfassung.\n\nEr kann einen finanzierten Beschwerdeweg mit bindenden Ratsentscheidungen schaffen. Oder er erklärt, dass die Partei im Streitfall das letzte Wort behält."
 sr_cd_1_a:0 "Die Stimme des Rates muss auch gegen ein Parteikomitee gelten. (60 politische Macht)"
 sr_cd_1_b:0 "Die Partei verantwortet den gemeinsamen Plan und behält das Vetorecht."
 sr_cd_council_review_tt:0 "Nach 120 Tagen berichten Betriebsräte und Parteikomitees über die neue Ordnung. Die Folgereaktion hängt von dieser Entscheidung ab; nach weiteren 120 Tagen wird über einen dauerhaften Beschwerdeweg entschieden."
 sr_cd_2_t:0 "Vier Monate unter der neuen Regel"
 sr_cd_2_binding_d:0 "Die ersten Wochen waren unbequem. Drei Lieferpläne wurden neu verhandelt, Sitzungen dauerten bis in die Nacht, und ein Direktor musste eine abgelehnte Entscheidung erklären. Im Bericht steht aber auch, dass zwei Werke ihre eigenen Verbesserungen an andere Betriebe weitergegeben haben.\n\nDie Delegierte von damals schickt Lito keinen Dankesbrief. Sie schickt die Geschäftsordnung ihres Rates mit Korrekturen am Rand. Die Beschäftigten haben begonnen, sich auf Verfahren zu verlassen, die sie selbst anwenden können. Die Parteikomitees verlangen dafür mehr Personal zur Abstimmung zwischen den Betrieben."
 sr_cd_2_veto_d:0 "Die Lieferzahlen sehen ordentlich aus. Die Protokolle der Betriebsräte werden dagegen dünner. Ein Rat hat seinen Antrag auf eine neue Schichtordnung dreimal eingereicht und dreimal ohne schriftliche Begründung zurückbekommen.\n\nDie Werkzeugmacherin bittet erneut um ein Gespräch. 'Wenn ein Nein nie erklärt werden muss, brauchen wir den Antrag nicht mehr zu schreiben.' Das Parteikomitee hält dagegen, die geltende Ordnung habe Engpässe verhindert.\n\nLito kann das Veto jetzt durch ein verbindliches Beschwerdeverfahren ersetzen. Der politische Aufwand ist geringer als eine neue Verfassung, aber die Änderung wäre ein öffentliches Eingeständnis."
 sr_cd_2_a:0 "Die Ordnung bleibt verbindlich. Gebt den Komitees Mittel zur Abstimmung."
 sr_cd_2_b:0 "Das Veto wird begründet und anfechtbar. Wir ändern den Kurs. (40 politische Macht)"
 sr_cd_2_c:0 "Die Lieferpläne zeigen, warum wir diese Ordnung brauchen."
 sr_cd_3_t:0 "Wer entscheidet, wenn Lito nicht im Zimmer ist?"
 sr_cd_3_rules_d:0 "Die Verfassungskommission legt ein schmales Heft vor. Es beschreibt Fristen für Beschwerden, Zuständigkeiten und das Recht auf eine schriftliche Antwort. Einige Parteifunktionäre halten es für unnötig: Lito könne besonders schwierige Fälle weiterhin persönlich entscheiden.\n\nDer Vorsitzende eines Betriebsrats widerspricht. 'Dann gilt unser Recht nur so lange, wie wir einen Termin bei ihm bekommen.' Lito blättert durch das Heft. Eine veröffentlichte Ordnung bindet auch seine eigenen Möglichkeiten ein. Persönliche Schlichtung ist schneller und politisch bequemer. Sie lässt die Union jedoch an seiner Tür warten."
 sr_cd_3_personal_d:0 "Seit dem Parteiveto treffen immer mehr Eingaben direkt in Litos Büro ein. Seine Sekretäre sortieren sie nach Dringlichkeit. Ein verärgerter Betriebsrat hat auf den Umschlag geschrieben: 'Für die Verfassung zuständig: der Vorsitzende persönlich.'\n\nDie Verfassungskommission bietet einen geregelten Beschwerdeweg an. Seine Veröffentlichung kostet politische Kraft und beendet das uneingeschränkte Veto. Einige Parteifunktionäre warnen, Lito gebe damit eine seiner wirksamsten Möglichkeiten zur Schlichtung auf.\n\nDer Stapel auf dem Tisch wird während des Gesprächs nicht kleiner."
 sr_cd_3_a:0 "Veröffentlicht die Beschwerdeordnung. Sie gilt auch ohne meinen Termin. (50 politische Macht)"
 sr_cd_3_b:0 "Die schwierigen Fälle bleiben vorerst auf meinem Schreibtisch."
 sr_cd_11_t:0 "Drei Delegationen, drei Aktenordner"
 sr_cd_11_d:0 "Die Delegationen aus den noch vertretenen Republiken kommen mit unterschiedlichen Unterlagen. Die Ukraine spricht über zugesagte Werkstätten, Georgien über Kulturrechte, Kasachstan über Verkehrswege. Wo eine Zusage erfüllt wurde, fragen die Delegierten, ob sie darauf künftig einen Anspruch haben. Wo die Frist verstrich, wollen sie wissen, warum ein anderer Antrag Vorrang erhielt.\n\nEin Referent schlägt vor, jeden Fall getrennt zu beantworten. Die Delegationen bestehen auf einer gemeinsamen Sitzung: Erst der Vergleich zeige, ob Litos Union alle nach demselben Maßstab behandle. Eine Kommission bindet für drei Monate politische Arbeitskraft. Ohne sie bleibt die Vergabe bei den einzelnen Ressorts."
 sr_cd_11_a:0 "Alle Akten kommen auf denselben Tisch. (50 politische Macht)"
 sr_cd_11_b:0 "Die Ressorts sollen ihre Programme weiterführen. Ein Vergleich hält nur auf."
 sr_cd_republic_hearing_tt:0 "In 90 Tagen folgt der Vergleichsbericht. Bereits erfüllte und gebrochene Zusagen bleiben dabei relevant. Wird auf die Anhörung verzichtet, steigt der Widerstand noch vertretener Republiken mit gebrochener Zusage um 10."
 sr_cd_12_t:0 "Die Zeile zwischen Anspruch und Ausnahme"
 sr_cd_12_hearing_d:0 "Die Kommission hat die Akten nicht vereinheitlicht. Sie hat sichtbar gemacht, wo die gleiche Formulierung Unterschiedliches bedeutete. Eine bewilligte Fabrik war eine dauerhafte Investition; ein Kulturrecht konnte eine neue Ressortanweisung wieder einschränken. Nicht eingelöste Zusagen fanden sich in keinem gemeinsamen Register.\n\nDie Delegationen verlangen nun einen schriftlichen Ausgleich und verlässliche Zuständigkeiten. Ein Ressortleiter warnt, garantierte Verfahren kosteten täglich politische Arbeit. Er möchte neue Mittel weiter nach kurzfristiger Produktionsleistung vergeben. Lito kann den Vergleich in eine bindende Ordnung übersetzen oder ihn als Material für den nächsten Plan ablegen."
 sr_cd_12_unexamined_d:0 "Die Ressorts haben ihre Programme fortgesetzt. Auch ihre Antworten an die Republiken bleiben verschieden. Eine Delegation verweist auf eine erfüllte Zusage; die nächste legt einen Brief mit abgelaufener Frist daneben. Im Flur heißt es bereits, wer bessere Verbindungen habe, bekomme schneller einen Termin.\n\nEin schriftlicher Ausgleich wäre noch möglich. Er hilft den noch vertretenen Republiken entsprechend ihrer bisherigen Erfahrung: Erfüllte Zusagen werden zum Vorbild, gebrochene Zusagen können örtlichen Widerstand mindern. Die billigere Alternative ist ein Produktionswettbewerb um neue Mittel. Dieser dürfte die Zahlen verbessern, aber nicht das Gefühl gleicher Behandlung."
 sr_cd_12_a:0 "Die Regeln werden schriftlich festgelegt, auch für bisher übergangene Anträge. (40 politische Macht)"
 sr_cd_12_b:0 "Neue Mittel gehen dorthin, wo sie den größten Ausstoß versprechen."
 sr_cd_republic_settlement_tt:0 "Nur aktuell vertretene Republiken werden berücksichtigt: Eine früher erfüllte Zusage senkt ihren Widerstand um 5 und gibt 2 Vertrauen; eine gebrochene Zusage senkt ihren Widerstand um 10. In 150 Tagen folgt ein weiterer Bericht mit denselben, erneut geprüften regionalen Unterschieden."
 sr_cd_13_t:0 "Was aus der Vergleichsakte wurde"
 sr_cd_13_settlement_d:0 "Der zweite Bericht enthält keine großen Feiern. Er verzeichnet fristgerechte Antworten und Beschlüsse, gegen die Einspruch erhoben wurde. Wo Lito sein altes Wort gehalten hatte, wird die neue Ordnung leichter angenommen. Wo eine Zusage gebrochen worden war, bleibt die Sprache vorsichtiger. Dort zählt, dass diesmal wenigstens eine verbindliche Antwort kommt.\n\nDie Kommission nennt das keine endgültige Versöhnung. Sie nennt es einen Unterschied, den Menschen im Alltag bemerken können. Berücksichtigt werden nur Republiken, die noch zur Union gehören."
 sr_cd_13_production_d:0 "Die neuen Vergaben haben zusätzliche Fertigung ermöglicht. Die Vergleichsakte wandert trotzdem wieder auf Litos Schreibtisch. Eine Republik, deren frühere Zusage bereits unerfüllt blieb, sieht im Wettbewerb nur einen neuen Grund, warum sie warten soll. Delegierte aus inzwischen verlorenen Gebieten erscheinen nicht mehr in der Liste.\n\nDer Ressortbericht weist auf seine Produktionszahlen. Die politischen Vertreter weisen auf leere Stühle hin. Beide Unterlagen beschreiben dieselbe Entscheidung."
 sr_cd_13_a:0 "Veröffentlicht den Bericht. Auch ein begrenzter Fortschritt muss überprüfbar sein."
 sr_cd_13_b:0 "Wir tragen die politischen Kosten unserer Produktionspriorität."
 sr_cd_21_t:0 "Die Verfassung wird nicht eingezogen"
 sr_cd_21_councils_d:0 "Seit dem Kriegseintritt stapeln sich Eilbefehle neben den Protokollen der Arbeiterräte. Ein Vertreter der Rüstungsbetriebe erinnert Lito an sein Wort von der Werkversammlung: Mitsprache dürfe nicht bei der ersten schwierigen Lage enden. Der Generalstab antwortet mit Nachschubmeldungen.\n\nEin gemeinsamer Kriegsrat würde zivile Vertreter beteiligen und die Abstimmung langsamer machen. Das vorgeschlagene Notkabinett könnte Produktionsanweisungen sofort durchsetzen. Es verspricht, die Vollmachten später zurückzugeben.\n\nLito streicht das Wort 'später' an. Er kennt noch keine Frist, auf die sich alle einigen können."
 sr_cd_21_centre_d:0 "Die erste Kriegsbesprechung endet mit einer Forderung nach zusätzlichen Vollmachten. Im Entwurf des Notkabinetts stehen verkürzte Verfahren, bindende Produktionsanweisungen und die Möglichkeit, zivile Einwände zurückzustellen.\n\nDie Vertreter der Republiken verlangen einen Sitz am Tisch. Sie versprechen Mitarbeit, wollen aber Entscheidungen über ihre Betriebe nicht erst aus dem Befehlsblatt erfahren. Ein gemeinsamer Kriegsrat kostet politische Kraft und etwas Planungsgeschwindigkeit. Das Notkabinett würde sofort Ressourcen freisetzen.\n\nLito fragt, wer nach dem Krieg über die Rückgabe dieser Vollmachten entscheidet. Im Entwurf fehlt dafür noch ein Absatz."
 sr_cd_21_a:0 "Die Republiken und Räte sitzen mit am Tisch. (60 politische Macht)"
 sr_cd_21_b:0 "Das Notkabinett erhält vorläufig die nötigen Vollmachten."
 sr_cd_war_review_tt:0 "In 90 Tagen folgt ein Bericht aus den Betrieben. Weitere 120 Tage später wird die Rückgabe der Vollmachten verhandelt. Der Verlauf reagiert darauf, ob die Union dann noch Krieg führt."
 sr_cd_22_t:0 "Eine Nachtschicht schreibt zurück"
 sr_cd_22_war_d:0 "Die Werkleitung meldet einen neuen Rekord. Dem Bericht liegt ein Brief der Nachtschicht bei: dieselben Maschinen liefen länger, die Pausen seien gekürzt worden und zwei Unfälle fehlten in der Statistik. Die Werksärztin fordert Zugang zu den vollständigen Listen.\n\nDie Rüstungsverwaltung warnt, jede Überprüfung koste Fertigung. Eine finanzierte Inspektion könnte Standards durchsetzen, würde aber kurzfristig den Ausstoß senken. Eine zusätzliche Quote verspricht mehr Material für die Front. Lito kann die Verantwortung auch vor Ort lassen; dann bleibt offen, welche Meldungen sein Schreibtisch überhaupt erreicht."
 sr_cd_22_peace_d:0 "Die Frontmeldungen sind verstummt, der Brief der Nachtschicht liegt noch immer im Rüstungskommissariat. Er beschreibt gekürzte Pausen und Unfälle, die im Produktionsbericht fehlten. Die Werksärztin bittet jetzt um Einsicht in die Listen aus der Kriegszeit.\n\nEine finanzierte Inspektion würde die Ursachen offenlegen und kurzfristig die Fertigung belasten. Der Ressortleiter möchte die Untersuchung den örtlichen Stellen überlassen. Der Krieg kann als Begründung nicht mehr dienen; die Entscheidung bleibt dieselbe Frage nach Verantwortung."
 sr_cd_22_a:0 "Die Ärztin bekommt die vollständigen Listen und ein Inspektionsteam. (40 politische Macht)"
 sr_cd_22_b:0 "Die Front braucht Material. Für den nächsten Zeitraum gilt eine höhere Quote."
 sr_cd_22_c:0 "Die örtlichen Stellen sollen den Fall selbst aufklären."
 sr_cd_23_t:0 "Die Vollmachten haben einen Rückgabetermin"
 sr_cd_23_war_d:0 "Die nächste Überprüfung findet statt, während die Union noch Krieg führt. Das Notkabinett erklärt seine Aufgaben für unvollendet. Die Republiksvertreter antworten, ein unbestimmter Auftrag könne jede Befristung verschlingen. Auch dort, wo ein gemeinsamer Kriegsrat gebildet wurde, sind befristete Ausnahmen inzwischen zur Gewohnheit geworden.\n\nLito kann die zivile Kontrolle jetzt verbindlich wiederherstellen, die Ausnahme mit einer neuen Frist verlängern oder sie ohne zusätzliche Reform auslaufen lassen. Keine dieser Möglichkeiten ersetzt fehlendes Material. Sie entscheidet, welcher Teil des Regierungshandelns weiterhin erklärt werden muss."
 sr_cd_23_peace_d:0 "Die Union befindet sich wieder im Frieden. Einige Ministerien haben ihre Ausnahmeverfahren trotzdem behalten: eingespielte Abläufe, heißt es, dürfe man nicht zu früh aufgeben. Die Republiksvertreter bestehen auf dem angekündigten Rückgabetermin.\n\nLito kann die Wiederherstellung der zivilen Rechte finanzieren und Verantwortlichkeiten verbindlich ordnen. Oder er lässt die befristeten Vollmachten ohne ein zusätzliches Programm enden. Eine neue Kriegsverlängerung steht im Frieden nicht zur Verfügung. Auf der letzten Seite der Akte wartet noch immer der Absatz, der bei Kriegsbeginn fehlte."
 sr_cd_23_a:0 "Die zivile Kontrolle wird verbindlich wiederhergestellt. (30 politische Macht)"
 sr_cd_23_b:0 "Wir verlängern die Ausnahme einmalig; die Union steht noch im Krieg."
 sr_cd_23_c:0 "Die Ausnahmen laufen aus. Ein zusätzliches Programm können wir nicht finanzieren."
 sr_cd_last_review_tt:0 "Nach 120 Tagen folgt die letzte Bilanz. Eine verlängerte Ausnahme wird bei hohem Regierungsvertrauen eher geduldet; unter 55 Vertrauen belastet sie Stabilität und Produktion. Zurückgegebene Rechte stärken die Verlässlichkeit der Verfassung."
 sr_cd_24_t:0 "Ein privater Brief an den Vorsitzenden"
 sr_cd_24_decree_d:0 "Ein Delegierter schreibt Lito ohne offiziellen Briefkopf. Er habe die Kriegsanstrengung unterstützt und werde es weiter tun. Aber seine Belegschaft frage inzwischen, welche befristete Ausnahme wirklich befristet sei.\n\nDie Wirkung dieses Briefs hängt von Litos bisheriger Glaubwürdigkeit ab. Wo Vertrauen geblieben ist, wird die neue Frist widerwillig angenommen. Wo frühere Zusagen bereits Zweifel hinterließen, gilt die Verlängerung als ein weiterer Beleg dafür, dass die Zentrale ungern Rechte zurückgibt. Der Brief verlangt keine große Rede. Er verlangt, dass die nächste Zusage etwas bedeutet."
 sr_cd_24_rights_d:0 "Der Brief eines Republiksdelegierten enthält eine ungewöhnliche Bemerkung: Die örtliche Verwaltung habe einen Beschluss des Kriegsressorts aufgehoben und sei dabei nicht überstimmt worden. Er schreibt, das sei für seine Kollegen wichtiger als jede zusätzliche Rede über die Verfassung.\n\nDie Rückgabe ziviler Rechte hat Abläufe verlangsamt und einige Ressortleiter verärgert. Sie hat aber gezeigt, dass eine zeitweilige Ausnahme auch unter Lito enden kann. Im Brief steht keine Versicherung grenzenloser Treue. Es steht die Zusage, an der nächsten schwierigen Verhandlung wieder teilzunehmen."
 sr_cd_24_a:0 "Genau dafür muss die Verfassung auch in einer Krise gelten."
 sr_cd_24_b:0 "Das Vertrauen trägt die Frist. Es ist kein unbegrenzter Auftrag."
 sr_cd_24_c:0 "Die Erschöpfung ist auch eine Antwort auf unsere Entscheidungen."
 sr_cd_constitutional_debate:0 "Die Verfassung im Betrieb"
 sr_cd_constitutional_debate_desc:0 "Die Ausarbeitung verbindlicher Ratsrechte bindet vorübergehend Arbeitszeit: Fabrikausstoß −2 %, tägliche politische Macht −0,05."
 sr_cd_binding_councils:0 "Verbindliche Ratsbeschlüsse"
 sr_cd_binding_councils_desc:0 "Ein verlässliches Beschwerdeverfahren stärkt die Stabilität um 2 Prozentpunkte und bindet täglich 0,05 politische Macht."
 sr_cd_party_veto:0 "Das letzte Wort des Parteikomitees"
 sr_cd_party_veto_desc:0 "Zentrale Entscheidungen sind leichter durchzusetzen: tägliche politische Macht +0,10, Stabilität −2 Prozentpunkte."
 sr_cd_comparative_commission:0 "Vergleichskommission der Republiken"
 sr_cd_comparative_commission_desc:0 "Die gemeinsame Prüfung alter Zusagen bindet täglich 0,10 politische Macht."
 sr_cd_local_guarantees:0 "Verlässliche regionale Verfahren"
 sr_cd_local_guarantees_desc:0 "Schriftliche Zuständigkeiten stärken die Stabilität um 2 Prozentpunkte und binden täglich 0,05 politische Macht."
 sr_cd_competitive_allocations:0 "Mittel nach Produktionsleistung"
 sr_cd_competitive_allocations_desc:0 "Produktionsstarke Betriebe erhalten Vorrang: Fabrikausstoß +2,5 %, Stabilität −2 Prozentpunkte."
 sr_cd_war_councils:0 "Republiken im Kriegsrat"
 sr_cd_war_councils_desc:0 "Beteiligung stärkt die Organisation des Heeres um 2 %, erfordert aber Abstimmung: Planungsgeschwindigkeit −2 %."
 sr_cd_emergency_cabinet:0 "Vorläufiges Notkabinett"
 sr_cd_emergency_cabinet_desc:0 "Bindende Produktionsanweisungen erhöhen den Fabrikausstoß um 3 %, belasten aber die Stabilität mit −3 Prozentpunkten."
 sr_cd_labour_inspections:0 "Die Werkärztin erhält Einsicht"
 sr_cd_labour_inspections_desc:0 "Die Überprüfung von Arbeitsbedingungen senkt vorübergehend den Fabrikausstoß um 2 % und erhöht die Stabilität um 2 Prozentpunkte."
 sr_cd_wartime_quotas:0 "Zusätzliche Kriegsquote"
 sr_cd_wartime_quotas_desc:0 "Längere Fertigung erhöht den Fabrikausstoß um 4 % und senkt die Stabilität um 2 Prozentpunkte."
 sr_cd_renewed_decree:0 "Einmalig verlängerte Ausnahme"
 sr_cd_renewed_decree_desc:0 "Die verlängerte Sonderverwaltung gewährt täglich 0,10 politische Macht und kostet 3 Prozentpunkte Stabilität."
 sr_cd_returned_rights:0 "Rückkehr zur zivilen Kontrolle"
 sr_cd_returned_rights_desc:0 "Die Neuordnung erhöht die Stabilität um 2,5 Prozentpunkte; zusätzliche Abstimmung senkt den Fabrikausstoß um 1 %."
 sr_cd_constitutional_confidence:0 "Eine Verfassung, auf die man sich beruft"
 sr_cd_constitutional_confidence_desc:0 "Überprüfbare Verfahren stärken das Vertrauen in staatliche Entscheidungen: täglich +0,05 politische Macht, Stabilität +2 Prozentpunkte."
 sr_cd_emergency_fatigue:0 "Müde von der vorläufigen Ausnahme"
 sr_cd_emergency_fatigue_desc:0 "Bei geringem Vertrauen wirken verlängerte Sonderrechte wie ein weiteres gebrochenes Wort: Fabrikausstoß −2 %, Stabilität −2,5 Prozentpunkte."
