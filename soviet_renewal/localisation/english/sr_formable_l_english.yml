l_english:
 sr_formable_union:0 "A Greater Federation"
 sr_formable_union_desc:0 "Lito seeks to unite the existing Union under a new federal name. Proclamation requires direct ownership and control of all core states of Poland, Yugoslavia, Albania, Bulgaria, Greece, Romania and Turkey. Allied or subject territory does not count."
 sr_proclaim_slavic_union:0 "Proclaim the Socialist Federal Slavic Union"
 sr_proclaim_slavic_union_desc:0 "Once all listed core states belong directly to our Union and are under our control, we can proclaim the Socialist Federal Slavic Union. Military occupation alone is insufficient. This one-time proclamation costs 100 political power and grants +5 percentage points stability and 10 points toward preservation of the Union. It changes the country name and grants no additional cores. An ongoing war does not prevent it."
