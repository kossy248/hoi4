 sr_union_mass_strikes:0 "Mass Strikes Across the Union"
 sr_union_mass_strikes_desc:0 "At least one represented republic has 50 or more resistance points. Strikes slow production and construction and weaken stability. These effects end once all represented republics fall below 50."
 sr_union_sabotage_networks:0 "Regional Sabotage Networks"
 sr_union_sabotage_networks_desc:0 "At least one represented republic has 80 or more resistance points. Sabotage disrupts supplies and industrial operations. Each month, one infrastructure level is also damaged in an owned and controlled state of every affected republic. The networks lose their influence once all represented republics fall below 80."
