l_german:
 sr_formable_union:0 "Eine größere Föderation"
 sr_formable_union_desc:0 "Lito will die bestehende Union unter einem neuen föderalen Namen vereinen. Die Ausrufung setzt den direkten Besitz und die direkte Kontrolle aller Kerngebiete Polens, Jugoslawiens, Albaniens, Bulgariens, Griechenlands, Rumäniens und der Türkei voraus. Gebiete von Verbündeten oder Untertanen zählen nicht."
 sr_proclaim_slavic_union:0 "Die Sozialistische Föderale Slawische Union ausrufen"
 sr_proclaim_slavic_union_desc:0 "Die Voraussetzungen des neuen Staatenbundes sind erfüllt, sobald alle aufgelisteten Kerngebiete direkt zu unserer Union gehören und von uns kontrolliert werden. Reine militärische Besetzung genügt nicht. Für 100 politische Macht können wir die Sozialistische Föderale Slawische Union einmalig ausrufen: +5 Prozentpunkte Stabilität und 10 Punkte zur Erhaltung der Union. Die Ausrufung ändert den Staatsnamen und gewährt keine zusätzlichen Kerngebiete. Ein laufender Krieg verhindert sie nicht."
